<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>庄頭報社</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#8FD3E8; --sky2:#BFE9F2; --sun:#FFD98A; --coral:#FF9E7D; --rose:#FFB8A8;
    --leaf:#9FD9A8; --leaf2:#6FBF8A; --cream:#FFF8EC; --sand:#FFEFD4;
    --ink:#4A4038; --dim:#9A8C7C; --line:#F0DCC0; --gold:#E8A94C; --deep:#3E7A96;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:linear-gradient(170deg,#8FD3E8,#BFE9F2 45%,#DFF3F0);
    font-family:"Noto Sans TC",system-ui,sans-serif;color:var(--ink);
    min-height:100vh;padding:18px;display:flex;justify-content:center;position:relative;overflow-x:hidden}
  /* 背景水波摎花 */
  .bg{position:fixed;inset:0;pointer-events:none;z-index:0}
  .frame{position:relative;z-index:1;width:100%;max-width:1120px}

  /* 報頭 */
  .head{background:var(--cream);border-radius:26px;padding:18px 26px;display:flex;align-items:center;
    gap:16px;flex-wrap:wrap;box-shadow:0 12px 30px rgba(62,122,150,.22);border:3px solid #fff}
  .head h1{font-family:"Noto Serif TC",serif;font-size:26px;font-weight:900;letter-spacing:.24em;color:var(--deep)}
  .head .sub{font-size:11px;letter-spacing:.2em;color:var(--dim);margin-top:2px}
  .legend{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .lg{display:flex;align-items:center;gap:7px;background:#fff;border-radius:14px;padding:6px 11px;
    box-shadow:0 3px 9px rgba(62,122,150,.12)}
  .lg svg{width:26px;height:26px;flex:0 0 auto}
  .lg b{display:block;font-family:"Noto Serif TC",serif;font-size:12.5px;font-weight:900;line-height:1.3}
  .lg span{display:block;font-size:10.5px;color:var(--dim);line-height:1.35;white-space:nowrap}
  @media(max-width:1080px){.legend{order:3;width:100%;margin-left:0;justify-content:flex-start}}
  .stats{display:flex;gap:9px}
  .st{background:var(--sand);border-radius:16px;padding:8px 16px;text-align:center;min-width:76px;
    box-shadow:inset 0 -2px 0 rgba(232,169,76,.28)}
  .st span{display:block;font-size:9.5px;letter-spacing:.16em;color:var(--dim)}
  .st b{display:block;font-family:"Noto Serif TC",serif;font-size:20px;font-weight:900;color:var(--gold)}
  .st b.up{animation:pp .5s} @keyframes pp{45%{transform:scale(1.4);color:var(--leaf2)}}

  .wrap{display:grid;grid-template-columns:236px 1fr;gap:14px;margin-top:14px}
  @media(max-width:880px){.wrap{grid-template-columns:1fr}}

  .panel{background:var(--cream);border-radius:24px;padding:16px;border:3px solid #fff;
    box-shadow:0 12px 30px rgba(62,122,150,.2)}
  .panel h2{font-family:"Noto Serif TC",serif;font-size:14px;font-weight:900;letter-spacing:.2em;
    color:var(--deep);margin-bottom:12px;display:flex;align-items:center;gap:7px}
  .panel h2::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--coral)}

  .sto{background:#fff;border-radius:16px;padding:11px 13px;margin-bottom:9px;cursor:pointer;
    transition:.2s;border:2px solid transparent}
  .sto:hover{border-color:var(--sun);transform:translateY(-3px);box-shadow:0 6px 16px rgba(232,169,76,.24)}
  .sto.on{border-color:var(--coral);background:#FFF4EE}
  .sto.done{opacity:.55}
  .lg{font-size:11.5px;color:var(--dim);line-height:1.6;padding:6px 9px;background:var(--sand);border-radius:9px}
  .lg b{color:var(--gold)}
  .sto.free{border-color:#6FBF8A;background:#EDF8EF}
  .sto.rush{border-color:#F7955C;background:#FFF3EC}
  .sto.scoop{border-color:#E8A94C;background:#FFF8E8}
  .sto.race{border-color:#C46A8A;background:#FDF0F4}
  .sto.gone{opacity:.35;text-decoration:line-through;pointer-events:none}
  .evt{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:10px;
    display:flex;gap:10px;align-items:center;border:2px solid var(--sun)}
  .evt svg{width:36px;height:36px;flex:0 0 auto}
  .evt b{font-family:"Noto Serif TC",serif;font-size:15px;display:block}
  .evt small{font-size:11.5px;color:var(--dim);line-height:1.6}
  .sto.lock{opacity:.5;cursor:not-allowed;background:#F7F2EA}
  .sto.lock:hover{transform:none;border-color:transparent;box-shadow:none}
  .sto b{font-family:"Noto Serif TC",serif;font-size:15px;font-weight:900;display:block}
  .sto small{font-size:10.5px;color:var(--dim)}
  .sto .tag{display:inline-block;background:var(--sand);border-radius:999px;padding:2px 9px;
    font-size:10px;color:var(--gold);margin-top:5px}

  .stage{background:var(--cream);border-radius:24px;padding:20px 22px;border:3px solid #fff;
    box-shadow:0 12px 30px rgba(62,122,150,.2);min-height:620px;max-height:88vh;display:flex;flex-direction:column}
  .steps{display:flex;gap:6px;margin-bottom:16px}
  .sp{flex:1;text-align:center;padding:8px 4px;border-radius:14px;background:#fff;font-size:11.5px;
    color:var(--dim);border:2px solid transparent;transition:.25s}
  .sp b{display:block;font-family:"Noto Serif TC",serif;font-size:15px;font-weight:900;color:var(--dim)}
  .sp.on{background:var(--sand);border-color:var(--gold)}
  .sp.on b{color:var(--gold)}
  .sp.ok{background:#EAF7EC;border-color:var(--leaf2)}
  .sp.ok b{color:var(--leaf2)}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;min-height:0}
  @media(max-width:820px){.two{grid-template-columns:1fr}}
  .ref{display:flex;flex-direction:column;min-height:0}
  .ref .read{flex:1;max-height:none;overflow-y:auto}
  .work{display:flex;flex-direction:column;min-height:0;overflow-y:auto}
  .lbl{font-size:10.5px;letter-spacing:.2em;color:var(--dim);margin-bottom:8px}
  .read{background:#fff;border-radius:18px;padding:14px 16px;max-height:340px;overflow-y:auto}
  .ln{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
  .ln:last-child{border:0}
  .ln .n{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--sand);color:var(--gold);
    display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;margin-top:3px}
  .ln .t{flex:1;font-family:"Noto Serif TC",serif;font-size:16.5px;line-height:1.95}
  .ln .p{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);
    background:#fff;cursor:pointer;font-size:12px;color:var(--dim);transition:.16s}
  .ln .p:hover{border-color:var(--coral);color:var(--coral);transform:scale(1.12)}
  .ln.play{background:#FFF9F0;border-radius:10px}

  .cards{display:flex;flex-direction:column;gap:9px}
  .cd{background:#fff;border-radius:15px;padding:12px 15px;cursor:grab;font-family:"Noto Serif TC",serif;
    font-size:16px;display:flex;align-items:center;gap:11px;border:2px solid transparent;transition:.18s;
    box-shadow:0 3px 10px rgba(62,122,150,.1)}
  .cd:hover{border-color:var(--sun)}
  .cd .h{width:26px;height:26px;border-radius:9px;background:var(--sand);color:var(--gold);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:0 0 auto}
  .cd.drag{opacity:.4}
  .cd.over{border-color:var(--coral)}

  .yn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .bin{background:#fff;border-radius:18px;padding:13px;min-height:170px;border:2.5px dashed var(--line)}
  .bin.hot{border-color:var(--coral);background:#FFF6F2}
  .bin h3{font-family:"Noto Serif TC",serif;font-size:15px;font-weight:900;text-align:center;margin-bottom:9px}

  .qz{background:#fff;border-radius:18px;padding:16px 18px;margin-bottom:11px}
  .qz .q{font-family:"Noto Serif TC",serif;font-size:17px;font-weight:700;margin-bottom:11px;line-height:1.8}
  .op{background:var(--sand);border-radius:13px;padding:11px 15px;margin-bottom:7px;cursor:pointer;
    font-family:"Noto Serif TC",serif;font-size:15.5px;transition:.16s;border:2px solid transparent}
  .op:hover{border-color:var(--sun);transform:translateX(4px)}
  .op.ok{background:#EAF7EC;border-color:var(--leaf2)}
  .op.no{background:#FFEDE8;border-color:var(--coral)}

  .desks{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .dk{background:#fff;border-radius:18px;padding:15px 16px;cursor:pointer;border:2.5px solid transparent;
    transition:.2s;box-shadow:0 4px 12px rgba(62,122,150,.1)}
  .dk:hover{border-color:var(--coral);transform:translateY(-4px);box-shadow:0 10px 22px rgba(255,158,125,.28)}
  .dn{font-family:"Noto Serif TC",serif;font-size:19px;font-weight:900;color:var(--deep)}
  .dd{font-size:12.5px;color:var(--dim);margin-top:4px}
  .dw{font-size:11.5px;color:var(--gold);margin-top:7px;background:var(--sand);
    border-radius:999px;padding:3px 10px;display:inline-block}
  .front{background:#fff;border-radius:18px;padding:20px;border:2px solid var(--line)}
  .fh{text-align:center;border-bottom:3px double var(--line);padding-bottom:12px;margin-bottom:14px}
  .fh b{font-family:"Noto Serif TC",serif;font-size:22px;font-weight:900;letter-spacing:.2em;color:var(--deep)}
  .fh small{display:block;font-size:10.5px;color:var(--dim);letter-spacing:.16em;margin-top:3px}
  .slot{border:2.5px dashed var(--line);border-radius:14px;padding:14px;min-height:64px;
    display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:13px;margin-bottom:10px}
  .slot.hot{border-color:var(--coral);background:#FFF6F2}
  .slot.full{border-style:solid;border-color:var(--leaf2);background:#F4FBF5;color:var(--ink);
    font-family:"Noto Serif TC",serif;font-size:16px;text-align:left;justify-content:flex-start}
  .slot.lead.full{font-size:19px;font-weight:900}

  .foot{margin-top:auto;padding-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .note{font-size:12.5px;color:var(--dim);flex:1;min-width:210px;line-height:1.65}
  .btn{border:0;border-radius:999px;padding:12px 30px;font-weight:700;font-size:14.5px;cursor:pointer;
    font-family:"Noto Sans TC";background:linear-gradient(180deg,#FFB98A,#F7955C);color:#fff;
    box-shadow:0 6px 16px rgba(247,149,92,.42)}
  .btn:disabled{opacity:.35;box-shadow:none;cursor:default}
  .btn.g{background:#fff;color:var(--dim);border:2px solid var(--line);box-shadow:none}

  .pop{position:fixed;inset:0;z-index:60;background:rgba(62,122,150,.42);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:.4s}
  .pop.on{opacity:1;pointer-events:auto}
  .pc{background:var(--cream);border-radius:26px;max-width:520px;width:100%;padding:26px 28px;text-align:center;
    border:4px solid #fff;box-shadow:0 26px 60px rgba(0,0,0,.3);transform:translateY(26px) scale(.94);
    transition:.55s cubic-bezier(.2,1.2,.3,1)}
  .pop.on .pc{transform:none}
  .env{position:relative}
  .envbg{position:absolute;inset:-10px -6px auto -6px;width:calc(100% + 12px);opacity:.55}
  .envfg{position:relative}
  .lq{font-family:"Noto Serif TC",serif;font-size:18px;font-weight:700;line-height:1.8;
    margin:12px 0 14px;padding:12px 15px;background:rgba(255,255,255,.8);border-radius:12px}
  .pc h2{font-family:"Noto Serif TC",serif;font-size:24px;font-weight:900;color:var(--deep);letter-spacing:.1em}
  .pc p{font-size:13.5px;color:var(--dim);line-height:1.9;margin-top:9px}
  .react{display:flex;flex-direction:column;gap:8px;margin-top:14px;text-align:left}
  .rc{background:#fff;border-radius:14px;padding:11px 14px;display:flex;gap:10px;align-items:center;font-size:13.5px}
  .rc svg{width:34px;height:34px;flex:0 0 auto}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<svg class="bg" id="bg"></svg>
<div class="frame">
  <div class="head">
    <svg viewBox="0 0 60 60" style="width:52px;height:52px">
      <circle cx="30" cy="30" r="28" fill="#FFEFD4"/>
      <rect x="14" y="18" width="30" height="26" rx="3" fill="#fff" stroke="#E8A94C" stroke-width="2"/>
      <g stroke="#9A8C7C" stroke-width="2" stroke-linecap="round"><path d="M19 26h14M19 32h20M19 38h12"/></g>
      <rect x="34" y="22" width="8" height="8" rx="1.5" fill="#FF9E7D"/></svg>
    <div><h1>庄頭報社</h1><div class="sub">第 <b id="season">1</b> 季　·　HAKKA VILLAGE PRESS</div></div>

    <div class="legend">
      <div class="lg">
        <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#FFEDE8"/>
          <circle cx="24" cy="25" r="14" fill="none" stroke="#F7955C" stroke-width="3.5"/>
          <path d="M24 17v9l6 4" stroke="#F7955C" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <path d="M17 7l-5 5M31 7l5 5" stroke="#F7955C" stroke-width="3.5" stroke-linecap="round"/></svg>
        <div><b>急稿</b><span>查證只答一題就發行</span></div></div>
      <div class="lg">
        <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#FFF3D4"/>
          <path d="M24 10 l4.5 10 11 1 -8.5 7.5 2.6 10.8L24 33.5 14.4 39.3 17 28.5 8.5 21l11-1Z" fill="#E8A94C"/></svg>
        <div><b>獨家</b><span>讀者加倍，門檻 +15</span></div></div>
      <div class="lg">
        <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#FBE4EC"/>
          <path d="M16 10v28" stroke="#C46A8A" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M16 12h18l-4 6 4 6H16Z" fill="#C46A8A"/></svg>
        <div><b>搶稿</b><span>兩期內沒做就被搶走</span></div></div>
    </div>

    <div class="stats">
      <div class="st"><span>發 行</span><b id="issue">0</b></div>
      <div class="st"><span>讀 者</span><b id="readers">120</b></div>
      <div class="st"><span>信 用</span><b id="trust">50</b></div>
      <div class="st" style="background:#F0E6EC;box-shadow:inset 0 -2px 0 rgba(196,106,138,.3)">
        <span>庄西報</span><b id="rival" style="color:#C46A8A">120</b></div>
      <button id="mus" style="border:0;background:var(--sand);border-radius:16px;padding:8px 15px;
        font-size:12.5px;color:var(--gold);cursor:pointer;font-family:'Noto Sans TC';font-weight:700">♪ 關</button>
    </div>
  </div>

  <div class="wrap">
    <div class="panel">
      <h2>今 期 選 題</h2>
      <div id="evt"></div>
      <div id="list"></div>
      <div style="margin-top:10px;display:flex;gap:8px;align-items:center">
        <div style="flex:1;font-size:11.5px;color:var(--dim)">已發行
          <b id="dn" style="color:var(--leaf2);font-family:'Noto Serif TC',serif;font-size:15px">0</b>
          / <span id="tt">0</span>　<span style="color:var(--dim)">（這季賰 <b id="lf">0</b> 篇）</span></div>
        <button id="redeal" style="border:2px solid var(--line);background:#fff;color:var(--dim);
          border-radius:999px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:'Noto Sans TC'">
          換一批（信用 -2）</button>
      </div>
      <div style="margin-top:10px;background:#fff;border-radius:14px;padding:11px 13px">
        <div style="font-size:10.5px;letter-spacing:.16em;color:var(--dim);margin-bottom:7px">記 事</div>
        <div id="log" style="max-height:150px;overflow-y:auto;display:flex;flex-direction:column;gap:5px"></div>
      </div>
      <div style="margin-top:10px;background:#fff;border-radius:14px;padding:11px 13px">
        <div style="font-size:10.5px;letter-spacing:.16em;color:var(--dim)">讀 者 目 標</div>
        <div style="position:relative;height:9px;border-radius:99px;background:var(--sand);margin-top:6px">
          <i id="gbar" style="display:block;height:100%;width:10%;border-radius:99px;
            background:linear-gradient(90deg,#FFB8A8,#FFD98A,#9FD9A8);transition:.6s"></i>
          <i id="rbar" style="position:absolute;top:-3px;width:3px;height:15px;border-radius:2px;
            background:#C46A8A;left:10%;transition:.6s"></i></div>
        <div style="font-size:11px;color:var(--dim);margin-top:5px">
          <b id="gnow" style="color:var(--gold)">120</b> / 900 人
          <span style="color:#C46A8A;margin-left:6px">｜庄西報 <b id="rnow">120</b></span></div>
        <p style="font-size:11px;color:var(--dim);line-height:1.7;margin-top:9px">
          <b style="color:var(--deep)">信用</b> 決定你接得起哪篇稿<br>
          信用無罅个時節，庄民會介紹一篇分你<br>
          <b style="color:var(--deep)">讀者</b> 做到 900 就係通關</p>
      </div>
    </div>
    <div class="stage" id="stage"></div>
  </div>
</div>
<div class="pop" id="pop"><div class="pc" id="pc"></div></div>

<script>

/* 輕鬆个背景樂：大調五聲，程式生成 */
let AC=null,musOn=false,musT=null,musG=null,beat=0;
const NOTE=[523.25,587.33,659.25,783.99,880.00,1046.50,1174.66];
const LOW=[130.81,146.83,164.81,196.00];
function bell(f,t,g,dur){
  if(!AC) return;
  const o=AC.createOscillator(),o2=AC.createOscillator(),gn=AC.createGain(),lp=AC.createBiquadFilter();
  o.type="sine"; o.frequency.value=f;
  o2.type="triangle"; o2.frequency.value=f*2.01;
  lp.type="lowpass"; lp.frequency.value=3200;
  gn.gain.setValueAtTime(0,t);
  gn.gain.linearRampToValueAtTime(g,t+.015);
  gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  const g2=AC.createGain(); g2.gain.value=.35;
  o.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(gn).connect(musG);
  o.start(t);o2.start(t);o.stop(t+dur+.05);o2.stop(t+dur+.05);
}
function musStep(){
  if(!musOn||!AC) return;
  const t=AC.currentTime+.03,b=beat%8;
  if(b===0) bell(LOW[(beat>>3)%4],t,.30,1.9);
  if(b%2===0) bell(NOTE[Math.floor(Math.random()*5)],t,.24,1.2);
  if(b===3||b===7) bell(NOTE[Math.floor(Math.random()*3)+3],t+.15,.17,1.0);
  beat++; musT=setTimeout(musStep,340);
}
function toggleMus(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    if(!musG){ musG=AC.createGain(); musG.gain.value=.55; musG.connect(AC.destination); }
    musOn=!musOn; $("mus").textContent=musOn?"♪ 開":"♪ 關";
    $("mus").style.background=musOn?"#FFD98A":"var(--sand)";
    if(musOn) musStep(); else clearTimeout(musT);
  }catch(e){}
}
function log(h){
  const box=document.getElementById("log"); if(!box) return;
  const d=document.createElement("div"); d.className="lg"; d.innerHTML=h;
  box.prepend(d); while(box.children.length>30) box.lastChild.remove();
}

      <small>做這篇讀者加倍，但信用門檻臨時 <b>+15</b>。</small></div></div>`;}
  if(raceK&&!doneSet.has(raceK)&&!lostK.has(raceK)){const t=(STORY.find(x=>x.k===raceK)||{}).title||"";
    h+=`<div class="evt" style="border-color:#C46A8A">${EVICON.race}<div><b>同業搶稿：${t}</b>
      <small>還剩 <b>${raceLeft}</b> 期，沒做就被別家報社搶走。</small></div></div>`;}
  $("evt").innerHTML=h;
}
/* 對手報社：逐期成長，乜會出錯 */
function rivalTurn(){
  if(Math.random()<0.20){
    const d=-40+Math.floor(Math.random()*30);
    rival=Math.max(0,rival+d);
    rivalLog=`庄西報登毋著版，分讀者投書罵 —— 佢兜个讀者 ${d} 人。`;
  }else{
    const d=70+Math.floor(Math.random()*30);
    rival+=d;
    rivalLog=`庄西報這期出街，讀者 +${d} 人。`;
  }
  bump("rival",rival);
  $("rnow").textContent=rival;
  $("rbar").style.left=Math.min(100,rival/GOAL*100)+"%";
  log(`<b style="color:#C46A8A">庄西報</b>　${rivalLog}`);
}
function rollEvents(){
  rushK=null;
  if(Math.random()<0.15){
    const c=livePool().filter(x=>!doneSet.has(x.k)&&!lostK.has(x.k));
    if(c.length) rushK=c[Math.floor(Math.random()*c.length)].k;
  }
  if(raceK){
    if(doneSet.has(raceK)) raceK=null;
    else { raceLeft--; if(raceLeft<=0){ lostK.add(raceK); raceK=null; } }
  }
  if(!raceK){
    const cand=livePool().filter(x=>!doneSet.has(x.k)&&!lostK.has(x.k)&&x.k!==scoopK&&trust>=NEED(x));
    if(cand.length&&Math.random()<0.05){ raceK=cand[Math.floor(Math.random()*cand.length)].k; raceLeft=2; }
  }
}
function quit(){ cur=null; step=0; publishing=false; refScroll=0; workScroll=0; paintList(); render(); }
/* 今期委託板：抽五篇，三種型態盡量齊，事件稿一定在 */
function livePool(){ return STORY.filter(s=>!cleared.has(s.k)); }
function dealBoard(){
  const avail=livePool().filter(s=>!doneSet.has(s.k)&&!lostK.has(s.k));
  const canDo=s=>{let nd=NEED(s); if(s.k===scoopK) nd+=15; return trust>=nd;};
  const forced=avail.filter(s=>[rushK,scoopK,raceK].includes(s.k));
  const pool=avail.filter(s=>!forced.includes(s)).sort(()=>Math.random()-.5);
  const pick=[...forced];
  ["seq","yn","lu"].forEach(m=>{
    const c=pool.find(s=>s.mode===m&&canDo(s)&&!pick.includes(s));
    if(c&&pick.length<5) pick.push(c);
  });
  for(const s of pool){ if(pick.length>=5) break;
    if(!pick.includes(s)&&canDo(s)) pick.push(s); }
  for(const s of pool){ if(pick.length>=5) break;
    if(!pick.includes(s)) pick.push(s); }
  board=pick.slice(0,5);
}
function paintList(){
  // 保底：板頂這幾篇若係一篇都接毋起，就開放上便宜該篇
  const onBoard=board.filter(s=>!doneSet.has(s.k)&&!lostK.has(s.k));
  const need=s=>NEED(s)+(s.k===scoopK?15:0);
  const anyOpen=onBoard.some(s=>trust>=need(s));
  const freeK=(!anyOpen&&onBoard.length)
    ? onBoard.reduce((a,b)=>need(b)<need(a)?b:a).k : null;
  if(!board.length) dealBoard();
  $("list").innerHTML=board.map((s,i)=>{
    let nd=NEED(s); if(s.k===scoopK) nd+=15;
    const gone=lostK.has(s.k);
    const lock=(trust<nd&&!doneSet.has(s.k)&&s.k!==freeK)||gone;
    return `<div class="sto ${cur===s?"on":""} ${doneSet.has(s.k)?"done":""} ${lock&&!gone?"lock":""} ${gone?"gone":""} ${s.k===freeK?"free":""} ${s.k===rushK&&!doneSet.has(s.k)?"rush":""} ${s.k===scoopK&&!doneSet.has(s.k)?"scoop":""} ${s.k===raceK&&!doneSet.has(s.k)?"race":""}" data-i="${i}">
      <b>${s.title}</b><small>${groupLines(s.lines).length} 段　·　${s.mode==="yn"?"分類":s.mode==="lu"?"校稿":"排序"}　·　${s.qs.length} 個查證</small>
      <span class="tag" style="${lock?"background:#FFEDE8;color:#F7955C":s.k===freeK?"background:#EAF7EC;color:#6FBF8A":""}">
        ${doneSet.has(s.k)?"已發行":gone?"分人搶忒":s.k===freeK?"庄民介紹來个（免信用）":lock?`愛信用 ${nd}`:`信用 ${nd}`}</span>
      ${s.k===rushK&&!doneSet.has(s.k)&&!gone?'<span class="tag" style="background:#FFEDE8;color:#F7955C;margin-left:4px">⏰ 急稿</span>':""}
      ${s.k===scoopK&&!doneSet.has(s.k)&&!gone?'<span class="tag" style="background:#FFF0CC;color:#C08A2E;margin-left:4px">★ 獨家</span>':""}
      ${s.k===raceK&&!doneSet.has(s.k)&&!gone?`<span class="tag" style="background:#FBE4EC;color:#C46A8A;margin-left:4px">⏳ 賰 ${raceLeft} 期</span>`:""}
      </div>`;}).join("");
  $("list").querySelectorAll(".sto").forEach(el=>el.onclick=()=>{
    const s=board[+el.dataset.i];
    if(lostK.has(s.k)) return;
    let nd=NEED(s); if(s.k===scoopK) nd+=15;
    if(trust<nd&&!doneSet.has(s.k)&&s.k!==freeK) return;
    start(s);});
  paintEvt();
  $("gbar").style.width=Math.min(100,readers/GOAL*100)+"%";
  $("gnow").textContent=readers;
  $("dn").textContent=cleared.size+doneSet.size; $("tt").textContent=STORY.length;
  $("lf").textContent=livePool().filter(x=>!doneSet.has(x.k)&&!lostK.has(x.k)).length;
  $("season").textContent=season;
  const rd=$("redeal");
  if(rd) rd.onclick=()=>{
    if(trust>=2){ trust-=2; bump("trust",trust); }
    board=[]; paintList();
  };
  if(rd) rd.textContent = trust>=2 ? "換一批（信用 -2）" : "換一批（免費）";
}
function steps(){
  const M=cur?cur.mode:"seq";
  const names=["讀",M==="yn"?"分":M==="lu"?"校":"排","查","編"],
    sub=["聽課文",M==="yn"?"做分類":M==="lu"?"排句子":"抓順序","答查證","上版面"];
  return `<div class="steps">${names.map((n,i)=>
    `<div class="sp ${i===step?"on":i<step?"ok":""}"><b>${n}</b>${sub[i]}</div>`).join("")}</div>`;
}
function start(s){
  if(doneSet.has(s.k)) return;
  cur=s; step=0; order=[]; ynPick={}; qi=0; qok=0;
  refScroll=0; workScroll=0; publishing=false;
  if(s.mode==='lu'){ luIdx=Math.floor(Math.random()*s.lu.length); luOrder=[]; }
  // 選項洗牌 —— 教材原資料正解攏排第一，愛打散
  shuf=cur.qs.map(q=>{
    const idx=q.o.map((_,i)=>i).sort(()=>Math.random()-.5);
    return {q:q.q, o:idx.map(i=>q.o[i]), a:idx.indexOf(q.a)};
  });
  paintList(); render();
}

function render(){
  if(!cur){ $("stage").innerHTML=idle(); return; }
  if(step===0) return read();
  if(step===1) return cur.mode==='yn'? sortYN() : cur.mode==='lu'? proof() : seq();
  if(step===2) return quiz();
  if(step===3) return front();
}
/* 短句合併：連紲个短句併做一段，播放照原句一句一句放 */
function groupLines(ls){
  const G=[]; let cur=null;
  ls.forEach(l=>{
    const short=l.h.length<=13;
    if(cur && short && cur.len<=30 && cur.short){
      cur.parts.push(l); cur.len+=l.h.length;
    }else{
      cur={parts:[l],len:l.h.length,short:short}; G.push(cur);
    }
  });
  return G.map(g=>({t:g.parts.map(p=>p.h).join("　"),u:g.parts.map(p=>p.u)}));
}
function refHtml(){
  const G=groupLines(cur.lines);
  return `<div class="ref"><div class="lbl">課 文（${G.length} 段　·　做得再聽）</div>
    <div class="read" id="ref">${G.map((g,i)=>
      `<div class="ln" data-i="${i}"><div class="n">${i+1}</div><div class="t">${g.t}</div>
        <button class="p" data-u="${g.u.join('|')}">▶</button></div>`).join("")}</div></div>`;
}
function playSeq(urls,i=0){
  if(i>=urls.length) return;
  try{ if(audio){audio.pause();audio.src="";}
    audio=new Audio(urls[i]);
    audio.onended=()=>playSeq(urls,i+1);
    audio.play().catch(()=>{});
  }catch(e){}
}
let refScroll=0, workScroll=0;
function saveScroll(){
  const r=document.getElementById("ref"); if(r) refScroll=r.scrollTop;
  const w=document.querySelector(".work"); if(w) workScroll=w.scrollTop;
}
function bindRef(){
  const r=document.getElementById("ref"); if(r) r.scrollTop=refScroll;
  const w=document.querySelector(".work"); if(w) w.scrollTop=workScroll;

}

          報紙有四版，逐版个讀者無共樣。<br>放著版正有人看，放毋著就無人理。</p>
        <div class="desks">${DESKS.map(k=>
          `<div class="dk" data-d="${k.id}">
            <div class="dn">${k.n}</div>
            <div class="dd">${k.d}</div>
            <div class="dw">讀者：${k.who}</div></div>`).join("")}</div>
      </div></div>
    <div class="foot"><p class="note" id="note">揀一版。揀著咧，該版个讀者會多起來。</p></div>`;
  bindRef();
  publishing=false;
  $("stage").querySelectorAll(".dk").forEach(el=>el.onclick=()=>{
    if(publishing) return;
    publishing=true;
    // 即時鎖住四隻版，免得撳兩擺
    $("stage").querySelectorAll(".dk").forEach(x=>{
      x.onclick=null; x.style.pointerEvents="none";
      if(x!==el) x.style.opacity=".4";
    });
    el.style.borderColor="var(--leaf2)"; el.style.background="#EAF7EC";
    publish(el.dataset.d);
  });
}
/* 讀者來信：發行後 20%，出該課無用著个題 */
function letter(cb){
  const pool=(EXTRAQ[cur.k]||[]);
  if(!pool.length||Math.random()>=0.20){ cb(); return; }
  const q0=pool[Math.floor(Math.random()*pool.length)];
  const idx=q0.o.map((_,i)=>i).sort(()=>Math.random()-.5);
  const q={q:q0.q,o:idx.map(i=>q0.o[i]),a:idx.indexOf(q0.a)};
  $("pc").innerHTML=`
    <div class="env">
      <svg viewBox="0 0 400 200" class="envbg">
        <rect x="18" y="26" width="364" height="150" rx="12" fill="#FFF6E4"/>
        <path d="M18 38 L200 128 L382 38" fill="none" stroke="#E8C89A" stroke-width="4"/>
        <path d="M18 176 L150 104 M382 176 L250 104" stroke="#E8C89A" stroke-width="3" fill="none"/>
        <rect x="316" y="42" width="46" height="34" rx="3" fill="#FFD98A"/>
        <circle cx="339" cy="59" r="9" fill="#FF9E7D"/>
        <g stroke="#E8C89A" stroke-width="2.5"><path d="M40 150h70M40 160h46"/></g>
      </svg>
      <div class="envfg">
        <h2>讀 者 來 信</h2>
        <p style="margin-top:4px">有讀者看了報導，寫信來問一句 ——</p>
        <div class="lq">${q.q}</div>
        ${q.o.map((o,i)=>`<div class="op" data-i="${i}">${o}</div>`).join("")}
        <p id="lnote" style="font-size:12px;margin-top:10px">答著讀者會再加。</p>
      </div>
    </div>`;
  $("pop").classList.add("on");
  $("pc").querySelectorAll(".op").forEach(el=>el.onclick=()=>{
    const i=+el.dataset.i;
    if(i===q.a){
      el.classList.add("ok");
      const g=26; readers+=g; bump("readers",readers);
      $("lnote").innerHTML=`<b style="color:var(--leaf2)">答著咧 —— 讀者 +${g}</b>`;
      log(`讀者來信答著　讀者 <b>+${g}</b>`);
    }else{
      el.classList.add("no");
      $("lnote").innerHTML='<b style="color:var(--coral)">毋係該條</b> —— 這擺無加。';
      $("pc").querySelectorAll(".op")[q.a].classList.add("ok");
    }
    $("pc").querySelectorAll(".op").forEach(x=>x.onclick=null);
    setTimeout(()=>{ $("pop").classList.remove("on");
      setTimeout(()=>{ try{ cb(); }catch(err){ console.error(err); } },260); },1500);
  });
}
const FACE=(c,h)=>`<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="28" fill="${c}" opacity=".2"/>
  <circle cx="30" cy="33" r="17" fill="#FBD9B4"/>
  <path d="M13 27 q3 -17 17 -17 q14 0 17 17 q-9 -8 -17 -8 q-8 0 -17 8Z" fill="${h}"/>
  <path d="M22 31 q3 -4 6 0M32 31 q3 -4 6 0" stroke="#5A4A3A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M26 40 q4 4 8 0" stroke="#5A4A3A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <circle cx="19" cy="38" r="4" fill="#FF9E7D" opacity=".55"/><circle cx="41" cy="38" r="4" fill="#FF9E7D" opacity=".55"/></svg>`;
function publish(pick){
  if(!cur || doneSet.has(cur.k)) return;      // 已經發行過就毋好再算
  issue++; doneSet.add(cur.k);
  paintList();                                 // 即時分該篇變灰
  const info=DESK[cur.k]||{best:'local',why:''};
  const ok=pick===info.best;
  const dk=DESKS.find(x=>x.id===pick), best=DESKS.find(x=>x.id===info.best);
  const sc=(cur.k===scoopK);
  let gain=Math.round((ok?44:16)+qok*11+trust*.5);
  if(cur.mode==='lu') gain=Math.round(gain*0.8);   // 校稿係輕稿
  if(sc) gain*=2;
  readers+=gain; trust=Math.min(100,Math.max(0,trust+(ok?6:1)));
  bump("issue",issue); bump("readers",readers); bump("trust",trust);
  const R=[
    {c:ok?"#9FD9A8":"#FFB8A8",h:"#4A3A2A",t:ok?REACT[pick].ok:REACT[pick].no},
    {c:"#FFD98A",h:"#8A6A4A",t:ok?`別版个讀者：「這篇放${dk.n}拄好。」`
      :`別版个讀者：「這篇應該放${best.n}正著。」`},
    {c:"#FF9E7D",h:"#3E2E22",t:`先生：「查證做著 ${qok} 題，報導有根據。」`},
  ];
  $("pc").innerHTML=`<h2>第 ${issue} 期　出街咧</h2>
    <p><b style="color:var(--deep)">${cur.title}</b> 登在 <b style="color:${ok?"var(--leaf2)":"var(--coral)"}">${dk.n}</b></p>
    ${ok?"":`<p style="font-size:12.5px;margin-top:6px">${info.why}<br>
      <b style="color:var(--deep)">應該放 ${best.n}</b></p>`}
    <div class="react">${R.map(r=>`<div class="rc">${FACE(r.c,r.h)}<div>${r.t}</div></div>`).join("")}</div>
    ${sc?'<p style="margin-top:8px;color:#C08A2E;font-weight:700">★ 獨家報導 —— 讀者加倍</p>':""}
    <p style="margin-top:14px">讀者 <b style="color:var(--gold)">+${gain}</b>　·　信用
      <b style="color:var(--leaf2)">${ok?"+6":"+1"}</b></p>

    <button class="btn" id="ok" style="margin-top:16px">接下一個選題</button>`;
  $("pop").classList.add("on");
  $("ok").onclick=()=>{
    $("pop").classList.remove("on");
    letter(()=>{
      if(readers>=GOAL){ seasonWin(); return; }
      rivalTurn();
      if(rival>=GOAL&&readers<GOAL){ gameOver(); return; }
      if(!livePool().filter(x=>!doneSet.has(x.k)&&!lostK.has(x.k)).length){ seasonWin(); return; }
      cur=null; rollEvents(); board=[]; paintList(); render();
    });
  };
}
function seasonWin(){
  cleared=new Set([...cleared,...doneSet,...lostK]);
  const restLeft=STORY.length-cleared.size;
  $("pc").innerHTML=`
    <div style="font-size:44px">🎉</div>
    <h2 style="color:var(--leaf2)">恭 喜 ！ 第 ${season} 季 贏 咧</h2>
    <p>庄頭報个讀者做到 <b style="color:var(--gold)">${readers}</b> 人，<br>
      贏過庄西報个 <b style="color:#C46A8A">${rival}</b> 人。</p>
    <div style="background:#fff;border-radius:16px;padding:14px 16px;margin-top:14px;text-align:left;
      font-size:13px;line-height:2">
      這季發行 <b>${issue}</b> 期　·　做過 <b>${doneSet.size}</b> 篇報導<br>
      收尾信用 <b>${trust}</b>　·　${lostK.size?`分人搶忒 <b>${lostK.size}</b> 篇`:"一篇都無分人搶去"}<br>
      <span style="color:var(--deep)">累計做過 <b>${cleared.size}</b> / ${STORY.length} 篇</span>
    </div>
    ${restLeft>0
      ? `<p style="margin-top:12px;font-size:12.5px">下一季還有 <b>${restLeft}</b> 篇無做過个稿等你。<br>
          信用會留下一半，讀者摎對手歸零重來。</p>
         <button class="btn" id="next" style="margin-top:14px">開始第 ${season+1} 季</button>`
      : `<p style="margin-top:12px;color:var(--deep);font-weight:700">
          51 篇報導全部做透咧 —— 庄頭報企穩咧！</p>
         <button class="btn" id="again" style="margin-top:14px">對頭再開一份報</button>`}`;
  $("pop").classList.add("on");
  const nb=$("next");
  if(nb) nb.onclick=()=>{
    season++; issue=0; readers=120; rival=120;
    trust=Math.max(40,Math.round(trust/2)+25);
    doneSet=new Set(); lostK=new Set(); board=[]; cur=null;
    rushK=null; raceK=null; raceLeft=0;
    const p=livePool(), mx=Math.max(...p.map(NEED));
    const c=p.filter(x=>NEED(x)<mx); scoopK=c.length?c[Math.floor(Math.random()*c.length)].k:null;
    const c0=p.filter(x=>x.k!==scoopK);
    rushK=(Math.random()<0.15&&c0.length)?c0[Math.floor(Math.random()*c0.length)].k:null;
    $("issue").textContent=0; $("readers").textContent=120; $("rival").textContent=120;
    $("trust").textContent=trust; $("rnow").textContent=120; $("rbar").style.left="13%";
    $("log").innerHTML="";
    $("pop").classList.remove("on");
    log(`<b>第 ${season} 季開始</b>　賰 ${livePool().length} 篇稿`);
    paintList(); render();
  };
  const ab=$("again"); if(ab) ab.onclick=()=>location.reload();
}
function gameOver(){
  $("pc").innerHTML=`<h2 style="color:#C46A8A">庄西報贏過去咧</h2>
    <p>佢兜个讀者做到 <b>${rival}</b> 人，你賰 <b>${readers}</b> 人。<br>
      庄頭个報紙，這下係佢兜該份。</p>
    <p style="margin-top:10px;font-size:12.5px">
      查證做較實在、版面揀較著，讀者就長較遽。</p>
    <button class="btn" id="again" style="margin-top:16px">重開一份報</button>`;
  $("pop").classList.add("on");
  $("again").onclick=()=>location.reload();
}
function idle(){
  return `<div style="margin:auto;text-align:center;padding:50px 20px">
    <svg viewBox="0 0 140 120" style="width:150px;height:130px">
      <ellipse cx="70" cy="104" rx="46" ry="9" fill="#8FD3E8" opacity=".35"/>
      <rect x="26" y="34" width="88" height="64" rx="8" fill="#fff" stroke="#F0DCC0" stroke-width="3"/>
      <rect x="26" y="34" width="88" height="15" rx="8" fill="#FFEFD4"/>
      <g stroke="#D8C8B4" stroke-width="3" stroke-linecap="round">
        <path d="M38 60h30M38 72h50M38 84h34"/></g>
      <rect x="76" y="56" width="26" height="20" rx="3" fill="#FFB8A8"/>
      <g fill="#FFD98A"><circle cx="24" cy="24" r="7"/><circle cx="118" cy="30" r="5"/></g>
      <path d="M100 18 q8 -10 18 -4" stroke="#9FD9A8" stroke-width="4" fill="none" stroke-linecap="round"/></svg>
    <p style="font-family:'Noto Serif TC',serif;font-size:18px;color:var(--deep);margin-top:14px">
      對左爿揀一個選題來採訪</p>
    <p style="font-size:12.5px;color:var(--dim);margin-top:7px">
      讀 → 抓順序 → 查證 → 編頭版，四步做一期報紙。</p></div>`;
}
addEventListener("resize",()=>location.reload());
(()=>{ const mx=Math.max(...STORY.map(NEED));
  const cand=livePool().filter(x=>NEED(x)<mx);
  if(cand.length) scoopK=cand[Math.floor(Math.random()*cand.length)].k;
  const c0=livePool().filter(x=>x.k!==scoopK);
  if(Math.random()<0.15&&c0.length) rushK=c0[Math.floor(Math.random()*c0.length)].k; })();
$("mus").onclick=toggleMus;
paintList(); render();
</script>
