<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>客庄聲音小達人 - 情境口說互動</title>
  <link rel="stylesheet" href="./field-trip.css">
</head>
<body>
  <main class="shell">
    <header class="game-topbar">
      <a class="back-link" href="./breakfast.html">← 返回情境</a>
    </header>

    <section class="frame">
      <div class="stage">
        <img id="screen" class="screen" alt="客庄聲音小達人遊戲畫面">
        <div id="hotspots" class="hotspots"></div>
        <div id="toast" class="toast" hidden></div>

        <!-- 模擬 AI 辨識對話框 -->
        <div id="demoPanel" class="overlay" hidden>
          <div class="card">
            <h2>Demo AI辨識</h2>
            <p id="demoPrompt"></p>
            <div class="actions">
              <button id="demoCorrect" class="ok" type="button">✓ 模擬辨識正確</button>
              <button id="demoRetry" class="retry" type="button">↻ 再試一次</button>
            </div>
            <button id="demoClose" class="secondary" type="button">關閉</button>
          </div>
        </div>

        <!-- 說明與提示對話框 -->
        <div id="helpPanel" class="overlay" hidden>
          <div class="card">
            <h2 id="helpTitle">提示</h2>
            <p id="helpText"></p>
            <button id="helpClose" class="secondary" type="button">知道了</button>
          </div>
        </div>
      </div>
    </section>

    <footer class="below">
      <span class="badge">單檔離線 DEMO</span>
      <span>直接點擊畫面按鈕即可互動體驗。</span>
      <button id="resetBtn" type="button">重新開始</button>
    </footer>
  </main>

  <!-- 載入遊戲資料與資源庫 -->
  <script src="./field-trip-data.js"></script>
  <!-- 載入遊戲主邏輯 -->
  <script src="./field-trip.js"></script>
</body>
</html>
