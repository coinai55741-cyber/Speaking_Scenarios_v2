<!doctype html>
<html lang="zh-Hant">
<head>
  <link rel="stylesheet" href="./hakka-font.css?v=20260907-font4">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>你家在哪</title>
  <link rel="stylesheet" href="scene-game-1-2.css?v=20260908-completefill1">
  <script src="./speech-api-config.js?v=20260909-global-ticket1"></script>
</head>
<body>
  <main class="page-shell">
    <header class="lesson-header"><a class="back-link" href="./index.html#situations">返回</a>
      <div>
        <h1>你家在哪</h1>
      </div>
      <div class="header-actions">
        <label class="select-label" for="dialectSelect">腔調</label>
        <select id="dialectSelect"></select>
        <label class="mode-toggle" title="顯示後端辨識狀態與辨識文字">
          <input id="debugToggle" type="checkbox">
          <span>開發者模式</span>
        </label>
        <button id="resetStage" class="ghost-button" type="button">重新整理</button>
      </div>
    </header>

    <nav id="stageTabs" class="stage-tabs" aria-label="遊戲階段"></nav>

    <section class="game-frame" aria-live="polite">
      <div id="sceneLayer" class="scene-layer scene-intro"></div>
      <div id="charactersLayer" class="characters-layer"></div>
      <div id="stageView" class="stage-view"></div>
    </section>

    <aside id="developerPanel" class="developer-panel" hidden>
      <h2>內部檢視</h2>
      <div id="developerContent"></div>
    </aside>

    <aside class="control-strip" aria-label="音量設定">
      <label>背景音量 <input id="bgmVolume" type="range" min="0" max="100" value="20"></label>
      <label>效果音量 <input id="seVolume" type="range" min="0" max="100" value="40"></label>
      <label>語音音量 <input id="voiceVolume" type="range" min="0" max="100" value="80"></label>
    </aside>
  </main>

  <script src="scene-game-1-2.js?v=20260908-completefill1"></script>
</body>
</html>
