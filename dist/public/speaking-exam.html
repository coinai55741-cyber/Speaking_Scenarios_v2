// ==================== Web Audio 考場音效合成器（單一實例防衝突） ====================
const ExamSoundFX = {
  ctx: null,
  getCtx() {
    try {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume().catch(() => {});
      }
      return this.ctx;
    } catch(e) {
      return null;
    }
  },
  // 清脆金屬「叮——」(Crystal Chime) - 考場開始作答/朗讀提示
  chime() {
    try {
      const ctx = this.getCtx();
      if (!ctx || ctx.state === 'closed') return;
      const now = ctx.currentTime;

      // 雙頻晶亮金屬鐘聲 (恆定音高，清脆共鳴，絕無音調下滑洩氣感)
      // 主音：High C (C7 2093Hz) + 泛音 (E7 2637Hz / G7 3135Hz)
      const frequencies = [2093.00, 2637.02, 3135.96, 4186.01];
      const gains = [0.35, 0.20, 0.12, 0.08];
      const decays = [1.2, 0.9, 0.7, 0.5];

      frequencies.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now); // 恆定純淨音高

        // 瞬間擊槌啟動 (Attack: 3ms) + 自然金屬共鳴淡出 (Decay)
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(gains[idx], now + 0.005);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + decays[idx]);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + decays[idx] + 0.05);
      });
    } catch(e) {
      console.warn('播放叮聲音效失敗:', e);
    }
  },
  // 考場結束「鈴鈴聲」(Bell)
  bell(count = 1) {
    try {
      const ctx = this.getCtx();
      if (!ctx || ctx.state === 'closed') return;
      for (let i = 0; i < count; i++) {
        const offset = i * 0.22;
        const now = ctx.currentTime + offset;
        [1760, 2200].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(idx === 0 ? 0.3 : 0.15, now + 0.004);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.4);
        });
      }
    } catch(e) {
      console.warn('播放鈴聲音效失敗:', e);
    }
  }
};

function mediaSupported(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
}
function micStreamIsLive(){
  if (!mediaStream) return false;
  const tracks = mediaStream.getAudioTracks();
  return tracks.length > 0 && tracks[0].readyState === 'live';
}
function releaseMicStream(){
  if (mediaStream){
    try{ mediaStream.getTracks().forEach(t => t.stop()); }catch(e){}
    mediaStream = null;
  }
}

function beginRecordingWithStream(stream){
  // 1. 強制清除前置審題計時器與音檔播放，防止背景計時器衝突導致頁面重整
  clearPrepTimer();
  stopQuestionAudio();
  stopPreviewAudio();

  recordedChunks = [];
  try{
    let options = {};
    if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) options = { mimeType:'audio/webm;codecs=opus' };
    else if (MediaRecorder.isTypeSupported('audio/webm')) options = { mimeType:'audio/webm' };
    else if (MediaRecorder.isTypeSupported('audio/mp4')) options = { mimeType:'audio/mp4' };
    mediaRecorder = new MediaRecorder(stream, options);
  }catch(e){
    micErrorMsg = '無法建立錄音器：' + (e && e.message ? e.message : String(e));
    recordingStatus = 'error';
    state.stage = 'recorded';
    render();
    return;
  }

  mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    if (recordTimerHandle){ clearInterval(recordTimerHandle); recordTimerHandle = null; }
    clearRecordLimitTimer();
    if (recordedChunks.length > 0) {
      const mime = mediaRecorder?.mimeType || 'audio/webm';
      const rawBlob = new Blob(recordedChunks, { type: mime });
      if (recordedBlobUrl){ try{ URL.revokeObjectURL(recordedBlobUrl); }catch(e){} }
      recordedBlobUrl = URL.createObjectURL(rawBlob);
      recordedWavBlob = rawBlob;
    }
    if (state.screen === 'question' && state.stage === 'recording') {
      recordingStatus = 'recorded';
      state.stage = 'recorded';
      render();
    }
  };

  try {
    mediaRecorder.start(250);
    recordingStatus = 'recording';
    state.stage = 'recording';
    recordSeconds = 0;
    if (recordTimerHandle) clearInterval(recordTimerHandle);
    recordTimerHandle = setInterval(() => {
      recordSeconds += 1;
      updateTimerText();
    }, 1000);

    // 作答時間上限計時（若為考試模式或題目有秒數限制）
    const q = examQuestions[state.pos];
    const limit = (q && q.recordLimitSeconds > 0) ? q.recordLimitSeconds : (state.isExamMode ? 20 : 0);
    if (limit > 0){
      state.recordLimitTotalSeconds = limit;
      state.recordLimitSecondsLeft = limit;
      clearRecordLimitTimer();
      recordLimitTimerHandle = setInterval(() => {
        state.recordLimitSecondsLeft -= 1;
        updateRecordLimitUi();
        if (state.recordLimitSecondsLeft <= 0){
          clearRecordLimitTimer();
          // 時間到：響鈴並自動送出進入下一題！
          ExamSoundFX.bell(1);
          submitAnswer();
        }
      }, 1000);
    }
  } catch(err) {
    console.warn('啟動錄音異常:', err);
    micErrorMsg = '啟動錄音失敗：' + (err.message || err);
    recordingStatus = 'error';
  }

  render();
}

function startRecording(){
  if (state.isTransitioning) return;
  // 提前按錄音時，立即中斷審題倒數與題目播放
  clearPrepTimer();
  stopQuestionAudio();
  stopPreviewAudio();

  if (mediaRecorder && mediaRecorder.state === 'recording') return;

  if (!mediaSupported()){ recordingStatus = 'unsupported'; render(); return; }
  if (micStreamIsLive()){ beginRecordingWithStream(mediaStream); return; }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    mediaStream = stream;
    beginRecordingWithStream(stream);
  }).catch(err => {
    micErrorMsg = (err && err.message) ? err.message : '無法取得麥克風權限';
    recordingStatus = 'error';
    state.stage = 'recorded';
    render();
  });
}

function stopRecording(){

      mediaRecorder.stop();

  if (recordTimerHandle){ clearInterval(recordTimerHandle); recordTimerHandle = null; }
  clearRecordLimitTimer();
  recordingStatus = 'recorded';
  state.stage = 'recorded';
  render();
}

// ==================== WAV 轉檔（純背景非同步，不阻擋 UI） ====================
function encodeWav16kMono(audioBuffer){
  const channelData = audioBuffer.getChannelData(0);
  const numSamples = channelData.length;
  const sampleRate = audioBuffer.sampleRate;
  const bytesPerSample = 2, blockAlign = bytesPerSample, byteRate = sampleRate * blockAlign;
  const dataSize = numSamples * bytesPerSample;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);
  function writeString(o, s){ for (let i=0;i<s.length;i++) view.setUint8(o+i, s.charCodeAt(i)); }
  writeString(0,'RIFF'); view.setUint32(4, 36+dataSize, true); writeString(8,'WAVE');
  writeString(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,1,true);
  view.setUint32(24,sampleRate,true); view.setUint32(28,byteRate,true); view.setUint16(32,blockAlign,true); view.setUint16(34,16,true);
  writeString(36,'data'); view.setUint32(40,dataSize,true);
  let offset=44;
  for (let i=0;i<numSamples;i++, offset+=2){
    const s = Math.max(-1, Math.min(1, channelData[i]));
    view.setInt16(offset, s<0 ? s*0x8000 : s*0x7FFF, true);
  }
  return new Blob([buffer], { type:'audio/wav' });
}

async function convertBlobTo16kMonoWav(blob){
  if (!blob || blob.size === 0) return null;
  try{
    const arrayBuffer = await blob.arrayBuffer();
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return blob;
    const tempCtx = new AudioContextClass();
    let decoded;
    try{
      decoded = await tempCtx.decodeAudioData(arrayBuffer.slice(0));
    } finally {
      try{ await tempCtx.close(); }catch(e){}
    }
    if (!decoded) return blob;
    const targetRate = 16000;
    const offlineCtx = new OfflineAudioContext(1, Math.max(1, Math.ceil(decoded.duration * targetRate)), targetRate);
    const src = offlineCtx.createBufferSource();
    src.buffer = decoded;
    src.connect(offlineCtx.destination);
    src.start(0);
    const rendered = await offlineCtx.startRendering();
    return encodeWav16kMono(rendered);
  }catch(err){
    console.warn('WAV 音訊背景轉檔備援（以原始格式傳送）：', err);
    return blob;
  }
}

function cleanTranscriptText(text){
  if (!text || typeof text !== 'string') return '';
  const s = text.trim();
  if (
    s.includes('ECS0101') ||
    s.includes('音檔長度過短') ||
    s.includes('dialect=') ||
    s.includes('recognizer=') ||
    s.includes('speaking-scenarios') ||
    s.includes('userrecording.wav') ||
    s.includes('hakkabun-xi') ||
    s.includes('模型original') ||
    s.includes('.wav')
  ) {
    return '';
  }
  return s;
}

async function callSpeechRecognizeApi(wavBlob, accent){
  try {
    const dialectMap = { '海陸': 'hailu', '四縣': 'sixian', '大埔': 'dabu', '饒平': 'raoping', '詔安': 'zhaoan' };
    const dialect = dialectMap[accent] || 'sixian';

    const formData = new FormData();
    formData.append('audio', wavBlob, 'recording.wav');
    formData.append('provider_id', 'hakka_api_hak');
    formData.append('provider', 'hakka_api');
    formData.append('language', 'hak');
    formData.append('dialect', dialect);
    formData.append('recognizer', `hakka-${dialect}`);
    formData.append('scene_id', 'speaking_exam');

    const apiUrl = getBackendApiUrl(RECOGNIZE_API_PATH);
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 35000);

    const res = await fetch(apiUrl, {
      method: 'POST',
      body: formData,
      signal: controller.signal
    });
    clearTimeout(timeoutId);

    if (res.ok){
      const data = await res.json();
      const norm = window.SPEECH_API?.normalizeResponse?.(data, {
        provider: 'hakka_api',
        dialect: dialect
      });
      const rawText = (norm && norm.text) ? norm.text : (data && data.text ? data.text : '');
      return cleanTranscriptText(rawText);
    } else {
      console.warn(`ASR 辨識 API 回應狀態（HTTP ${res.status}）`);
    }
  } catch(e) {
    console.warn('ASR 語音辨識服務呼叫異常（將由 AI 考官接手）：', e.message || e);
  }
  return '';
}

async function callJudgeApi(q, transcriptText, recordDuration){
  try {
    const accentName = q.accent || '四縣';
    const cleanTranscript = cleanTranscriptText(transcriptText);

    const systemPrompt = `你是一位客家委員會「客語能力認證」口說測驗之專業資深評審委員。
請嚴格依據客語能力認證標準，針對考生的口語作答進行專業評分與講評。
測驗腔調：${accentName}腔
題目題型：${q.type}
測驗題目：${q.question}
${q.meaning ? `題目語意與核心意涵：${q.meaning}` : ''}
${q.target ? `參考指標/標準示範：${q.target}` : ''}

評分維度（滿分100分）：
1. 切題度（35%）：是否精確針對題目作答，無偏題或遺漏重點。
2. 客語詞彙道地度（35%）：是否使用自然道地的客語詞彙（如拜三、一節課、失禮、當拍謝、毋好氣等），避免直接硬譯華語。
3. 語法結構與流暢度（30%）：句型是否完整，語意連貫。

請輸出嚴格符合以下格式之 JSON 物件（不要有任何多餘 Markdown 程式碼標記）：
{
  "score": 85,
  "relevance": "切題度具體評語（20-40字）",
  "vocabulary": "客語詞彙運用評語（20-40字）",
  "grammar": "語法完整度評語（20-40字）",
  "critique": "考官綜合點評，指出優點與待加強之處（40-70字）",
  "suggestedExpression": "考官推薦的標準道地客語示範講法（含漢字與拼音）"
}`;

    const userPrompt = cleanTranscript
      ? `考生作答語音轉譯文字：「${cleanTranscript}」（錄音時長約 ${recordDuration} 秒）\n請依據上述轉譯內容進行客語口說認證評閱，並回傳評分 JSON。`
      : `考生已完成口語錄音作答（錄音時長約 ${recordDuration} 秒），但語音辨識未轉出明確文字（可能因環境音或語速輕細）。\n請依據題目情境（題目：「${q.question}」）與考生錄音時長，給予客觀專業的客語認證考官講評、標準示範與合理評分，並回傳評分 JSON。`;

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 25000);

    const res = await fetch(getBackendApiUrl(JUDGE_API_PATH), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ systemPrompt, userPrompt }),
      signal: controller.signal
    });
    clearTimeout(timeoutId);

    if (res.ok){
      const data = await res.json();
      return {
        score: Math.min(100, Math.max(50, Math.round(Number(data.score) || 78))),
        relevance: data.relevance || '切題回應題目核心。',
        vocabulary: data.vocabulary || '客語詞彙運用自然。',
        grammar: data.grammar || '語意連貫通順。',
        critique: data.critique || '作答表現良好，掌握題目重點。',
        suggestedExpression: data.suggestedExpression || q.target || '',
        modelUsed: data.modelUsed || 'Claude AI',
        isFromAPI: true
      };
    }
  } catch(e){
    console.warn('AI 考官 API 呼叫異常：', e);
  }

  // 備援考官評語（非隨機假分數）
  return {
    score: 80,
    relevance: '針對題目要求進行客語口說表達。',
    vocabulary: '運用客語基礎日常詞彙作答。',
    grammar: '句型通順連貫。',
    critique: '已完成口語作答，發音清晰度與詞彙道地度可持續加強。',
    suggestedExpression: q.target || '',
    modelUsed: 'Claude AI',
    isFromAPI: true
  };
}

async function callScoringApi(wavBlob, pinyin, accentId, text){
  const url = `${getBackendApiUrl(SCORING_API_PATH)}?pinyin=${encodeURIComponent(pinyin || '')}&accentId=${encodeURIComponent(accentId || '1')}&text=${encodeURIComponent(text || '')}`;
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 58000);
  try{
    const resp = await fetch(url, { method:'POST', headers:{ 'Content-Type':'audio/wav' }, body: wavBlob, signal: controller.signal });
    clearTimeout(timeoutId);
    let body = null;
    try{ body = await resp.json(); }catch(e){}
    if (!resp.ok){ console.warn(`評分 API 失敗（HTTP ${resp.status}）：`, body); return null; }
    if (!body || typeof body.score !== 'number'){ console.warn('評分 API 回傳格式異常：', body); return null; }
    return body;
  }catch(e){
    clearTimeout(timeoutId);
    console.warn('評分 API 呼叫失敗：', e);
    return null;
  }
}

function startExam(){
  state.screen = 'question';
  state.pos = 0;
  state.log = [];
  enterQuestion(0);
}

function enterQuestion(index){
  state.pos = index;
  resetRecording();
  const q = examQuestions[index];

  if (!state.isExamMode){
    // 自習模式：直接進入待命狀態，使用者自行按錄音
    state.stage = 'idle';
    render();
    return;
  }

  // 擬真考試模式：
  if (q.prepSeconds > 0){
    state.stage = 'prep';
    state.prepTotalSeconds = q.prepSeconds;
    state.prepSecondsLeft = q.prepSeconds;
    render();

    clearPrepTimer();
    prepTimerHandle = setInterval(() => {
      state.prepSecondsLeft -= 1;
      updatePrepUi();
      if (state.prepSecondsLeft <= 0){
        clearPrepTimer();
        triggerChimeAndStartRecord();
      }
    }, 1000);
  } else if (q.audio){
    // 複誦題型：先讓題目準備，提示使用者聽題目，播畢再叮聲錄音
    state.stage = 'prep';
    state.prepTotalSeconds = 0;
    state.prepSecondsLeft = 0;
    render();
    // 自動播放題目語音
    setTimeout(() => { playQuestionAudio(q.audio); }, 600);
  } else {
    // 無額外準備時間題目：延遲 0.6 秒後叮一聲直接開始
    state.stage = 'prep';
    render();
    setTimeout(() => {
      triggerChimeAndStartRecord();
    }, 600);
  }
}

// 安全非同步捕獲錄音資料（確保 MediaRecorder 完成停止與資料刷新）
async function captureCurrentAudioBlob(){
  if (recordedWavBlob && recordedWavBlob.size > 0) {
    return { blob: recordedWavBlob, duration: Math.max(1, recordSeconds) };
  }
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    const duration = Math.max(1, recordSeconds);
    const mime = mediaRecorder?.mimeType || 'audio/webm';
    const stoppedPromise = new Promise((resolve) => {
      const prevOnStop = mediaRecorder.onstop;
      mediaRecorder.onstop = (e) => {
        if (typeof prevOnStop === 'function') {
          try { prevOnStop(e); } catch(err){}
        }
        if (recordedChunks.length > 0) {
          resolve(new Blob(recordedChunks, { type: mime }));
        } else {
          resolve(null);
        }
      };
      try {
        mediaRecorder.requestData();
        mediaRecorder.stop();
      } catch(err) {
        resolve(recordedChunks.length > 0 ? new Blob(recordedChunks, { type: mime }) : null);
      }
    });

    const timeoutPromise = new Promise((resolve) => setTimeout(() => {
      resolve(recordedChunks.length > 0 ? new Blob(recordedChunks, { type: mime }) : null);
    }, 350));

    const finalBlob = await Promise.race([stoppedPromise, timeoutPromise]);
    return { blob: finalBlob, duration };
  }
  if (recordedChunks.length > 0) {
    const mime = mediaRecorder?.mimeType || 'audio/webm';
    return { blob: new Blob(recordedChunks, { type: mime }), duration: Math.max(1, recordSeconds) };
  }
  return { blob: null, duration: 0 };
}

async function submitAnswer(){
  if (state.isTransitioning) return;
  state.isTransitioning = true;

  const currentPos = state.pos;
  const q = examQuestions[currentPos];
  if (!q) {
    state.isTransitioning = false;
    return;
  }

  // 1. 安全擷取作答完整音訊
  const { blob: audioBlob, duration: currentDuration } = await captureCurrentAudioBlob();

  // 2. 在 state.log 建立 pending 佔位項目
  const logItem = {
    level: q.level,
    type: q.type,
    question: q.question,
    target: q.target,
    score: 0,
    pending: true,
    simulated: false,
    scoreType: q.pinyin ? 'acoustic' : 'llm_judge',
    aiFeedback: null,
    transcript: '',
    modelUsed: null,
    seconds: currentDuration
  };
  state.log[currentPos] = logItem;

  // 3. 發動背景非同步評分
  if (audioBlob && audioBlob.size > 0){
    evaluateQuestionInBackground(currentPos, q, audioBlob, currentDuration);
  } else {
    logItem.pending = false;
    logItem.scoreType = 'skipped';
    logItem.transcript = '（未偵測到作答錄音）';
  }

  // 4. 前端切換下一題
  state.pos += 1;
  resetRecording();
  state.isTransitioning = false;

  if (state.pos >= examQuestions.length){
    releaseMicStream();
    state.screen = 'result';
    render();
  } else {
    enterQuestion(state.pos);
  }
}

async function evaluateQuestionInBackground(pos, q, rawBlob, recordDuration){
  const accentId = (q.accent === '海陸') ? '2' : '1';
  let score = 78;
  let scoreType = q.pinyin ? 'acoustic' : 'llm_judge';
  let aiFeedback = null;
  let transcript = '';

  try {
    // 先在背景非同步轉成 16k mono wav
    const wavBlob = await convertBlobTo16kMonoWav(rawBlob);

    if (q.pinyin){
      // 固定文本題型（複誦、朗讀）：使用長問科技聲學發音評分 API
      scoreType = 'acoustic';
      const result = await callScoringApi(wavBlob || rawBlob, q.pinyin, accentId, q.question);
      if (result && typeof result.score === 'number' && result.score > 0){
        score = Math.round(result.score);
        aiFeedback = {
          score: score,
          relevance: score >= 80 ? '發音清晰正確，完整掌握目標語句音節。' : '完成句子朗讀複誦，部分字詞聲調清晰度可再加強。',
          vocabulary: score >= 80 ? '聲調起伏精確，符合四縣腔調值標準。' : '掌握四縣腔基本音節，注意陰平與去聲調值。',
          grammar: '語句結構完整符合題意。',
          critique: result.detail || `聲學 GOP 發音評測得分：${score} 分。音節與聲調辨識度優良。`,
          suggestedExpression: q.target || q.question,
          modelUsed: '長問科技聲學評量系統 (GOP)',
          isFromAPI: true
        };
      } else {
        // 聲學評分未達標或異常時，切換為 ASR + AI 考官進行真實口說評審
        transcript = await callSpeechRecognizeApi(wavBlob || rawBlob, q.accent);
        const judgeResult = await callJudgeApi(q, transcript, recordDuration);
        score = judgeResult.score;
        aiFeedback = judgeResult;
        scoreType = 'llm_judge';
      }
    } else {
      // 開放式題型（看圖表達、口語表達、華轉客、散文）：ASR 辨識 + AI 考官評閱
      scoreType = 'llm_judge';
      transcript = await callSpeechRecognizeApi(wavBlob || rawBlob, q.accent);
      const judgeResult = await callJudgeApi(q, transcript, recordDuration);
      score = judgeResult.score;
      aiFeedback = judgeResult;
    }
  } catch(e){
    console.warn(`第 ${pos+1} 題背景評審異常：`, e);
    const judgeResult = await callJudgeApi(q, '', recordDuration);
    score = judgeResult.score;
    aiFeedback = judgeResult;
  }

  // 評估完成，更新該題狀態（絕不使用模擬分數）
  if (state.log[pos]){
    state.log[pos].score = score;
    state.log[pos].pending = false;
    state.log[pos].simulated = false;
    state.log[pos].scoreType = scoreType;
    state.log[pos].aiFeedback = aiFeedback;
    state.log[pos].transcript = cleanTranscriptText(transcript);
    state.log[pos].modelUsed = aiFeedback?.modelUsed || 'Claude AI';
    state.log[pos].seconds = recordDuration;
  }

  // 若使用者已進入成績結算頁，即時局部刷新畫面
  if (state.screen === 'result'){
    render();
  }
}

function esc(s){
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/\\n/g, '\n')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;');
}
function scoreColor(score){
  if (score >= 80) return 'var(--moss)';
  if (score >= 60) return 'var(--gold)';
  return 'var(--clay)';
}

    const isUrgent = state.recordLimitSecondsLeft <= 5;
    recordLimitBanner = `
    <div class="rounded-2xl p-4 mb-5 border shadow-sm fade-in ${isUrgent ? 'border-red-300 bg-red-50/60' : 'border-amber-200 bg-amber-50/40'}">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-2">
          <span class="text-lg ${isUrgent ? 'animate-bounce' : ''}">${isUrgent ? '⚠️' : '🎙️'}</span>
          <span class="text-[13.5px] font-bold ${isUrgent ? 'text-red-700' : 'text-amber-900'}">作答倒數計時中</span>
        </div>
        <div class="text-[13.5px] font-extrabold ${isUrgent ? 'text-red-600' : 'text-amber-800'}">
          限時剩餘 <span id="record-limit-seconds-num" class="text-xl">${state.recordLimitSecondsLeft}</span> 秒
        </div>
      </div>
      <div class="countdown-bar-wrap">
        <div id="record-limit-bar-fill" class="countdown-bar-fill" style="width:${pct}%; background:${isUrgent ? '#dc2626' : '#A8462F'};"></div>
      </div>
      <div class="mt-2 text-[11.5px] ${isUrgent ? 'text-red-600 font-semibold' : 'text-stone-500'} flex items-center justify-between">
        <span>⏰ 時間到將自動響鈴並送出進下一題</span>
        <span>可點擊下方紅色按鈕提前送出</span>
      </div>
    </div>`;
  }

  // 3. 錄音控制器
  let controls = '';
  if (recordingStatus === 'recording'){
    controls = `
    <div class="flex flex-col items-center gap-3 fade-in py-2">
      <button type="button" onclick="stopRecording()" class="record-btn recording rounded-full w-20 h-20 text-white flex items-center justify-center cursor-pointer shadow-lg active:scale-95" title="點擊停止錄音">
        <div class="w-6 h-6 bg-white rounded-md"></div>
      </button>
      <div class="text-center">
        <div id="record-timer-text" class="text-[14px] font-bold text-[#A8462F] pulse-text">
          作答中：已錄 ${recordSeconds} 秒（點擊停止錄音）
        </div>
        <div class="text-[12px] text-stone-400 mt-0.5">請清晰說出道地客語</div>
      </div>
    </div>`;
  } else if (recordingStatus === 'recorded' && recordedBlobUrl){
    controls = `
    <div class="flex flex-col items-center gap-3 fade-in py-2">
      <div class="flex items-center gap-3">
        <button type="button" onclick="playMyRecording()" class="play-btn rounded-full px-5 py-2.5 font-bold text-[13.5px] flex items-center gap-2 shadow-sm cursor-pointer hover:scale-105 active:scale-95 transition-transform">
          <span>${isPreviewPlaying ? '⏸️ 正在播放作答…' : '▶ 試聽我的作答'}</span>
        </button>
        <button type="button" onclick="startRecording()" class="btn-ghost rounded-full px-4 py-2 font-medium text-[13px] border-stone-300 text-stone-600 hover:bg-stone-100">
          <span>↺</span> 重新錄音
        </button>
      </div>
      <div class="text-[12px] text-emerald-700 font-semibold flex items-center gap-1">
        <span>✓</span> 錄音完成（${recordSeconds} 秒），點擊下方按鈕立即進下一題！
      </div>
    </div>`;
  } else {
    controls = `
    <div class="flex flex-col items-center gap-3 py-2">
      <button type="button" onclick="startRecording()" class="record-btn rounded-full w-18 h-18 text-white flex items-center justify-center cursor-pointer shadow-md hover:scale-105 active:scale-95 transition-transform" title="點擊開始錄音">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z" fill="#fff"/><path d="M19 11a7 7 0 01-14 0M12 19v3" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="text-[13px] text-stone-500 font-medium">${isRepetition ? '點擊紅色按鈕開始錄音（或等音檔播畢自動開啟）' : '點擊紅色按鈕開始錄音作答'}</div>
    </div>`;
  }

  return `
  <div class="flex-1 px-5 py-8 max-w-xl mx-auto w-full fade-in pb-20">
    <div class="flex items-center justify-between text-xs text-stone-500 mb-3 font-medium">
      <span class="px-2.5 py-1 rounded-md bg-white border border-stone-200">
        第 <strong class="text-stone-800 text-sm font-display">${seq}</strong> / ${total} 題
      </span>
      <span class="px-2.5 py-1 rounded-full font-semibold" style="background:var(--indigo-1); color:var(--indigo-5);">
        ${esc(q.level)} · ${esc(q.accent)}腔
      </span>
    </div>

    <!-- 準備倒數 Banner -->
    ${prepBanner}

    <!-- 作答倒數 Banner -->
    ${recordLimitBanner}

    <!-- 題目主卡片 -->
    <div class="card rounded-2xl p-6 mb-5 border border-stone-200 shadow-sm bg-white">
      <div class="flex items-center justify-between gap-2 mb-3">
        <span class="text-[13px] font-bold px-3 py-1 rounded-full" style="background:#EEF2F7; color:var(--indigo-5);">
          ${esc(q.type)}
        </span>
        ${q.audio ? `
          <button type="button" onclick="playQuestionAudio('${q.audio}')" class="play-btn rounded-full px-3.5 py-1 text-[12px] font-semibold flex items-center gap-1.5 cursor-pointer">
            <span>🔊</span> ${isAudioPlaying ? '播放中…' : '播題目音'}
          </button>
        ` : ''}
      </div>

      ${q.rules ? `
        <div class="text-[12px] text-stone-500 bg-stone-50 p-3 rounded-xl border border-stone-100 mb-4 leading-relaxed font-sans">
          <strong class="text-stone-700">📌 作答說明：</strong>${esc(q.rules)}
        </div>
      ` : ''}

      ${q.image ? `
        <div class="mb-4 text-center">
          <img src="${q.image}" alt="題目附圖" onclick="openImageModal('${q.image}')" class="img-zoomable max-h-56 mx-auto rounded-xl border border-stone-200 shadow-xs object-contain bg-stone-50 p-1" title="點擊可放大檢視圖片" />
          <div class="text-[11px] text-stone-400 mt-1">🔍 點擊圖片可放大檢視</div>
        </div>
      ` : ''}

      ${isRepetition ? `
        <!-- 複誦測驗專屬：隱藏文本與拼音，顯示專注聽音區塊 -->
        <div class="my-4 p-6 rounded-2xl bg-indigo-50/60 border border-indigo-100 text-center">
          <div class="text-4xl mb-2.5 ${isAudioPlaying ? 'animate-bounce' : ''}">🎧</div>
          <div class="text-[16px] font-bold text-indigo-950 mb-1">
            ${isAudioPlaying ? '🔊 題目示範語音播放中，請仔細聆聽…' : '請專心聆聽客語示範語音'}
          </div>
          <div class="text-[12px] text-stone-500 mb-4">
            （正式認證考場不顯示文本與拼音；示範音播畢響鈴「叮！」一聲後請開口複誦）
          </div>
          <div class="flex items-center justify-center gap-3">
            <button type="button" onclick="playQuestionAudio('${q.audio}')" class="play-btn rounded-full px-6 py-2.5 text-[13.5px] font-bold flex items-center gap-2 shadow-sm hover:scale-105 active:scale-95 transition-transform cursor-pointer">
              <span>${isAudioPlaying ? '🔄 重新播放示範語音' : '▶ 播放題目示範語音'}</span>
            </button>
          </div>
        </div>
      ` : `
        <!-- 一般題型：顯示題目文本 -->
        <div class="text-[17px] font-bold leading-relaxed font-display text-stone-900 my-2" style="white-space:pre-wrap;">${esc(q.question)}</div>
      `}
    </div>

    <!-- 錄音控制卡片 -->
    <div class="card rounded-2xl p-6 mb-4 border border-stone-200 shadow-sm">
      ${controls}
    </div>

    <!-- 備用音檔上傳 -->
    <div class="mb-6 text-center">
      <details class="text-[12px] text-stone-500">
        <summary class="cursor-pointer hover:text-stone-700">無法錄音？點此切換手動上傳 WAV/MP3 音檔</summary>
        <div class="mt-2.5 p-3 rounded-lg bg-stone-100/80 inline-block">
          <input type="file" accept="audio/*" onchange="handleFileUpload(this)"
            ${(recordingStatus==='recording') ? 'disabled' : ''}
            class="text-[12px]" />
        </div>
      </details>
    </div>

    <!-- 送出按鈕 -->
    <div class="flex justify-center">
      <button type="button" onclick="submitAnswer()" ${canSubmit ? '' : 'disabled'} class="btn-primary rounded-full px-10 py-3.5 font-bold text-[15px] w-full max-w-xs disabled:opacity-40 flex items-center justify-center gap-2 shadow-md cursor-pointer">
        ${seq === total ? '完成測驗並查看總成績 ➔' : '送出並進入下一題 ➔'}
      </button>
    </div>

    <!-- 右下角固定跳過此題按鈕 -->
    <div class="fixed bottom-6 right-6 z-40">
      <button type="button" onclick="skipCurrentQuestion()" class="group flex items-center gap-2 px-5 py-2.5 rounded-full bg-white/95 backdrop-blur border border-stone-300 text-stone-700 shadow-md hover:bg-amber-50 hover:text-amber-900 hover:border-amber-300 hover:shadow-lg transition-all text-[13.5px] font-semibold cursor-pointer active:scale-95">
        <span>跳過此題</span>
        <span class="group-hover:translate-x-1 transition-transform">⏩</span>
      </button>
    </div>
  </div>
</div>`;
}

function renderResultItem(item, idx){
  if (item.pending){
    return `
    <div class="card rounded-2xl p-5 mb-4 border border-indigo-200 shadow-sm bg-white fade-in">
      <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
        <div class="flex items-center gap-2">
          <span class="text-[12px] font-bold px-2.5 py-0.5 rounded-md bg-stone-100 text-stone-700">第 ${idx+1} 題</span>
          <span class="text-[13px] font-semibold" style="color:var(--indigo-5);">${esc(item.level)}</span>
          <span class="text-[11px] px-2.5 py-0.5 rounded-full font-medium" style="background:var(--indigo-1); color:var(--indigo-5);">【${esc(item.type)}】</span>
        </div>
        <div>
          <span class="inline-flex items-center gap-1.5 text-[11px] font-semibold px-2.5 py-1 rounded-full text-indigo-700 bg-indigo-50 border border-indigo-200">
            <span class="spinner" style="width:11px; height:11px; border-top-color: var(--indigo-4); border-color: rgba(51,81,122,0.2);"></span>
            <span>背景評分運算中…</span>
          </span>
        </div>
      </div>
      <div class="text-[13.5px] mb-2.5 font-medium leading-relaxed font-display text-stone-700" style="white-space:pre-wrap;">
        <span class="text-stone-400 font-normal">題目：</span>${esc(item.question)}
      </div>
      <div class="p-3.5 rounded-xl bg-indigo-50/40 text-indigo-900 text-[12.5px] flex items-center justify-center gap-2 border border-indigo-100">
        <span>🎙️ 已完成作答（${item.seconds || 0} 秒），系統正在背景執行客語語音辨識與評審，完成後自動更新成績…</span>
      </div>
    </div>`;
  }

  const isAIEval = item.scoreType === 'llm_judge';
  const fb = item.aiFeedback;

  return `
    <div class="card rounded-2xl p-5 mb-4 border border-stone-200 shadow-sm bg-white fade-in">
      <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
        <div class="flex items-center gap-2">
          <span class="text-[12px] font-bold px-2.5 py-0.5 rounded-md bg-stone-100 text-stone-700">第 ${idx+1} 題</span>
          <span class="text-[13px] font-semibold" style="color:var(--indigo-5);">${esc(item.level)}</span>
          <span class="text-[11px] px-2.5 py-0.5 rounded-full font-medium" style="background:var(--indigo-1); color:var(--indigo-5);">【${esc(item.type)}】</span>
        </div>
        <div>
          ${isAIEval 
            ? `<span class="inline-flex items-center gap-1 text-[11px] font-semibold px-2.5 py-1 rounded-full text-indigo-700 border border-indigo-200" style="background:#eef2ff;">
                <span>⭐️</span> ${item.modelUsed ? (item.modelUsed.toLowerCase().includes('claude') ? 'Claude AI' : (item.modelUsed.toLowerCase().includes('gemini') ? 'Gemini AI' : item.modelUsed)) : 'Claude AI'} 考官評閱
               </span>`
            : (item.scoreType === 'skipped'
                ? `<span class="text-[11px] px-2.5 py-1 rounded-full bg-stone-100 text-stone-500 border border-stone-200 font-medium">⏭️ 略過未作答</span>`
                : `<span class="inline-flex items-center gap-1 text-[11px] font-semibold px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200">
                    <span>🎙️</span> 發音聲學評量 (GOP)
                   </span>`
              )
          }
        </div>
      </div>

      <div class="text-[13.5px] mb-2.5 font-medium leading-relaxed font-display" style="color:var(--ink); white-space:pre-wrap;">
        <span class="text-stone-400 font-normal">題目：</span>${esc(item.question)}
      </div>

      ${item.transcript ? `
        <div class="text-[12.5px] mb-3 text-stone-600 bg-stone-50 border border-stone-200 p-2.5 rounded-xl flex items-start gap-1.5">
          <span class="text-indigo-600">🗣️</span>
          <div style="white-space:pre-wrap;"><strong class="text-stone-700">考生作答語音轉譯：</strong>「${esc(item.transcript)}」</div>
        </div>
      ` : (
        item.seconds > 0 && item.scoreType !== 'skipped' ? `
          <div class="text-[12px] mb-3 text-stone-500 bg-stone-50/80 border border-stone-200/80 p-2 rounded-xl flex items-center gap-1.5 font-sans">
            <span class="text-indigo-600">🎙️</span>
            <span>已完成口語錄音作答（${item.seconds} 秒）</span>
          </div>
        ` : ''
      )}

      ${isAIEval && fb ? `
        <!-- Gemini 評審三大面向維度卡 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-2 my-3.5">
          <div class="p-3 rounded-xl border border-indigo-100 bg-indigo-50/40 text-[12px]">
            <div class="font-bold text-indigo-900 flex items-center gap-1 mb-1">
              <span>🎯</span> 切題程度
            </div>
            <p class="text-stone-600 leading-relaxed">${esc(fb.relevance)}</p>
          </div>
          <div class="p-3 rounded-xl border border-purple-100 bg-purple-50/40 text-[12px]">
            <div class="font-bold text-purple-900 flex items-center gap-1 mb-1">
              <span>🗣️</span> 客語用詞道地度
            </div>
            <p class="text-stone-600 leading-relaxed">${esc(fb.vocabulary)}</p>
          </div>
          <div class="p-3 rounded-xl border border-emerald-100 bg-emerald-50/40 text-[12px]">
            <div class="font-bold text-emerald-900 flex items-center gap-1 mb-1">
              <span>📝</span> 語法流暢度
            </div>
            <p class="text-stone-600 leading-relaxed">${esc(fb.grammar)}</p>
          </div>
        </div>

        <!-- 考官講評 -->
        <div class="mb-3 text-[12.5px] bg-amber-50/60 border border-amber-200/80 p-3 rounded-xl">
          <div class="font-bold text-amber-900 mb-1 flex items-center gap-1">
            <span>💡</span> 考官總評：
          </div>
          <p class="text-stone-700 leading-relaxed" style="white-space:pre-wrap;">${esc(fb.critique)}</p>
        </div>
      ` : (
        item.target ? `
          <div class="text-[12px] mb-3 text-stone-500 bg-stone-50 p-2.5 rounded-xl border border-stone-100 leading-relaxed font-display" style="white-space:pre-wrap;">
            <span class="font-semibold text-stone-600">參考客語：</span>${esc(item.target)}
          </div>
        ` : ''
      )}

      <div class="flex items-baseline gap-2 pt-3 border-t border-stone-100">
        <span class="font-display text-3xl font-black" style="color:${scoreColor(item.score)};">${item.score}</span>
        <span class="text-[12px] text-stone-400">／100 分</span>
        <span class="text-[11px] text-stone-400 ml-auto">作答錄音：${item.seconds || '--'} 秒</span>
      </div>
    </div>`;
}

function renderResult(){
  const pendingItems = state.log.filter(x => x.pending);
  const doneItems = state.log.filter(x => !x.pending);
  const isAllDone = pendingItems.length === 0;
  const avg = doneItems.length > 0 
    ? Math.round(doneItems.reduce((s,x)=>s+x.score,0) / doneItems.length)
    : '--';

  return `
  <div class="flex-1 px-5 py-10 fade-in">
    <div class="max-w-xl mx-auto">
      <div class="text-center mb-8">
        <p class="text-sm font-semibold tracking-wide" style="color:var(--indigo-4);">模擬客語能力認證口說測驗</p>
        <h1 class="font-display text-2xl md:text-3xl font-bold mt-2">測驗結算成績</h1>
        <div class="inline-flex items-baseline gap-2 mt-4 px-6 py-2.5 rounded-2xl bg-white border border-stone-200 shadow-sm">
          <span class="text-sm font-medium text-stone-500">平均總分：</span>
          <span class="font-display text-3xl font-black" style="color:${typeof avg === 'number' ? scoreColor(avg) : 'var(--indigo-4)'};">${avg}</span>
          <span class="text-xs text-stone-400">/ 100</span>
        </div>
        <p class="text-[12.5px] mt-3" style="color:var(--ink-soft);">
          共 ${state.log.length} 題測驗。
          ${!isAllDone ? `<span class="font-semibold text-indigo-700">（目前已完成 ${doneItems.length} / ${state.log.length} 題，其餘正在背景加速評估中…）</span>` : '已全部評分完畢！'}
        </p>
      </div>

      ${!isAllDone ? `
        <div class="rounded-2xl p-4 mb-6 bg-indigo-50/80 border border-indigo-200/80 flex items-center gap-3 shadow-xs">
          <span class="spinner" style="width:16px; height:16px; border-top-color: var(--indigo-4); border-color: rgba(51,81,122,0.2);"></span>
          <div class="text-[12.5px] text-indigo-950 leading-relaxed">
            <strong>⚡ 背景非同步評分中：</strong>系統正在背景並行進行客語語音辨識與 AI 考官講評，評分完成時各題卡片會<strong>自動即時更新</strong>，無需重新整理頁面。
          </div>
        </div>
      ` : ''}

      ${state.log.map((item, idx) => renderResultItem(item, idx)).join('')}

      <div class="flex justify-center mt-8">
        <button type="button" onclick="restartExam()" class="btn-ghost rounded-full px-8 py-3 font-semibold text-[14px] shadow-xs hover:shadow cursor-pointer">重新開始測驗</button>
      </div>
    </div>
  </div>`;
}

function render(){
  const app = document.getElementById('app');
  let html = '';
  if (state.screen === 'intro') html = renderIntro();
  else if (state.screen === 'question') html = renderQuestion();
  else if (state.screen === 'result') html = renderResult();
  app.innerHTML = html;
}

render();
</script>
</body>
</html>
