<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>字磚｜伙房屋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;900&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--indigo:#1F3A5F;--brick:#B85C3C;--grain:#E8C87A;--paper:#FDFBF5;
    --bamboo:#4A7A5E;--lantern:#C0392B;--ink:#20242B;--wood:#8B6039}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--indigo);font-family:"Noto Sans TC",system-ui,sans-serif;
    color:var(--paper);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px}
  .frame{width:100%;max-width:920px}

  nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
  .tab{background:rgba(253,251,245,.08);border:1.5px solid rgba(253,251,245,.2);border-radius:12px;
    padding:8px 15px;cursor:pointer;color:var(--paper);font-family:"Noto Sans TC";
    transition:.2s;line-height:1.3;text-align:center}
  .tab:hover{background:rgba(253,251,245,.17);border-color:rgba(232,200,122,.6)}
  .tab.on{background:var(--grain);border-color:var(--grain);color:var(--ink)}
  .tab small{display:block;font-size:10.5px;opacity:.7}
  .tab b{font-family:"Noto Serif TC",serif;font-weight:900;font-size:15px;letter-spacing:.05em}

  .stage{position:relative;border-radius:18px;overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.45);background:#E9D9BB}
  svg.scene{display:block;width:100%;height:auto}
  .obj{opacity:0;transition:opacity .5s}
  .obj.on{opacity:1}
  .obj image{filter:drop-shadow(0 4px 5px rgba(38,31,22,.22))}
  .obj.pop{animation:rise .7s cubic-bezier(.34,1.4,.64,1)}
  @keyframes rise{0%{transform:translateY(26px) scale(.6);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}

  .heat{position:absolute;left:16px;top:14px;display:flex;align-items:center;gap:9px}
  .heat span{font-family:"Noto Serif TC",serif;font-weight:900;font-size:14px;
    letter-spacing:.14em;color:var(--ink);opacity:.72}
  .heatbar{width:140px;height:9px;border-radius:99px;background:rgba(32,36,43,.16);overflow:hidden}
  .heatbar i{display:block;height:100%;width:100%;background:var(--lantern);
    transform-origin:left;transform:scaleX(0);transition:transform .6s}

  .say{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);
    color:var(--paper);padding:9px 20px;border-radius:999px;font-weight:700;font-size:14.5px;
    white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.3);opacity:0;transition:opacity .3s;pointer-events:none}
  .say.on{opacity:1}

  .quiz{margin-top:12px;background:rgba(253,251,245,.07);border-radius:16px;padding:14px 16px}
  .qtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .clue{font-size:14px;opacity:.75}
  .clue b{font-family:"Noto Serif TC",serif;font-size:19px;font-weight:900;
    color:var(--grain);letter-spacing:.06em;margin-left:4px}
  .tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .tool{background:rgba(253,251,245,.12);border:1.5px solid rgba(253,251,245,.24);color:var(--paper);
    border-radius:10px;padding:7px 13px;font-size:13px;cursor:pointer;font-family:"Noto Sans TC";
    transition:.18s;white-space:nowrap}
  .tool:hover{background:rgba(253,251,245,.22)}
  .tool:disabled{opacity:.35;cursor:default}
  .tool.recording{background:var(--lantern);border-color:var(--lantern);color:#fff;animation:pulse-mic 1s infinite}
  @keyframes pulse-mic{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.85;transform:scale(1.04)}}

  .slots{display:flex;gap:10px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
  .slot{width:60px;height:60px;border-radius:12px;border:2.5px dashed rgba(253,251,245,.3);
    display:flex;align-items:center;justify-content:center;font-family:"Noto Serif TC",serif;
    font-size:30px;font-weight:900;cursor:pointer;transition:.18s;background:rgba(31,58,95,.3)}
  .slot.filled{border-style:solid;border-color:var(--grain);background:var(--grain);color:var(--ink)}
  .slot.good{border-color:var(--bamboo);background:var(--bamboo);color:var(--paper)}
  .slot.given{border-color:#9AA7AE;background:#9AA7AE;color:var(--paper)}
  .slot.bad{animation:nope .42s}
  @keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

  .tray{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
  .tile{width:48px;height:48px;border-radius:10px;border:0;cursor:pointer;background:var(--paper);
    color:var(--ink);font-family:"Noto Serif TC",serif;font-size:24px;font-weight:900;
    transition:.15s;box-shadow:0 3px 8px rgba(0,0,0,.28)}
  .tile:hover{transform:translateY(-4px)}
  .tile.used{opacity:.2;pointer-events:none;box-shadow:none}
  .tile.demo{background:var(--lantern);color:var(--paper);transform:translateY(-7px) scale(1.1)}


  /* 課文面板：拼著詞了後，聽該詞在課文肚个原句 */
  .text{margin-top:12px;background:rgba(253,251,245,.06);border-radius:16px;
    padding:0 16px;max-height:0;overflow:hidden;opacity:0;
    transition:max-height .5s ease,opacity .4s,padding .4s}
  .text.on{max-height:260px;opacity:1;padding:14px 16px}
  .thead{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .tlab{font-family:"Noto Sans TC";font-size:15px;font-weight:700;letter-spacing:.04em;
    color:var(--grain);background:rgba(232,200,122,.12);border:1px solid rgba(232,200,122,.34);
    border-radius:999px;padding:5px 15px}
  .who{background:rgba(232,200,122,.16);border:1px solid rgba(232,200,122,.4);
    border-radius:999px;padding:3px 12px;font-size:12px;color:var(--grain)}
  .spk{margin-left:auto;background:var(--grain);color:var(--ink);border:0;border-radius:999px;
    padding:7px 16px;font-family:"Noto Sans TC";font-weight:700;font-size:13px;cursor:pointer}
  .spk:hover{background:var(--paper)}
  .spk.mute{background:rgba(253,251,245,.12);color:rgba(253,251,245,.5);cursor:default}
  .tha{font-family:"Noto Serif TC",serif;font-size:19px;font-weight:500;line-height:1.85;letter-spacing:.02em}
  .tha em{font-style:normal;font-weight:900;color:var(--grain);
    border-bottom:2.5px solid var(--lantern);padding-bottom:1px}
  .tpy{margin-top:7px;font-size:12.5px;line-height:1.7;color:rgba(253,251,245,.5);letter-spacing:.01em}
  .bottom{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:14px}
  .hint{font-size:13px;opacity:.66;line-height:1.6}
  .count{font-family:"Noto Serif TC",serif;font-weight:900;font-size:14px;letter-spacing:.08em;white-space:nowrap;opacity:.9}
  .restart{background:var(--grain);color:var(--ink);border:0;border-radius:999px;padding:10px 24px;
    font-family:"Noto Sans TC";font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;transition:.18s}
  .restart:hover{background:var(--paper)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ===== 詞義考驗 ===== */
  .wtest{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    background:rgba(31,58,95,.62);opacity:0;pointer-events:none;transition:opacity .3s}
  .wtest.on{opacity:1;pointer-events:auto}
  .wt-card{background:var(--paper);color:var(--ink);border-radius:22px;padding:16px 24px 15px;
    text-align:center;min-width:290px;max-width:90%;
    border:2px solid rgba(232,200,122,.9);box-shadow:0 18px 44px rgba(0,0,0,.42)}
  .wt-top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:4px}
  .wt-tip{font-size:12px;letter-spacing:.1em;opacity:.55}
  .wt-prog{font-size:12px;opacity:.4;font-variant-numeric:tabular-nums}
  .wt-card b{display:block;font-family:"Noto Serif TC",serif;font-weight:900;
    font-size:34px;line-height:1.2;letter-spacing:.05em}
  .wt-row{display:flex;gap:7px;margin:12px 0 8px}
  .wt-in{flex:1;border:1.5px solid rgba(32,36,43,.25);border-radius:12px;padding:9px 12px;
    font-family:"Noto Sans TC",sans-serif;font-size:15px;color:var(--ink);background:#fff}
  .wt-in:focus{outline:none;border-color:var(--grain)}
  .wt-mic{border:1.5px solid rgba(32,36,43,.22);background:#fff;border-radius:12px;
    padding:0 13px;font-size:17px;cursor:pointer}
  .wt-mic.on{background:var(--lantern);border-color:var(--lantern)}
  .wt-res{min-height:19px;font-size:13px;line-height:1.5;opacity:.7;margin:0 0 10px}
  .wt-res.v2{color:#2E7D52;opacity:1;font-weight:700}
  .wt-res.v1{color:#B8862B;opacity:1;font-weight:700}
  .wt-res.v0{color:var(--lantern);opacity:1;font-weight:700}
  .wt-demo{display:none;font-size:11px;opacity:.42;margin:-4px 0 9px;letter-spacing:.02em}
  .wt-btns{display:flex;gap:8px;justify-content:center}
  .wt-btns button{border:0;border-radius:999px;padding:9px 22px;cursor:pointer;
    font-family:"Noto Sans TC",sans-serif;font-weight:700;font-size:14px;
    background:var(--grain);color:var(--ink)}
  .wt-btns .wt-skip{background:transparent;border:1.5px solid rgba(32,36,43,.2);opacity:.7}
  .wt-btns button:disabled{opacity:.35;cursor:default}

  /* 開發者模式開關與左側面板 (同 你家在哪) */
  body.debug-mode {
    padding-left: 280px;
    transition: padding-left 0.25s ease;
  }
  .mode-toggle {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 12px;
    border: 1.5px solid rgba(253,251,245,.25);
    border-radius: 999px;
    color: var(--paper);
    background: rgba(31,58,95,.8);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .mode-toggle:hover { border-color: var(--grain); background: rgba(253,251,245,.15); }
  .mode-toggle input { width: 15px; height: 15px; accent-color: var(--grain); cursor: pointer; }
  .developer-panel {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 280px;
    height: 100vh;
    overflow-y: auto;
    background: rgba(255, 253, 250, 0.98);
    border-right: 2px solid #d4c19c;
    box-shadow: 14px 0 32px rgba(91, 67, 35, 0.16);
    color: #17222a;
    padding: 22px 18px;
    font-size: 13.5px;
    z-index: 99999;
    box-sizing: border-box;
  }
  .developer-panel[hidden] { display: none; }
  .developer-panel h2 {
    font-family: "Noto Serif TC", serif;
    font-size: 18px;
    font-weight: 900;
    color: #4a3828;
    margin: 0 0 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .developer-panel h2 span { font-size: 12px; opacity: .7; font-family: sans-serif; }
  .developer-panel .target-sentence {
    margin: 0 0 14px;
    padding: 12px;
    border: 1.5px solid rgba(47, 148, 111, 0.35);
    border-radius: 12px;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
  }
  .developer-panel .sentence-label {
    display: inline-block;
    color: #2e7d52;
    font-size: 12px;
    font-weight: 900;
    margin-bottom: 4px;
  }
  .developer-panel .target-sentence strong {
    display: block;
    font-family: "Noto Serif TC", serif;
    font-size: 20px;
    font-weight: 900;
    color: #17222a;
    margin-bottom: 4px;
  }
  .developer-panel .target-sentence small {
    display: block;
    font-size: 13px;
    color: #666;
  }
  .developer-panel .developer-item {
    margin-top: 14px;
  }
  .developer-panel .developer-label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: #4a3828;
    margin-bottom: 4px;
  }
  .developer-panel .dev-btns {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  .developer-panel .dev-btn {
    background: #fff;
    border: 1.5px solid #d4c19c;
    color: #4a3828;
    border-radius: 8px;
    padding: 5px 11px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: .15s;
  }
  .developer-panel .dev-btn:hover {
    background: #f0e6d2;
    border-color: #ba9e6e;
  }
  .developer-panel .dev-select {
    width: 100%;
    border: 1.5px solid #d4c19c;
    border-radius: 8px;
    padding: 6px 10px;
    background: #fff;
    color: #17222a;
    font-size: 13px;
    font-weight: 600;
    margin-top: 4px;
    outline: none;
    box-sizing: border-box;
    cursor: pointer;
  }
  .developer-panel .dev-select:focus { border-color: #2e7d52; }
  .menu-back { transition: left 0.25s ease; }
  body.debug-mode .menu-back { left: 296px !important; }
  @media (max-width: 1100px) {
    body.debug-mode { padding-left: 0; }
    body.debug-mode .menu-back { left: 10px !important; }
  }
</style>

<div class="frame">
  <nav id="tabs"></nav>

  <div class="stage" id="stage">
    <svg class="scene" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg">
      <g id="bg"></g>
      <g id="furn"></g>
      <g id="objs"></g>
      <rect id="tint" width="900" height="400" opacity="0" style="mix-blend-mode:multiply"/>
    </svg>
    <div class="heat"><span>鬧熱</span><div class="heatbar"><i id="heat"></i></div></div>
    <div class="say" id="say"></div>
  </div>

  <div class="quiz">
    <div class="qtop">
      <p class="clue">愛揣个係：<b id="clue">－</b></p>
      <div class="tools">
        <button class="tool" id="btnPlay">🔊 聽一擺</button>
        <button class="tool" id="btnMic">🎤 開口拼字</button>
        <button class="tool" id="btnDemo">看順序</button>
        <button class="tool" id="btnAns">解答</button>
        <button class="tool" id="btnSkip">跳過</button>
        <label class="mode-toggle" title="顯示客語答案與開發者面板">
          <input id="debugToggle" type="checkbox">
          <span>開發者模式</span>
        </label>
      </div>
    </div>
    <div class="slots" id="slots"></div>

  <div class="text" id="textBox">
    <div class="thead">
      <span class="tlab" id="tLab">華 語</span>
      <span class="who" id="tWho">—</span>

  <div class="bottom">

    <p class="count" id="count">0 / 10</p>
    <button class="restart" id="btnReset">重新開始</button>
  </div>
</div>

<script>
/* ===================== 共用繪圖 ===================== */
const BRICK = `

/* 粽仔：四角粽側面，粽葉煮過係橄欖青，麻索仔綁等 */
function Z(x,y,rot,sc){
  return `<g transform="translate(${x},${y}) rotate(${rot}) scale(${sc})">
    <path d="M2 -30 l16 10 l6 8 l-4 26 l-10 12 l-22 2 l-12 -10 l-2 -22 l8 -16Z" fill="#7A7D42"/>

}

/* 人物產生器 */
function P(x, y, shirt, o={}){
  const hair = o.hair || "#20242B";
  const s = o.s || 1;
  return `<g transform="translate(${x},${y}) scale(${s})">
    <rect x="-15" y="0" width="30" height="${o.tall?54:48}" rx="8" fill="${shirt}"/>
    <circle cx="0" cy="-17" r="17" fill="#F2C9A0"/>
    <path d="M-17 -22 q17 -20 34 0 q-8 -12 -17 -12 q-9 0 -17 12Z" fill="${hair}"/>
    <circle cx="-6" cy="-15" r="2.4" fill="#20242B"/><circle cx="7" cy="-15" r="2.4" fill="#20242B"/>
    ${o.face||`<path d="M-6 -6 q7 5 13 0" stroke="#20242B" stroke-width="2.2" fill="none" stroke-linecap="round"/>`}
    ${o.extra||""}</g>`;
}
const POUT  = `<path d="M-2 -6 q5 -5 9 0 q-5 5 -9 0Z" fill="#20242B"/>`;
const FLAT  = `<path d="M-6 -6 h13" stroke="#20242B" stroke-width="2.3" stroke-linecap="round"/>`;
const SWEAT = `<path d="M15 -24 q4 7 0 10 q-4 -3 0 -10Z" fill="#7FA8C4"/>`;

/* ===================== 五課資料 ===================== */
const LESSONS = [
{
 id:"3-1-1", tab:"3年上 第1課", name:"正月半 · 庄頭", room:"bare",
 furn:``,
 words:[
  {w:'伙房屋',c:'三合院',u:'224_d1bbdda8a888cc89e16afa8426872281',

/* 拼著詞了後，帶出該詞在課文肚个原句 */
let sentAudio=null;
function showSentence(word){
  const box=$("textBox"), rec=(SENT[L.id]||{})[word];
  if(!rec){ box.classList.remove("on"); return; }
  $("tWho").textContent=rec.r;
  $("tLab").textContent = (cur && cur.w===word ? cur.c : (L.words.find(o=>o.w===word)||{}).c) || "華 語";
  $("tHa").innerHTML = rec.h.replaceAll(word, `<em>${word}</em>`);
  $("tPy").textContent=rec.p;
  const btn=$("tSpk");
  btn.className="spk"; btn.textContent="🔊 聽這句";
  btn.onclick=()=>{
    if(sentAudio) sentAudio.pause();
    if(audio) audio.pause();
    sentAudio=new Audio(rec.u); sentAudio.play().catch(()=>{});
  };
  box.classList.add("on");
}

/* ── 詞義批改服務位址。空白 = 毋開這隻功能，遊戲同原本一模一樣 ──
   跑 judge_server.js 以後，改做 "http://localhost:8787/judge" */
const AI_URL = "demo";

/* ===== 詞義考驗：全部拼著以後，用華語講出詞義，送去批改 ===== */
/* AI_URL 空白就完全毋會出現，遊戲同原本一模一樣 */
const QUIZ=(()=>{
  const N=3;                                  // 一擺考幾題
  let box=null,elW,elC,inp,bMic,bGo,bSkip,res,prog;
  let list=[],at=0,right=0,busy=false,rec=null;

  function build(){
    box=document.createElement("div");
    box.className="wtest";
    box.innerHTML='<div class="wt-card">'
      +'<p class="wt-top"><span class="wt-tip">用華語講看啊，這隻詞係麼个意思</span>'
      +'<span class="wt-prog"></span></p>'
      +'<b class="wt-w"></b><span class="wt-c"></span>'
      +'<div class="wt-row">'
      +'<input class="wt-in" type="text" maxlength="60" placeholder="打字，抑係撳麥克風講">'
      +'<button type="button" class="wt-mic" title="用講个">🎤</button>'
      +'</div>'
      +'<p class="wt-res"></p><p class="wt-demo">示範模式：正式 AI 判斷需 Anthropic API 金鑰</p>'
      +'<div class="wt-btns">'
      +'<button type="button" class="wt-go">送出</button>'
      +'<button type="button" class="wt-skip">這題免</button>'
      +'</div></div>';
    (document.getElementById("stage")||document.body).appendChild(box);
    elW=box.querySelector(".wt-w");  elC=box.querySelector(".wt-c");
    inp=box.querySelector(".wt-in"); bMic=box.querySelector(".wt-mic");
    bGo=box.querySelector(".wt-go"); bSkip=box.querySelector(".wt-skip");
    res=box.querySelector(".wt-res"); prog=box.querySelector(".wt-prog");
    if(AI_URL==="demo") box.querySelector(".wt-demo").style.display="block";
    bGo.onclick=submit; bSkip.onclick=next;
    inp.onkeydown=e=>{ if(e.key==="Enter") submit(); };
    bMic.onclick=speak;
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR && !window.HAKKA_REALTIME_ASR) bMic.style.display="none";
    box.addEventListener("pointerdown",e=>e.stopPropagation());
  }

  let activeAsrSession=null;
  function speak(){
    if(!window.HAKKA_REALTIME_ASR){
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(!SR) return;
      if(rec){ try{rec.stop();}catch(e){} rec=null; bMic.classList.remove("on"); return; }
      rec=new SR(); rec.lang="zh-TW"; rec.interimResults=false; rec.maxAlternatives=1;
      rec.onresult=e=>{ inp.value=e.results[0][0].transcript; };
      rec.onerror=()=>{ res.textContent="麥克風用毋著，直接打字就好。"; res.className="wt-res"; };
      rec.onend=()=>{ rec=null; bMic.classList.remove("on"); };
      try{ rec.start(); bMic.classList.add("on"); res.textContent="講啊⋯⋯"; res.className="wt-res"; }
      catch(e){ rec=null; }
      return;
    }
    if(activeAsrSession){
      try{ activeAsrSession.stop(); }catch(e){}
      activeAsrSession=null;
      bMic.classList.remove("on");
      return;
    }
    bMic.classList.add("on");
    res.textContent="聆聽中⋯⋯請講出意思";
    res.className="wt-res";
    activeAsrSession = window.HAKKA_REALTIME_ASR.createSession({
      onTranscript:(text)=>{
        if(text) inp.value = text;
      },
      onFinal:(text)=>{
        if(text) {
          inp.value = text;
          res.textContent = "已辨識：「" + text + "」，請點擊「送出」。";
        }
        bMic.classList.remove("on");
        activeAsrSession = null;
      },
      onError:(err)=>{
        console.warn("ASR error:", err);
        res.textContent="辨識異常，請直接打字。";
        bMic.classList.remove("on");
        activeAsrSession = null;
      }
    });
    activeAsrSession.start().catch(()=>{
      bMic.classList.remove("on");
      activeAsrSession = null;
      res.textContent="麥克風啟動失敗，請直接輸入。";
    });
  }

  /* 離線示範：用關鍵字涵蓋率判，準度毋比 AI，只做流程展示 */
  function demoJudge(gloss, ans){
    const clean=t=>String(t||"").replace(/[\s，。、,.!！?？「」（）()]/g,"");
    const a=clean(ans);
    if(a.length<2) return {verdict:0, hint:"再多講一屑仔看啊。"};
    let best=0;
    clean(gloss).length;
    String(gloss).split(/[、，,\/]/).forEach(g=>{
      g=clean(g); if(!g) return;
      if(a.indexOf(g)>=0){ best=1; return; }
      let hit=0; const seen={};
      for(const ch of g) if(!seen[ch]){ seen[ch]=1; if(a.indexOf(ch)>=0) hit++; }
      const uniq=Object.keys(seen).length||1;
      best=Math.max(best, hit/uniq);
    });
    if(best>=0.99) return {verdict:2, hint:"答著咧，就係這个意思。"};
    if(best>=0.5)  return {verdict:1, hint:"沾到邊了，再想想還少了什麼。"};
    return {verdict:0, hint:"再想想，可以回頭看那句課文。"};
  }

  async function submit(){
    if(busy) return;
    const ans=inp.value.trim();
    if(!ans){ res.textContent="先講看啊，抑係撳「這題免」。"; res.className="wt-res"; return; }
    busy=true; bGo.disabled=true; res.textContent="批改中⋯⋯"; res.className="wt-res";
    const q=list[at];
    try{
      let j;
      if(AI_URL==="demo"){
        await new Promise(r=>setTimeout(r,320));          /* 假裝在想 */
        j=demoJudge(q.c, ans);
      }else{
        const r=await fetch(AI_URL,{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({word:q.w,gloss:q.c,answer:ans})});
        if(!r.ok) throw new Error("http "+r.status);
        j=await r.json();
      }
      const v=j.verdict===2?2:j.verdict===1?1:0;
      if(v===2) right++;
      res.textContent=(v===2?"✓ ":v===1?"～ ":"✗ ")+(j.hint||"");
      res.className="wt-res v"+v;
      bGo.disabled=false; bGo.textContent="下一題"; bGo.onclick=next;
    }catch(e){
      res.textContent="連毋著批改服務，這關先跳過。";
      res.className="wt-res";
      setTimeout(close,1400);
    }
    busy=false;
  }

  function next(){
    at++;
    if(at>=list.length) return close(true);
    show();
  }

  function show(){
    const q=list[at];
    elW.textContent=q.w; elC.textContent="";      // 華語解答先毋好漏出來
    prog.textContent=(at+1)+" / "+list.length;
    inp.value=""; res.textContent=""; res.className="wt-res";
    bGo.disabled=false; bGo.textContent="送出"; bGo.onclick=submit;
    setTimeout(()=>{ try{inp.focus();}catch(e){} },60);
  }

  function close(done){
    if(activeAsrSession){ try{activeAsrSession.stop();}catch(e){} activeAsrSession=null; }
    if(rec){ try{rec.stop();}catch(e){} rec=null; }
    if(bMic) bMic.classList.remove("on");
    box.classList.remove("on");
    if(done && typeof onDone==="function") onDone(right,list.length);
  }
  let onDone=null;

  /* words = [{w,c}]；hard = 看過解答个詞，優先考 */
  function start(words,hard,cb){
    if(typeof AI_URL!=="string" || !AI_URL) return false;
    if(!box) build();
    onDone=cb;
    const h=words.filter(o=>hard.has(o.w)), e=words.filter(o=>!hard.has(o.w));
    const mix=(a)=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
    list=mix(h).concat(mix(e)).slice(0,Math.min(N,words.length));
    if(!list.length) return false;
    at=0; right=0; busy=false;
    box.classList.add("on"); show();
    return true;
  }
  return { start, __demo:demoJudge };
})();

function load(i){
  [...$("tabs").children].forEach((t,j)=>t.classList.toggle("on",i===j));
  L=LESSONS[i];
  $("bg").innerHTML = BG_OVERRIDE[L.id]
    || (L.room==="yard" ? YARD : L.room==="bare" ? YARD_BARE : BRICK);

  const over = ART_OVERRIDE[L.id] || {};
  $("objs").innerHTML = L.words.map(o=>
    `<g class="obj" id="o_${o.w}">${over[o.w] || o.svg}</g>`).join("");
  $("tint").setAttribute("fill", curTint ? curTint.c : "#E8942E");
  reset();
  renderDeveloperPanel();
}

  if(audio) audio.pause();
  stopTileMic();
  solved.clear(); given.clear(); placed=[]; idx=0; cur=null; curTint=null;
  L.words.forEach(o=>{ const g=$("o_"+o.w); if(g) g.classList.remove("on","pop"); });

  $("count").textContent=`0 / ${L.words.length}`;
  $("btnPlay").disabled=$("btnMic").disabled=$("btnDemo").disabled=$("btnSkip").disabled=$("btnAns").disabled=false;

  $("textBox").classList.remove("on");
  if(sentAudio) sentAudio.pause();
  buildTray(); nextWord();
}

function buildTray(){
  pool=L.words.flatMap((o,wi)=>[...o.w].map((ch,ci)=>({ch,id:`${wi}-${ci}`})));
  for(let i=pool.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[pool[i],pool[j]]=[pool[j],pool[i]];}
  trayEl.innerHTML="";
  pool.forEach(t=>{
    const b=document.createElement("button");
    b.className="tile"; b.textContent=t.ch;
    b.onclick=()=>pick(t,b);
    trayEl.appendChild(b);
  });
}

const line=(t,ms=2200)=>{say.textContent=t;say.classList.add("on");
  clearTimeout(line.t);line.t=setTimeout(()=>say.classList.remove("on"),ms);};
function play(u){ if(audio) audio.pause(); audio=new Audio(BASE+u+".mp3"); audio.play().catch(()=>{}); }

function nextWord(){
  stopTileMic();
  const left=L.words.map((o,i)=>i).filter(i=>!solved.has(i));
  if(!left.length) return finish();
  idx = left.includes(idx) ? idx : left[0];
  cur=L.words[idx]; placed=[]; demoUsed=false;
  $("btnDemo").disabled=false; $("btnAns").disabled=false;
  $("clue").textContent=cur.c;
  slotsEl.innerHTML="";
  [...cur.w].forEach((_,i)=>{
    const d=document.createElement("div");
    d.className="slot"; d.onclick=()=>unplace(i);
    slotsEl.appendChild(d);
  });
  setTimeout(()=>play(cur.u),350);
  renderDeveloperPanel();
}

function pick(t,btn){
  if(!cur||placed.length>=cur.w.length) return;
  placed.push({ch:t.ch,btn}); btn.classList.add("used");
  const s=slotsEl.children[placed.length-1];
  s.textContent=t.ch; s.classList.add("filled");
  if(placed.length===cur.w.length) check();
}

function unplace(fromIdx){
  if(!placed.length || fromIdx<0 || fromIdx>=placed.length) return;
  const removed = placed.splice(fromIdx);
  removed.forEach(p=>{ p.btn.classList.remove("used"); });
  for(let i=fromIdx; i<slotsEl.children.length; i++){
    const s=slotsEl.children[i];
    s.textContent=""; s.className="slot";
  }
}

function check(){
  const got=placed.map(p=>p.ch).join("");
  if(got===cur.w){
    [...slotsEl.children].forEach(s=>{s.classList.remove("filled");s.classList.add("good");});
    play(cur.u); reveal(cur.w); solved.add(idx); score();
    showSentence(cur.w);
    line(`${cur.w} —— 著咧！`,2200);
    setTimeout(nextWord,2500);
  }else{
    [...slotsEl.children].forEach(s=>s.classList.add("bad"));
    line("毋著，再聽一擺看啊",2000);
    setTimeout(()=>{
      [...slotsEl.children].forEach(s=>s.classList.remove("bad"));
      unplace(0); play(cur.u);
    },520);
  }
}

function score(){
  $("count").textContent=`${solved.size} / ${L.words.length}`;
  const p=solved.size/L.words.length;
  $("heat").style.transform=`scaleX(${p})`;
  if(curTint){
    $("tint").setAttribute("fill",curTint.c);
    $("tint").setAttribute("opacity",curTint.a);
  }else{
    $("tint").setAttribute("fill","#E8942E");
    $("tint").setAttribute("opacity",(p*0.12).toFixed(3));
  }
}

function reveal(w){
  const word=L.words.find(o=>o.w===w);
  /* 互斥群組：同一組內只留最新一個（例：天氣） */
  if(word&&word.excl){
    L.words.filter(o=>o.excl===word.excl&&o.w!==w).forEach(o=>{
      const sib=$("o_"+o.w); if(sib) sib.classList.remove("on","pop");
    });
  }
  if(word&&word.tint){ curTint={c:word.tint,a:word.tintAmt}; }
  const g=$("o_"+w);
  if(g){ g.classList.add("on","pop"); setTimeout(()=>g.classList.remove("pop"),720); }
}

let tileAsrSession = null;
function stopTileMic(){
  if(tileAsrSession){
    try{ tileAsrSession.stop(); }catch(e){}
    tileAsrSession = null;
  }
  const btn = $("btnMic");
  if(btn){
    btn.classList.remove("recording");
    btn.textContent = "🎤 開口拼字";
  }
}

function toggleTileMic(){
  if(!cur) return;
  if(tileAsrSession){
    stopTileMic();
    line("已停止錄音", 1200);
    return;
  }
  if(!window.HAKKA_REALTIME_ASR){
    line("目前環境不支援即時語音辨識", 2000);
    return;
  }
  const currentLang = window.HAKKA_REALTIME_ASR?.getLanguage?.() || "hak";
  const isMandarin = (currentLang === "zh");
  const targetText = isMandarin ? cur.c : cur.w;
  const targetLabel = isMandarin ? `華語意思「${cur.c}」` : `客語正字「${cur.w}」`;

  const btn = $("btnMic");
  btn.classList.add("recording");
  btn.textContent = "🔴 聆聽中...";
  line(`請開口唸${targetLabel}`, 3000);

  let matched = false;
  tileAsrSession = window.HAKKA_REALTIME_ASR.createSession({
    language: currentLang,
    onTranscript: (txt) => {
      if(!txt || !cur) return;
      line(`聽到：${txt}`, 2000);
      const cleanTxt = txt.replace(/[\s，。、,.!！?？「」（）()]/g, "");
      const cleanTarget = targetText.replace(/[\s，。、,.!！?？「」（）()]/g, "");
      if(cleanTxt.includes(cleanTarget) || cleanTarget.includes(cleanTxt)){
        matched = true;
        stopTileMic();
        unplace(0);
        const used = new Set();
        for(const ch of [...cur.w]){
          const tBtn = [...trayEl.children].find(b => b.textContent === ch && !used.has(b) && !b.classList.contains("used"));
          if(tBtn){
            used.add(tBtn);
            placed.push({ ch, btn: tBtn });
            tBtn.classList.add("used");
            const s = slotsEl.children[placed.length - 1];
            if(s){
              s.textContent = ch;
              s.classList.add("filled");
            }
          }
        }
        if(placed.length === cur.w.length){
          check();
        }
      }
    },
    onFinal: (txt) => {
      stopTileMic();
      if(!matched && cur){
        if(txt){
          line(`辨識為「${txt}」，不是「${targetText}」，請再試一次`, 2500);
        } else {
          line("未收錄到清晰聲音，請靠近麥克風再試一次", 2200);
        }
      }
    },
    onError: (err) => {
      console.warn("Tile ASR error:", err);
      stopTileMic();
      line("辨識連線異常，請手動點擊字磚", 2500);
    }
  });

  tileAsrSession.start().catch(err => {
    console.warn("Start tile ASR error:", err);
    stopTileMic();
    line("麥克風無法啟用", 2000);
  });
}

$("btnPlay").onclick=()=>{ if(cur) play(cur.u); };
$("btnMic").onclick=toggleTileMic;
$("btnAns").onclick=()=>{
  if(!cur) return;
  stopTileMic();
  $("btnAns").disabled=true; $("btnDemo").disabled=true;
  unplace(0);
  const used=new Set();
  [...cur.w].forEach((ch,i)=>{
    const btn=[...trayEl.children].find(b=>b.textContent===ch&&!used.has(b)&&!b.classList.contains("used"));
    if(btn){ used.add(btn); btn.classList.add("used"); placed.push({ch,btn}); }
    const s=slotsEl.children[i]; s.textContent=ch; s.classList.add("given");
  });
  play(cur.u); reveal(cur.w); given.add(idx); solved.add(idx); score();
  showSentence(cur.w);
  line(`${cur.w}（${cur.c}）`,2400);
  setTimeout(nextWord,2500);
};
$("btnSkip").onclick=()=>{
  stopTileMic();
  const left=L.words.map((o,i)=>i).filter(i=>!solved.has(i));
  if(left.length<2) return line("賰這個爾咧",1800);
  unplace(0);
  idx=left[(left.indexOf(idx)+1)%left.length];
  nextWord();
};
$("btnDemo").onclick=async()=>{
  if(!cur||demoUsed) return;
  stopTileMic();
  demoUsed=true; $("btnDemo").disabled=true;
  unplace(0); play(cur.u);
  const used=new Set();
  for(const ch of [...cur.w]){
    const btn=[...trayEl.children].find(b=>b.textContent===ch&&!used.has(b)&&!b.classList.contains("used"));
    if(btn){ used.add(btn); btn.classList.add("demo");
      await new Promise(r=>setTimeout(r,620));
      btn.classList.remove("demo");
      await new Promise(r=>setTimeout(r,120));
    }
  }
};
$("btnReset").onclick=reset;

function finish(){
  stopTileMic();
  cur=null; slotsEl.innerHTML="";
  $("clue").textContent="全部好咧";
  $("btnPlay").disabled=$("btnMic").disabled=$("btnDemo").disabled=$("btnSkip").disabled=$("btnAns").disabled=true;
  line("全部到齊咧！",3600);
  const self=L.words.length-given.size;
  const base = given.size
    ? `十個詞全部到齊。其中 ${self} 個係你自家拼出來个，${given.size} 個看過解答。`
    : "十個詞全部係你自家拼出來个，一擺解答都無看。";
  $("hint").textContent = base;
  setTimeout(()=>{
    QUIZ.start(L.words.map(o=>({w:o.w,c:o.c})), given, (right,total)=>{
      $("hint").textContent = base + `　詞義考驗：答著 ${right} / ${total} 題。`;
    });
  }, 1600);
}

/* 開發者模式邏輯 */
let debugMode = false;
try {
  debugMode = localStorage.getItem("speakingDemoDebugMode") === "true";
} catch(e) {}

function renderDeveloperPanel() {
  const panel = $("developerPanel");
  const toggle = $("debugToggle");
  if (!panel || !toggle) return;
  toggle.checked = debugMode;
  panel.hidden = !debugMode;
  document.body.classList.toggle("debug-mode", debugMode);
  if (!debugMode) return;

  const currentWordObj = cur;

  panel.innerHTML = `
    <h2>內部檢視 <span>開發者模式</span></h2>
    <div class="target-sentence">
      <span class="sentence-label">客語正字（當前生詞）</span>
      <strong>${currentWordObj ? currentWordObj.w : "—"}</strong>
      <small>${currentWordObj ? currentWordObj.c : "—"}</small>
    </div>
    <div class="developer-item">
      <span class="developer-label">當前單元</span>
      <p><b>${L ? L.name : "—"}</b><br><small style="color:#666">（進度：${solved.size} / ${L.words.length}）</small></p>
    </div>
    <div class="developer-item">
      <span class="developer-label">辨識語種選擇 (Realtime ASR)</span>
      <select class="dev-select" id="devLangSelect">
        <option value="hak" ${(window.HAKKA_REALTIME_ASR?.getLanguage?.() === "zh") ? "" : "selected"}>客委會API</option>
        <option value="zh" ${(window.HAKKA_REALTIME_ASR?.getLanguage?.() === "zh") ? "selected" : ""}>華語</option>
      </select>
    </div>
    <div class="developer-item">
      <span class="developer-label">快捷拼字操作</span>
      <div class="dev-btns">
        <button type="button" class="dev-btn" id="devFillWord">⚡ 一鍵自動拼出字磚</button>
        <button type="button" class="dev-btn" id="devPlayAudio">🔊 聽生詞發音</button>
      </div>
    </div>
    <div class="developer-item">
      <span class="developer-label">通關與除錯</span>
      <div class="dev-btns">
        <button type="button" class="dev-btn" id="devFinishAll">⚡ 一鍵通關進入詞義考驗</button>
        <button type="button" class="dev-btn" id="devNextLesson">切換下一課</button>
      </div>
    </div>
  `;

  panel.querySelector("#devLangSelect")?.addEventListener("change", (e) => {
    const val = e.target.value;
    if (window.HAKKA_REALTIME_ASR?.setLanguage) window.HAKKA_REALTIME_ASR.setLanguage(val);
    renderDeveloperPanel();
  });

  panel.querySelector("#devFillWord")?.addEventListener("click", () => {
    if(!cur) return;
    unplace(0);
    const used = new Set();
    for(const ch of [...cur.w]){
      const tBtn = [...trayEl.children].find(b => b.textContent === ch && !used.has(b) && !b.classList.contains("used"));
      if(tBtn){
        used.add(tBtn);
        placed.push({ ch, btn: tBtn });
        tBtn.classList.add("used");
        const s = slotsEl.children[placed.length - 1];
        if(s){ s.textContent = ch; s.classList.add("filled"); }
      }
    }
    if(placed.length === cur.w.length) check();
    renderDeveloperPanel();
  });

  panel.querySelector("#devPlayAudio")?.addEventListener("click", () => {
    if(cur) play(cur.u);
  });

  panel.querySelector("#devFinishAll")?.addEventListener("click", () => {
    L.words.forEach((_, i) => solved.add(i));
    finish();
    renderDeveloperPanel();
  });

  panel.querySelector("#devNextLesson")?.addEventListener("click", () => {
    const nextIdx = (LESSONS.indexOf(L) + 1) % LESSONS.length;
    load(nextIdx);
  });
}

$("debugToggle")?.addEventListener("change", (e) => {
  debugMode = Boolean(e.target.checked);
  try { localStorage.setItem("speakingDemoDebugMode", String(debugMode)); } catch(err) {}
  renderDeveloperPanel();
});

load(0);
renderDeveloperPanel();
</script>

<aside id="developerPanel" class="developer-panel" hidden></aside>
</body>
</html>
