<!doctype html>
<html lang="zh-Hant">

<head>
  <link rel="stylesheet" href="./hakka-font.css?v=20260907-font4">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>繪本朗讀任務｜客語生活任務</title>
  <link rel="stylesheet" href="./Vocabulary.css?v=20260907-font1">
</head>

<body>
  <main class="game-shell">
    <header class="game-topbar">
      <a class="back-link" href="./index.html#classroom">返回</a>
      <div>
        <h1>繪本朗讀任務</h1>
      </div>
    </header>

    <section id="introScreen" class="screen intro-screen" aria-labelledby="introTitle">
      <div class="intro-copy">
        <section class="dialect-area" aria-labelledby="dialectTitle">
          <h3 id="dialectTitle">選擇腔別</h3>
          <div class="dialect-switcher">
            <button class="dialect is-active" type="button" data-dialect="sixian">四縣腔</button>
            <button class="dialect" type="button" disabled aria-disabled="true">海陸腔</button>
            <button class="dialect" type="button" disabled aria-disabled="true">大埔腔</button>
            <button class="dialect" type="button" disabled aria-disabled="true">饒平腔</button>
            <button class="dialect" type="button" disabled aria-disabled="true">詔安腔</button>
            <button class="dialect" type="button" disabled aria-disabled="true">南四縣腔</button>
          </div>
        </section>

        <section class="lesson-area" aria-labelledby="lessonTitle">
          <div class="lesson-heading">
            <h3 id="lessonTitle">選擇繪本</h3>
            <p id="lessonHint">請選擇繪本開始。</p>
          </div>
          <div class="lesson-carousel-wrap">
            <div class="lesson-carousel" id="lessonCarousel" aria-label="繪本卡片">
              <button class="lesson-card" type="button" data-url="./reading-story-1.html">
                <img src="https://dn9mvjhbyvvpc.cloudfront.net/self_study/reading/1/image/1.png" alt="〈𠊎中意讀書〉教材插圖">
                <span>繪本篇章 1</span>
                <strong lang="hak">𠊎中意讀書</strong>
                <small>主角喜歡讀書，想找一個人聽故事。家人都在做什麼呢？陪主角找找看，將故事分成三段大聲朗讀出來。</small>
              </button>

              <button class="lesson-card is-locked" type="button" data-url="./reading-story-2.html" disabled
                aria-disabled="true">
                <img src="https://dn9mvjhbyvvpc.cloudfront.net/self_study/reading/2/image/0.png" alt="〈紅色个球仔〉教材插圖">
                <span>繪本篇章 2</span>
                <strong lang="hak">紅色个球仔</strong>
                <small>大大的球去哪裡了？大聲地朗讀繪本，幫主角看看球最後去哪裡了。</small>
              </button>

              <button class="lesson-card is-locked" type="button" data-url="./reading-story-3.html" disabled
                aria-disabled="true">
                <img src="https://dn9mvjhbyvvpc.cloudfront.net/self_study/reading/14/image/0.png" alt="〈啊！有黃蚻〉教材插圖">
                <span>繪本篇章 3</span>
                <strong lang="hak">啊！有黃蚻</strong>
                <small>有蟑螂！用腳踩，用拖鞋，怎麼打也打不到，最後......。快來大聲地朗讀繪本，把蟑螂給抓住吧！</small>
              </button>
            </div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script src="./classroom.js?v=20260909-classroom1"></script>
</body>

</html>
