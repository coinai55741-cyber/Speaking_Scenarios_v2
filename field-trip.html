<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>客庄聲音小達人 - 客語口說辨識挑戰</title>
  <link rel="stylesheet" href="./field-trip.css">
  <script src="./speech-api-config.js?v=20260908-fieldtrip1"></script>
</head>
<body>
  <main class="shell">
    <header class="game-topbar">
      <a class="back-link" href="./breakfast.html">← 返回情境</a>
    </header>

    <section class="frame">
      <div class="stage">
        <img id="screen" class="screen" alt="客庄聲音小達人遊戲畫面">
        <div id="hotspots" class="hotspots"></div>
        <div id="toast" class="toast" hidden></div>

        <!-- 說明與提示對話框 -->
        <div id="helpPanel" class="overlay" hidden>
          <div class="card">
            <h2 id="helpTitle">提示</h2>
            <p id="helpText"></p>
            <button id="helpClose" class="secondary" type="button">知道了</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 辨識回饋面板與操作區 (紅框處) -->
    <footer class="below">
      <section id="asrBar" class="asr-bar asr-idle" aria-live="polite">
        <div class="asr-status-row">
          <span class="asr-dot" aria-hidden="true"></span>
          <span class="asr-badge" id="asrBadge">客語辨識</span>
          <span class="asr-msg" id="asrMsg">點擊或按住右側「換你講看啊」開始進行口說挑戰</span>
        </div>
        <div id="asrLiveRow" class="asr-live-row" hidden>
          <span class="asr-tag">即時辨識</span>
          <span class="asr-text" id="asrLiveText" lang="hak">（聆聽中⋯）</span>
        </div>
      </section>

      <div class="below-toolbar">
        <span class="badge">即時語音辨識</span>
        <button id="resetBtn" type="button">重新開始遊戲</button>
      </div>
    </footer>
  </main>

  <!-- 載入遊戲資料與資源庫 -->
  <script src="./field-trip-data.js"></script>
  <!-- 載入遊戲主邏輯 -->
  <script src="./field-trip.js"></script>
</body>
</html>
