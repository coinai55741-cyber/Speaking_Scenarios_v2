<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>庄頭一年｜客語大富翁</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2E2418;--dim:#8A7B62;--paper:#FDF6E8;--card:#FBF2DE;--line:#D8C7A4;
    --red:#D15C50;--gold:#D9A93C;--jade:#3E8A6E;--blue:#4E86B8;--purple:#A78BD0;--olive:#8FA84C}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#20303A;font-family:"Noto Sans TC",system-ui,sans-serif;color:var(--ink);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px}
  .frame{width:100%;max-width:1230px;display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start}
  @media(max-width:1000px){.frame{grid-template-columns:1fr}}

  /* ── 棋盤 ── */
  .board{position:relative;background:#F0E4C8;border-radius:20px;padding:10px;
    box-shadow:0 24px 60px rgba(0,0,0,.45);aspect-ratio:1;
    display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);gap:3px}
  .sq{border-radius:7px;padding:4px 3px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:1px;font-size:9.5px;line-height:1.25;text-align:center;
    background:var(--card);border:1.5px solid var(--line);cursor:pointer;transition:.18s;overflow:hidden}
  .sq:hover{transform:scale(1.06);z-index:5;box-shadow:0 6px 16px rgba(0,0,0,.28)}
  .sq b{font-family:"Noto Serif TC",serif;font-size:11px;font-weight:900;letter-spacing:.02em}
  .sq .t{font-size:8px;color:#fff;padding:1px 5px;border-radius:99px;letter-spacing:.06em}
  .sq.here{border-color:var(--gold);border-width:3px;box-shadow:0 0 0 3px rgba(217,169,60,.35)}
  .sq.own::after{content:"";position:absolute}
  .sq .own{font-size:8px;color:var(--jade)}
  .tk{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--red);
    border:2.5px solid #fff;box-shadow:0 3px 9px rgba(0,0,0,.4);transition:.45s cubic-bezier(.3,1.2,.4,1);
    z-index:9;pointer-events:none}

  /* 中央 */
  .mid{grid-column:2/10;grid-row:2/10;background:#FBF2DE;border-radius:14px;
    border:1.5px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;overflow-y:auto}
  .mtitle{display:flex;align-items:center;gap:9px;margin-bottom:10px}
  .seal{width:28px;height:28px;border-radius:5px;background:var(--red);color:#fff;display:flex;
    align-items:center;justify-content:center;font-family:"Noto Serif TC",serif;font-weight:900;font-size:15px}
  .mtitle b{font-family:"Noto Serif TC",serif;font-size:17px;font-weight:900;letter-spacing:.08em}
  .mtitle small{margin-left:auto;font-size:11px;color:var(--dim)}
  .body{font-family:"Noto Serif TC",serif;font-size:16px;line-height:2.05;letter-spacing:.01em}
  .kw{display:inline-block;white-space:nowrap;transition:.4s}
  .kw.blur{color:transparent;background:#B9AB90;border-radius:6px;padding:1px 5px;margin:0 2px;
    cursor:pointer;user-select:none;position:relative;vertical-align:-3px;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.2)}
  .kw.blur::after{content:"？";position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;color:rgba(255,255,255,.8);font-size:12px}
  .kw.blur:hover{background:var(--gold)}
  .kw.know{color:var(--red);font-weight:700}
  .kw.just{animation:rv .9s cubic-bezier(.2,1.3,.4,1)}
  @keyframes rv{0%{background:#F5D77C;box-shadow:0 0 0 9px rgba(245,215,124,.55)}
    100%{background:transparent;box-shadow:0 0 0 0 rgba(245,215,124,0)}}

  .opts{margin-top:12px;display:flex;flex-direction:column;gap:7px}
  .opt{border:1.5px solid var(--line);background:rgba(255,255,255,.6);border-radius:11px;
    padding:9px 12px;cursor:pointer;transition:.16s;display:flex;gap:9px;align-items:flex-start;font-size:13.5px}
  .opt:hover{border-color:var(--gold);background:#fff}
  .opt .tag{flex:0 0 auto;width:21px;height:21px;border-radius:50%;border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--dim)}
  .opt .txt{flex:1}
  .hakline{font-family:"Noto Serif TC",serif;font-size:15.5px;font-weight:700;line-height:1.65}
  .zhline{font-size:11.5px;color:var(--dim);margin-top:2px}
  .opt .hak{margin-top:3px;display:flex;gap:4px;flex-wrap:wrap}
  .opt .hak span{font-family:"Noto Serif TC",serif;font-size:12.5px;background:rgba(209,92,80,.1);
    border-radius:5px;padding:1px 6px;color:var(--red)}
  .opt .hak span.b{background:#B9AB90;color:transparent;position:relative}
  .opt .hak span.b::after{content:"？";position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;color:rgba(255,255,255,.8);font-size:11px}
  .opt .out{flex:0 0 auto;font-size:11px;color:var(--dim);text-align:right;white-space:nowrap;padding-top:2px}
  .opt.lock{opacity:.45;cursor:not-allowed}
  .opt.far{opacity:.55;cursor:default;border-style:dashed}
  .opt.far:hover{border-color:var(--line);background:rgba(255,255,255,.6)}
  .peek{margin-top:8px;font-size:11.5px;color:var(--dim);background:rgba(0,0,0,.04);
    border-radius:8px;padding:6px 10px}
  .after{margin-top:10px;padding:10px 13px;background:rgba(217,169,60,.12);border-left:3px solid var(--gold);
    border-radius:0 9px 9px 0;font-size:13px;line-height:1.8;display:none}
  .after.on{display:block}
  .mbtn{margin-top:auto;padding-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .btn{border:0;border-radius:999px;padding:11px 26px;font-weight:700;font-size:14px;cursor:pointer;
    font-family:"Noto Sans TC";background:linear-gradient(180deg,#F0CE8A,#D9A93C);color:#2E2418}
  .btn:disabled{opacity:.35;cursor:default}
  .btn.g{background:transparent;border:1.5px solid var(--line);color:var(--dim)}
  .dice{font-family:"Noto Serif TC",serif;font-size:26px;font-weight:900;color:var(--red);min-width:34px;text-align:center}
  .dice.roll{animation:dr .6s} @keyframes dr{0%,100%{transform:rotate(0)}50%{transform:rotate(360deg) scale(1.4)}}

  /* ── 側欄 ── */
  .side{display:flex;flex-direction:column;gap:12px}
  .box{background:#1A2830;border:1px solid #33454F;border-radius:16px;padding:14px 15px;color:#EDE6D8}
  .box h3{font-family:"Noto Serif TC",serif;font-size:13px;font-weight:900;letter-spacing:.18em;
    color:#D9A93C;margin-bottom:10px}
  .res{display:flex;gap:8px}
  .r{flex:1;background:#22333C;border:1px solid #33454F;border-radius:11px;padding:9px 6px;text-align:center}
  .r span{display:block;font-size:9.5px;letter-spacing:.14em;color:#8A9AA6}
  .r b{display:block;font-family:"Noto Serif TC",serif;font-size:20px;font-weight:900;margin-top:2px}
  .r b.up{animation:u .5s} @keyframes u{50%{transform:scale(1.45);color:#7FC49A}}
  .r b.dn{animation:n .5s} @keyframes n{50%{transform:scale(1.45);color:#E08A80}}
  .yr{font-size:12px;color:#8A9AA6;margin-top:9px;line-height:1.7}
  .yr b{color:#EDE6D8}
  .log{max-height:190px;overflow-y:auto;display:flex;flex-direction:column;gap:5px}
  .lg{font-size:12px;color:#B8C4CC;line-height:1.6;padding:6px 9px;background:#22333C;border-radius:8px}
  .lg b{color:#D9A93C}
  .own{display:flex;flex-wrap:wrap;gap:5px}
  .ow{font-family:"Noto Serif TC",serif;font-size:12px;background:#25382E;border:1px solid #3E6B53;
    color:#9FD4B4;border-radius:7px;padding:3px 8px}

  /* 天時卡 */
  .sky{position:fixed;inset:0;z-index:70;background:rgba(14,22,28,.9);display:flex;align-items:center;
    justify-content:center;padding:22px;opacity:0;pointer-events:none;transition:.45s}
  .sky.on{opacity:1;pointer-events:auto}
  .skc{background:#FBF2DE;border-radius:20px;overflow:hidden;max-width:340px;width:100%;
    box-shadow:0 30px 70px rgba(0,0,0,.55);transform:translateY(30px) scale(.92);transition:.6s cubic-bezier(.2,1.2,.3,1)}
  .sky.on .skc{transform:none}
  .skc svg{display:block;width:100%;height:auto}
  .skb{padding:17px 20px 20px;text-align:center}
  .skb .tag{font-size:10.5px;letter-spacing:.24em;color:var(--dim)}
  .skb h3{font-family:"Noto Serif TC",serif;font-size:25px;font-weight:900;margin:5px 0 6px;color:var(--red)}
  .skb p{font-size:13px;color:var(--dim);line-height:1.85}
  .skb .eff{margin-top:11px;background:rgba(217,169,60,.16);border-radius:10px;padding:9px 12px;
    font-family:"Noto Serif TC",serif;font-size:15px;font-weight:700}
  /* 庄民問話 */
  .ask{margin-top:12px;background:rgba(62,138,110,.1);border:1.5px solid rgba(62,138,110,.4);
    border-radius:13px;padding:13px 15px}
  .askh{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .askh b{font-family:"Noto Serif TC",serif;font-size:15px}
  .askh small{color:var(--dim);font-size:11.5px}
  .rw{margin-left:auto;background:var(--jade);color:#fff;border-radius:999px;padding:5px 13px;
    font-family:"Noto Serif TC",serif;font-size:14px;font-weight:900;animation:rwin .6s cubic-bezier(.3,1.5,.4,1)}
  @keyframes rwin{0%{transform:scale(0) rotate(-14deg);opacity:0}100%{transform:none;opacity:1}}
  .askq{font-family:"Noto Serif TC",serif;font-size:19px;font-weight:900;text-align:center;margin:8px 0 11px}
  .askg{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
  .ag{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:7px 13px;
    font-size:13px;cursor:pointer;transition:.16s}
  .ag:hover{border-color:var(--jade)}
  .ag.ok{background:#E6F2EA;border-color:var(--jade);color:var(--jade);font-weight:700}
  .ag.no{background:#F8E3E0;border-color:var(--red);color:var(--red)}
  .over{position:fixed;inset:0;z-index:60;background:rgba(16,24,30,.94);display:flex;align-items:center;
    justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:.5s}
  .over.on{opacity:1;pointer-events:auto}
  .op{background:#FBF2DE;border-radius:20px;padding:30px 34px;max-width:560px;text-align:center}
  .op h2{font-family:"Noto Serif TC",serif;font-size:27px;font-weight:900;color:var(--red);letter-spacing:.08em}
  .op .en{font-family:"Noto Serif TC",serif;font-size:18px;margin:12px 0;line-height:1.9}
  .op p{font-size:13.5px;color:var(--dim);line-height:1.9}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}

  .back-link{position:fixed;left:18px;top:18px;z-index:50;display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 16px;border:2px solid #2f946f;border-radius:999px;color:#2f946f;background:rgba(255,255,255,.92);font-weight:900;text-decoration:none;box-shadow:0 8px 18px rgba(0,0,0,.12)}
  .back-link:hover{background:#2f946f;color:#fff}
  @media(max-width:560px){.back-link{left:12px;top:12px;min-height:34px;padding:0 13px;font-size:13px}}
</style>
</head>

    <div class="box" style="display:flex;align-items:center;gap:10px;padding:11px 14px">

        人情 <b style="color:#7FC49A">75 以上</b>　一隻詞 <b>3</b> 銀　<span style="color:#7FC49A">＋年頭送 3 隻</span><br>

        人情 <b style="color:#D9A93C">20–44</b>　　一隻詞 <b>8</b> 銀<br>
        人情 <b style="color:#E08A80">20 以下</b>　一隻詞 <b>13</b> 銀</div>
      <p style="font-size:11.5px;color:#8A9AA6;margin-top:8px;line-height:1.7">
        庄民愈熟你，愈肯教你。通關看个係詞 —— 人情就係學費个折扣。</p></div>
    <div class="box"><h3>庄 頭 產 業</h3><div class="own" id="ownList"><span style="font-size:12px;color:#8A9AA6">還吂有</span></div></div>
    <div class="box"><h3>記 事</h3><div class="log" id="log"></div></div>
  </div>
</div>

<div class="sky" id="sky"><div class="skc" id="skc"></div></div>

{i:5,k:'7-1-6',name:'茶壽人家',type:'產業',body:'【為著】消磨時間就去【跈】鄰舍學做【茶壽】，用【禾稈】編起來做个【燒罐】，這種【罕得】个傳統手藝【硬硬】會失傳了！【淨伸】在汶水地區幾個老師傅曉得做【茶壽】。',obj:[],opts:[{h:'𠊎摎阿婆學編茶壽',t:'學阿婆用禾稈編一個茶壽，花整個下午',m:-6,f:16},{h:'買一隻燒罐較遽',t:'直接買現成的保溫瓶',m:-18,f:0},{h:'編茶壽去街路賣，趁兜錢',t:'編幾隻茶壽拿去街路賣',m:18,f:2}]},
{i:6,k:'7-2-1',name:'六腔調路口',type:'語言',body:'南、北兩地【四縣腔】个詞彙【略略仔】【無共樣】，像北【四縣腔】講講【海陸腔】个人在新竹地區較多，聲調同【四縣腔】顛倒，共樣个話，講做另外，還有人講【四海客話】，【四縣腔】講不管係講哪種【腔調】个客話，𠊎兜都愛互相【包容】、學習。',obj:['腔調','四縣腔','海陸腔','大埔腔','饒平腔','詔安腔','四海客話'],opts:[{h:'𠊎學佢兜个腔調來講',t:'學隔壁庄的腔調，跟他們用他們的話講',m:-8,f:18},{h:'𠊎淨講自家个腔',t:'堅持只講自己的腔，聽不懂就算了',m:0,f:-10},{h:'講華語較遽',t:'兩邊都不講，改用華語比較快',m:0,f:-16}]},
{i:7,k:'7-2-2',name:'電競間',type:'現代',body:'「這位先生！這下恁樣著，安到【時行】哦！像你兜講个——【天年各變】囉！【天年各變】囉！」「你看這下【後生人】著个衫褲還生趣哪！長長短短又【爛爛擐擐】，實在哦！俚毋好【跈毋著】時代哦！像你兜講个——【天年各變】囉！【天年各變】囉！」「狗仔毋好【揇】落屋肚，分佢在【禾埕】尞！」',obj:['爛爛擐擐','敨'],opts:[{h:'𠊎𢯭後生人尋場所',t:'支持後生人去比電競，幫他找場地',m:-16,f:14},{h:'先讀好書正講',t:'要他先把書讀好再說',m:0,f:-6},{h:'去比電競，趁著獎金',t:'去比電競拿獎金，書先囥等',m:30,f:-10}]},
{i:8,k:'7-2-3',name:'可可亞園',type:'產業',body:'故所這兜當【費工】个【生事】，分【該央時】無麼个加工經驗个農民，一度想愛放忒，無愛種。經過這恁多年个【煞猛打拚】，乜【餳】了已多後生人轉來，共下做這「烏金產業」。「原旦【話著】用可可亞豆做巧克力个方法，上網【儘採】尋斯有，佢兜用15％个【硬頸】精神，加上85％个苦澀甜，做出【餳】人个巧克力，',obj:['生事','硬頸'],opts:[{h:'𠊎摎佢兜共下種可可亞',t:'跟農民一起種可可亞，等三年才收成',m:-34,f:20},{h:'先種一垤試看啊',t:'先買一小塊試種',m:-14,f:8},{h:'摘可可亞交分工廠',t:'摘可可亞交分工廠，先趁錢',m:22,f:-2}]},
{i:9,k:'7-2-4',name:'山路日落',type:'自然',body:'若係坐火車來，做得在南勢角火車頭【下車】，無麼个人，乜無麼个【車枋】。樟腦油、香茅【茶箍】、菊花、番薯，逐項都買到【齊齊】。【蒔田笐】、牛鼻桊、【刀嫲】、钁頭柄，像歲月个獎狀，排列在壁項。𠊎駛車來，先去摎魚藤坪斷橋【相借問】，續等正去勝興車站，',obj:[],opts:[{h:'下車摎佢兜相借問',t:'停下車跟山上的人相借問，聊了半晌',m:-4,f:14},{h:'撳喇叭喊佢兜讓路',t:'按喇叭要他們讓路',m:0,f:-16},{h:'行別條路',t:'繞另一條路，避開',m:-8,f:-2}]},
{i:10,k:'7-2-5',name:'料理比賽',type:'生活',body:'佢毋單止話語毋通，連【食雜】、生活習慣摎大家都無共樣，【長透】慍慍悴悴。阿雪一看啊著同鄉，就親暱暱哦，佢兜【離鄉不離腔】，用越南話【緊打嘴鼓】，阿雪【已聰明】曉得【一踢三通】，學會煮客家菜了後，還會結合越南菜來變新花樣。因為佢个【心臼】阿雪，在社區舉辦个客家料理比賽得獎，愛上臺去領獎了。',obj:['離鄉不離腔','已聰明'],opts:[{h:'𠊎𢯭心臼準備',t:'幫心臼準備比賽的菜，忙了兩天',m:-12,f:20},{h:'𠊎在堘頭看就好',t:'只在旁邊看，說我不會煮',m:0,f:0},{h:'𢯭手辦桌，趁一日工錢',t:'𢯭忙辦桌，趁一日个工錢',m:26,f:-4}]},
{i:11,k:'7-2-6',name:'婚禮廳下',type:'文化',body:'安達：𠊎乜知，頭擺个新娘坐轎仔，討親團裡肚有【客家八音】摎【吹笛仔】，意思係講【大行大嫁】。安達：講了恁多，𠊎看著恁【豐沛个菜】，就緊流【口涎水】了。【擲】扇仔係【攉忒】舊个壞習慣，乜講新娘同外家親情毋會散忒。正言：看著人打紙炮仔，𠊎个手就癢癢，乜盡想愛【搞】！',obj:['客家八音','豐沛个菜','慶'],opts:[{h:'照舊規矩大行大嫁',t:'按老規矩辦一場大行大嫁的婚禮',m:-40,f:24},{h:'辦簡單兜仔就好',t:'辦簡單一點，人到就好',m:-14,f:6},{h:'去登記就好',t:'說儀式麻煩，直接登記',m:0,f:-14}]},
{i:12,k:'8-1-1',name:'羅隱个田',type:'文學',body:'「【上坵田】【水漣漣】；下坵田【水漣漣】。「羅隱啊，騎條馬【耳劇劇仔】，請問你，昨晡日行幾多千，幾多百，幾多十隻【腳跡】呢？」去到老阿伯个屋下，細阿妹仔同老弟【【堵】【堵】】行到大門口，羅隱分佢【堵】到【無結煞】，黏時講：',obj:[],opts:[{h:'老阿伯講个著，𠊎來學蒔田',t:'承認老阿伯講得有理，跟他學蒔田',m:-4,f:16},{h:'𠊎係才子，做麼个愛聽佢',t:'硬要頂嘴，說自己是才子',m:0,f:-14},{h:'𠊎斡頭就走',t:'轉頭就走，不想理',m:0,f:-6}]},
{i:13,k:'8-1-2',name:'鹹草文化館',type:'產業',body:'歸日【流膿流血】、【烏蠅拑烏蠅啄】，艱苦到【無安無生】，手指做到【起膘】、【結瘌】，賺著个錢【畜得起】歸家屋人呢！」品妤：「𠊎還知洪鴦女士【毋盼得】厥倈仔生【臭頭】，千慧：「【有影】當香哦！先生，這位个地名【仰般】來个啊？」',obj:['三角鹹草'],opts:[{h:'𠊎摎奉工學編三角鹹草',t:'跟導覽志工學編三角鹹草，編了一個袋子',m:-8,f:16},{h:'翕相就好，手藝傷難',t:'只拍照，說手藝太難',m:0,f:2},{h:'編鹹草袋仔去寄賣',t:'編鹹草袋仔去文化館寄賣',m:20,f:2}]},
{i:14,k:'8-1-3',name:'運動坪',type:'生活',body:'聖火會在忠義祠【點著】，愛【𫟧】【六堆】地區一輪，表現傳承保鄉衛土个精神。「該片愛【挷大索】了，【遽】【遽】來去看！」有球類同田徑賽、傳統文化个項目：【揹穀包】，來懷念【換工】互助个精神。這下係【走相逐】比賽，阿旺伯个孫仔瑞明用力搭手，跈等大聲喊。',obj:['六堆'],opts:[{h:'𠊎報名走相逐',t:'報名走相逐，跟同學一起練',m:-6,f:18},{h:'去挷大索出兜力就好',t:'只去挷大索，出點力就好',m:-2,f:8},{h:'顧攤賣涼水，趁兜錢',t:'顧攤賣涼水，趁兜錢',m:16,f:-8}]},
{i:15,k:'8-1-4',name:'阿爸个間房',type:'生活',body:'根本無時間好【欸奶】細人仔，故所，𠊎就逐日【目勾勾仔】等阿爸下班轉屋。𠊎還細个時節，吾姆一日到暗【無閒洎杈】，像【極樂仔】樣轉無停，【一路里來】，吾爸對人就盡【好性體】，尤其對𠊎兜子女；「若爸盡無用，你兜姊妹嫁忒恁久了，佢見擺打開你兜个間門，還【目汁濫泔】。」',obj:[],opts:[{h:'𠊎摎阿爸講心肚个話',t:'跟阿爸說出心裡話，兩個人和好',m:0,f:22},{h:'做無事樣，莫講',t:'裝作沒事，繼續冷戰',m:0,f:-12},{h:'𠊎徙出去戴',t:'搬出去住，眼不見為淨',m:-24,f:-16}]},
{i:16,k:'8-1-5',name:'導盲犬之家',type:'現代',body:'阿爸：「後來這個細妹仔厥爸，就【渡】佢去同客家鄉親【會失禮】，希望得【著】鄉親个原諒。」該央時票選第一名个就係講，客家人當【省儉】、【齧察】。阿爸：「【著】啊！這下網路當利便，𫣆俚【毋單淨】在網路項講話愛細義，愛思考過後正行動，【無堵好】摎村民个觀賞雞咬死了，村民要求厥爸愛賠錢。',obj:[],opts:[{h:'分導盲犬入來，摎人客解說',t:'讓導盲犬進店裡，跟客人解釋',m:-4,f:20},{h:'請佢兜坐外背',t:'請他們到外面坐，比較不麻煩',m:0,f:-14},{h:'毋做得入來',t:'直接拒絕，說會嚇到客人',m:0,f:-22}]},
{i:17,k:'8-1-6',name:'鍾鐵民故居',type:'人物',body:'當愛文學、毋會【耕種】个佢，文章寫个全係在【厥脣項】【耕種】个朋友、農村變遷个故事，惜情、寫實，用慈悲心去關心【【耕種】人】个生活同這片土地，佢知：語言斷去，文化就會【跈等】消失，較【嚴重】个甚至族群意識乜會末忒。【一生人】全戴在美濃，因為佢嶄然【重視】在地个自然生態環境，故所積極參加社會事務。',obj:[],opts:[{h:'讀煞就寫一篇心得',t:'讀完鍾鐵民的書，寫一篇心得投稿',m:-4,f:18},{h:'擛兩頁就放下',t:'翻兩頁就放下',m:0,f:0},{h:'投稿去，得著稿費',t:'抄佢个文章去投稿，得著稿費',m:20,f:6}]},
{i:18,k:'8-2-1',name:'環保講壇',type:'現代',body:'詠秀：「𠊎兜个【勸話】愛【決截】、態度愛【溫馴】，愛講著重點！」詠秀：「自家帶杯仔來裝外賣个【涼水】、早朝，【莫】用塑膠杯仔、盒仔咧！」「做【藝術】个人係一個導體，像通電恁樣，【過】去就【過】去吔，該句「你兜仰恁敢？」【顛倒】變做世界新聞。',obj:['決截','藝術'],opts:[{h:'𠊎自家先擐環保杯',t:'跟著發起校園減塑，自己先帶環保杯',m:-6,f:18},{h:'簽名支持，毋過無做',t:'簽名支持但不行動',m:0,f:2},{h:'一儕人做無效',t:'說一個人做沒有用',m:0,f:-10}]},
{i:19,k:'8-2-2',name:'安養院',type:'生活',body:'佢兜【硬鉸】个身體【放冗】，輪椅毋係【束】佢等个囹仔，日頭光偷偷仔對天窗【箭入來】，像翕相師傅个電火珠，趕過來【晟光】！【硬鉸】个手指，【毋靈活】；簡簡單單个舞步，做毋來；「阿公、阿婆，𠊎兜這陣【細不仔】又來哩喲！」',obj:[],opts:[{h:'逐禮拜去安養院𢯭手',t:'每週去安養院陪老人家做操',m:-4,f:22},{h:'去一擺交作業就好',t:'去一次交作業就好',m:0,f:4},{h:'𠊎驚看著老人家',t:'說自己怕面對老人',m:0,f:-12}]},
{i:20,k:'8-2-3',name:'廳下書架',type:'文學',body:'阿公：「無法度，頭擺先民【橫渡烏水溝】來臺，盡【衰過】呢！姿靜：「𠊎看你這幾下日都無【搞電動】，【淨看】這本書！銘均：「就係這儕！你看，佢兜擎等擔竿、【钁頭】同刀嫲相拚，𠊎看啊緊【起雞嫲皮】。」（放尞日朝晨，銘均一屋下人在【廳下】尞。）',obj:['乙未戰爭','清領時期'],opts:[{h:'先寫煞報告正去搞',t:'放假先把報告寫完，再去玩',m:-2,f:12},{h:'一片搞電動一片寫',t:'邊玩電動邊寫，兩邊都沒做好',m:0,f:-8},{h:'拖到尾日正寫',t:'報告拖到最後一天',m:0,f:-14}]},
{i:21,k:'8-2-4',name:'虎頭山',type:'自然',body:'𠊎看等面書講：「嗯，佢看起來已【伶俐】，細細个車【後斗】【準】工作臺，一轉到屋下就【興擳擳仔】點開面書，【擛手】講：車脣放等【看毋多真】个東西，【行兼】正知係賣米𥺆：面書畫往下，就看得著佢尞日會滿哪仔【箭自行車】去山頂賣咖啡。',obj:['後斗','伶俐'],opts:[{h:'𠊎爬上虎頭山看日頭出',t:'爬上虎頭山看日出，拍照傳給阿婆看',m:-8,f:14},{h:'行一半就斡轉',t:'走一半就回頭',m:-2,f:0},{h:'戴在屋下滑手機',t:'留在家裡滑手機',m:0,f:-8}]},
{i:22,k:'8-2-5',name:'名仔碑',type:'語言',body:'阿婆講：「將【妹仔】【安名】大概較簡單，無恁【麻煩】，配合【時生月日】來【安名】。像若爸安到『應來』，你安到『日麟』。頭擺有人會將【後尾】降个【妹仔】安到『滿妹』，就係希望毋好過降【妹仔】啊。放學轉到屋下，𠊎【趕緊】將【囥】在心肝裡肚个疑問提出來問：',obj:['時生月日'],opts:[{h:'𠊎教先生𠊎个名仰般唸',t:'跟老師解釋客語的名該怎麼唸，教全班一次',m:-2,f:20},{h:'喊毋著乜莫講',t:'被叫錯也不糾正',m:0,f:-8},{h:'改用華語名較省事',t:'乾脆改用華語名',m:0,f:-16}]},
{i:23,k:'8-2-6',name:'鬼月廟埕',type:'文化',body:'逐年【舊曆】七月在花蓮鳳林鎮，就有一群【毋驚】鬼个人，在北林社區【弄神弄鬼】。抑係專門偷聽人講話个【壁背鬼】？還係【好展風神】个【搶光鬼】？毋過，社區總幹事發現【餳毋著】後生人轉來，老人家【道嘆】頭擺个光景。餳來已多後生人摎遊客戴等【鬼面殼】，來社區【襯鬧熱】。',obj:[],opts:[{h:'𠊎去𢯭手擺牲儀',t:'參加鬼月的普渡，幫忙擺牲儀',m:-18,f:20},{h:'去看鬧熱就好',t:'只去看熱鬧，不出力',m:-2,f:4},{h:'去廟項𢯭手，領工錢',t:'去廟項𢯭手，領著工錢',m:16,f:0}]},
{i:24,k:'9-1-1',name:'客語商店街',type:'產業',body:'【兩儕】擇好麵包去【撿錢】。先生：【無毋著】，大家多去客語商店，用客話買東西，就做得【撍印仔】集點換獎品。放學吔，阿祥【興擳擳仔】湊阿寧共下去【撍印仔】集點。講客話毋單淨做得【撍印仔】，還會算【較便宜兜仔】哦！',obj:[],opts:[{h:'𠊎用客話同頭家交關',t:'用客話跟頭家交關，順便集點',m:-12,f:16},{h:'用華語問價數',t:'用華語問，結果沒有折扣',m:-18,f:2},{h:'在店肚做半工，學交關',t:'在店肚做半工，學交關乜趁錢',m:24,f:-2}]},
{i:25,k:'9-1-2',name:'公車詩牆',type:'文學',body:'大家越讀越有【興頭】，【相賽】上網查詢詩人个作品。希望做得餳較多个人，共下來【痛惜】、關心佢日夜【掛吊】个家鄉文化同語言。【除忒】【欽服】詩人豐富个創作靈感，還看著佢用心生活、體現生命个感動。𠊎在公車肚【影著】一首詩，',obj:['胞衣跡'],opts:[{h:'𠊎將該首詩抄下來',t:'把公車上看到的詩抄下來，自己也寫一首',m:0,f:16},{h:'看過就毋記得',t:'看過就忘',m:0,f:0},{h:'詩看毋識',t:'嫌詩看不懂',m:0,f:-8}]},
{i:26,k:'9-1-3',name:'姐婆个菜園',type:'產業',body:'姐婆：毋好看𠊎个菜園【細細垤】定定，冷天食得著个【時菜】都有，阿芳：菜頭、【包心白】、【七層塔】……哇！項項有。阿芳：故所，姐婆个菜園，有一種【講毋出】个好【風光】。逐日經過中庭，【鼻等】淡淡个清香，試著當【鬆爽】。',obj:[],opts:[{h:'𠊎留下來𢯭姐婆種菜',t:'留下來幫姐婆種菜，學會分辨時菜',m:-4,f:20},{h:'在堘頭挷兩枝七層塔',t:'只在旁邊看，摘幾根七層塔',m:0,f:6},{h:'挷時菜去街路賣',t:'挷時菜去街路賣',m:20,f:-2}]},
{i:27,k:'9-1-4',name:'剪黏工坊',type:'文化',body:'阿宏試著學這【剪黏】愛一等認真，做出來个成品正會【生活】，難怪徐先生个作品當有【價值】，這下做下變【古蹟】了。阿華講：「徐先生無【囥步】教大家，餳著𠊎想深入了解【剪黏】。」徐先生講著，該下【學師仔】个人，麼个㧡水、攪泥、【打粗胚】……項項事頭都愛做，',obj:['剪黏','囥步','直直'],opts:[{h:'𠊎拜師學剪黏',t:'拜師學剪黏，先從打粗胚做起',m:-20,f:22},{h:'買一隻轉去囥',t:'只買一個成品回家擺',m:-14,f:2},{h:'先做粗工趁錢',t:'先做粗工趁錢，手藝慢慢學',m:18,f:-6}]},
{i:28,k:'9-1-5',name:'戲曲棚',type:'文化',body:'【廟坪】鬧熱煎煎，還有看著【戲棚頂】做【三腳採茶戲】，真餳𠊎。𠊎坐在臺下【恬恬仔】欣賞客家戲曲【九腔十八調】恁豐富个音樂，感覺真享受呢。有一日，在學校公布欄【影著】戲曲學校个招生海報，佢兜還分享在學校个生活：學講客話、唱山歌、【打觔斗】、寫劇本。',obj:['九腔十八調','金金'],opts:[{h:'𠊎去戲曲學校試上課',t:'去戲曲學校試上一堂課',m:-6,f:16},{h:'在棚下看就好',t:'只在台下看表演',m:-2,f:6},{h:'在棚下賣點心，順續看戲',t:'在棚下賣點心，順續看戲',m:14,f:-2}]},
{i:29,k:'9-1-6',name:'舞場',type:'生活',body:'舞場項，自信又【大方】个阿樂牯，餳著逐儕人【眼晶晶仔】跈佢滿場𫟧。【上教】个佢，一起勢就【抓捉】著要領，乜試著比搞電動還較生趣。一輪、兩輪、三輪……，【閕出】圓圈个裙像紅色个極樂仔，【捩捩轉】，莫插別儕个【話屎仔】，笑咪咪个阿樂牯逐日【安然自在】出入學校，',obj:['話屎仔'],opts:[{h:'𠊎上台跳，分人笑乜無相干',t:'上台跳舞，就算被笑也大方跳完',m:0,f:22},{h:'𠊎囥在後背毋上台',t:'躲在後面不上台',m:0,f:-10},{h:'笑別儕跳無好',t:'笑別人跳不好',m:0,f:-18}]},
{i:30,k:'9-2-1',name:'學堂老樹',type:'自然',body:'佢【擋恬落來】笑等應：「其實，𠊎還細時，係【眾人嫌】个【刺額嫲】，長透分世大人同先生愁慮。學校圍牆脣个老樹，一溜【生到榮榮】，大家上下都【看慣慣】咧！這站仔樹葉仔嗄緊來緊黃，還起【一搭搭仔】个【烏斑】呢！麼个係樹醫生？佢會仰般治療這頭老樹呢？𠊎【愐著】已生趣呢！',obj:['刺額嫲'],opts:[{h:'𠊎去查老樹做麼个會發病',t:'查出老樹生病的原因，發起搶救',m:-10,f:20},{h:'摎大家共樣講兩句',t:'跟大家一樣抱怨，沒有行動',m:0,f:-6},{h:'將樹剁忒較安全',t:'同意把樹砍掉，說比較安全',m:-2,f:-16}]},
{i:31,k:'9-2-2',name:'灶下',type:'生活',body:'阿婆：𫣆客人當【做家】，同【食毋去】个蘿蔔仔晒做蘿蔔乾，【芥菜】【滷】做覆菜、鹹菜，留來慢慢食。教室肚，大家正【食飽晝】，同學在整理碗筷。先生：當多人因爭戰爭、天災，無飯好食嗄【枵死】。平常時，你兜斯愛珍惜食物。想看仔該兜肚飢个人，這兜倒忒个飯菜，毋係當【打爽】？',obj:[],opts:[{h:'食幾多裝幾多，莫打爽',t:'吃多少裝多少，把廚餘減到最少',m:0,f:16},{h:'裝淰再講，食毋煞就攉忒',t:'裝滿再說，吃不完倒掉',m:0,f:-12},{h:'賰菜滷起來拿去賣',t:'將賰菜滷起來拿去賣',m:14,f:4}]},
{i:32,k:'9-2-3',name:'天時觀測站',type:'自然',body:'比論講：冷天，無像頭擺冷到【激激顫】；熱天，嗄變到【熱𤐰𤐰仔】。雖然魚塭為漁民帶來【豐湧】个收入，毋過嗄造成地層【漯落去】。針對這議題，有人建議：「節能減碳對自家開始做起，減少【單淨用】一擺就【攉忒】个東西」。人類个文明帶來生活个【利便】；乜帶來了大災難。',obj:['激激顫'],opts:[{h:'𠊎開始記天時，做防災計畫',t:'開始記錄天氣，跟同學一起做防災計畫',m:-6,f:18},{h:'天時變化摎𠊎無相干',t:'覺得氣候變遷離自己很遠',m:0,f:-8},{h:'壞忒就買新个',t:'東西壞了就丟，買新的',m:-16,f:-10}]},
{i:33,k:'9-2-4',name:'客家餐廳',type:'語言',body:'阿爸：哈！【這搭仔】个「以牙還牙」，客語意思係「用厥【拳頭嫲】打厥嘴角」，妹仔：聽起來，翻譯想愛譯到好，【除忒】意思愛正確，還愛考慮融入在地語言个特色，恁樣譯出來个客語正會盡【正板】哦！頭下在【脣項】點菜个人客就同頭家講：「你猶閣有畜烏貓（【學老話】發音）哦！」係講譯者做得【熟絡】客話个諺語摎師傅話，恁樣譯出來个客語正會盡【正板】哦！',obj:['學老話','正板'],opts:[{h:'𠊎慢慢用客話同人客講菜名',t:'耐心用客話跟學老話的客人解釋菜名',m:-2,f:20},{h:'改用華語點菜較遽',t:'直接改用華語點菜',m:0,f:-4},{h:'笑人客講毋著',t:'笑客人講錯，讓他難堪',m:0,f:-18}]},
{i:34,k:'9-2-5',name:'音樂廳',type:'人物',body:'無【幾多】年，鄧先生【連續】創作出臨臨仔 百過條歌仔，分人盡【欽服】。該時節，臺灣現代流行音樂个發源地「大禾埕」，就係佢【展手路】个舞台。阿宏又講：「看著先民个生命之歌同歡欣【閼拶】。」芳美【接嘴】講：「大家共下用桐花來創作一首歌仔，同鄧先生表達尊敬。」',obj:['風神哎哎'],opts:[{h:'𠊎去聽，轉來介紹分同學',t:'去聽《四月望雨》，回來跟同學介紹鄧雨賢',m:-8,f:18},{h:'聽一條就走',t:'只聽了一首就走',m:-4,f:2},{h:'老歌無麼个好聽',t:'說老歌沒什麼好聽',m:0,f:-12}]},
{i:35,k:'9-2-6',name:'漁市場',type:'產業',body:'「來買【萋魚仔】哦！海魚仔、【海蜆仔】做下有哦！」紅燈區色目較打眼个，魚肉同【鰭菇仔】受著【汙染】个風險當大，莫買莫食正係根本！ 」阿婆講：「這【白鯧仔】恁細尾仔定定，愛千過銀？」「海產做得變出好味緒！『年年有餘』有食【有伸】！」',obj:['海蜆仔','白鯧仔','鰭菇仔'],opts:[{h:'淨買萋魚仔，賰个儆惜用',t:'挑最新鮮的萋魚仔，其餘的珍惜著用',m:-24,f:14},{h:'歸攤買轉去分鄰舍',t:'整攤買下來分給鄰居',m:-46,f:20},{h:'摎魚販𢯭手賣魚',t:'摎魚販𢯭手賣魚，趁工錢',m:26,f:-4}]},

const $=id=>document.getElementById(id);
let AC=null;
function tick(t,g,f){
  if(!AC) return;
  const o=AC.createOscillator(), gn=AC.createGain();
  o.type="triangle"; o.frequency.setValueAtTime(f,t);
  o.frequency.exponentialRampToValueAtTime(f*.45,t+.07);
  gn.gain.setValueAtTime(g,t); gn.gain.exponentialRampToValueAtTime(.0008,t+.12);
  o.connect(gn).connect(AC.destination); o.start(t); o.stop(t+.14);
}

/* ── 細聲个背景樂：五聲音階，程式生成，無用外部檔 ── */
const SCALE=[261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25];  // C D E G A C D E
const BASS=[130.81,146.83,164.81,196.00];
let musOn=false, musT=null, musGain=null, beat=0;
function pluck(f,t,g,dur){
  if(!AC) return;
  const o=AC.createOscillator(), gn=AC.createGain(), lp=AC.createBiquadFilter();
  o.type="triangle"; o.frequency.value=f;
  lp.type="lowpass"; lp.frequency.value=2300;
  gn.gain.setValueAtTime(0,t);
  gn.gain.linearRampToValueAtTime(g,t+.012);
  gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(lp).connect(gn).connect(musGain); o.start(t); o.stop(t+dur+.05);
}
function musicStep(){
  if(!musOn||!AC) return;
  const t=AC.currentTime+.03;
  const b=beat%16;
  if(b%4===0) pluck(BASS[(beat>>2)%4], t, .34, 2.2);
  if(b%2===0){
    const n=SCALE[Math.floor(Math.random()*SCALE.length)];
    pluck(n, t, .26, 1.8);
  }
  if(b===6||b===14) pluck(SCALE[Math.floor(Math.random()*4)+3], t+.22, .15, 1.4);
  beat++;
  musT=setTimeout(musicStep, 430);
}
function toggleMusic(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    if(!musGain){ musGain=AC.createGain(); musGain.gain.value=.45; musGain.connect(AC.destination); }
    musOn=!musOn;
    const b=$("mus"); if(b) b.textContent = musOn?"♪ 音樂　開":"♪ 音樂　關";
    if(musOn) musicStep(); else clearTimeout(musT);
  }catch(e){}
}
function diceSound(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    const t0=AC.currentTime;
    [0,.07,.13,.2,.29,.4,.54].forEach((d,i)=>
      tick(t0+d, .60-i*.063, 480-i*38+Math.random()*90));
  }catch(e){}
}
function stepSound(){
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    tick(AC.currentTime,.30,760); }catch(e){}
}
const TYPE={產業:"#8FA84C",文化:"#D15C50",自然:"#3E8A6E",人物:"#A78BD0",
            語言:"#4E86B8",生活:"#D9A93C",現代:"#5E8CA8",文學:"#B08050"};
const MAXYEAR=5, TOTALW=Object.keys(VOC).length;
let known=new Set(), money=190, favor=30, pos=0, step=0, year=1, audio=null, hist=[];

let incMul=1, skyNow=null, quiz={}, prize={}, lastSeason=-1;   // 天時倍率、當今天時、逐格个庄民問答

/* 棋盤格仔位置：10×10 外圈 = 36 格 */
function cell(i){
  if(i<10) return [1,i+1];                 // 頂：左→右
  if(i<19) return [i-8,10];                // 右：頂→底
  if(i<28) return [10,10-(i-18)];          // 底：右→左
  return [10-(i-27),1];                    // 左：底→頂
}
function buildBoard(){
  const b=$("board");
  [...b.querySelectorAll(".sq")].forEach(x=>x.remove());
  BOARD.forEach((s,i)=>{
    const [r,c]=cell(i);
    const d=document.createElement("div");
    d.className="sq"+(i===pos?" here":"");
    d.style.gridRow=r; d.style.gridColumn=c;
    d.dataset.i=i;
    d.innerHTML=`<div class="t" style="background:${TYPE[s.type]}">${s.type}</div>
      <b>${s.name}</b>${owned.includes(i)?'<div class="own">◆ 已有</div>':""}`;
    d.onclick=()=>open(i,true);
    b.appendChild(d);
  });
  moveToken();
}
function moveToken(){
  const [r,c]=cell(pos), b=$("board").getBoundingClientRect();
  const cw=(b.width-20-27)/10, ch=(b.height-20-27)/10;
  $("tk").style.left=(10+(c-1)*(cw+3)+cw/2-11)+"px";
  $("tk").style.top=(10+(r-1)*(ch+3)+ch/2-11)+"px";
}
function winCheck(){
  if(known.size<TOTALW || winCheck.done) return false;
  winCheck.done=true;
  const rank = year<=2?"你當𠲿力，兩年就學透咧！" : year<=3?"三年學透，庄頭个話你攏聽得識。"
             : "毋使到五年，你就學透咧。";
  $("opBody").innerHTML=`<h2>恭 喜 通 關</h2>
    <div class="en" style="color:var(--jade)">${TOTALW} 隻詞，全部學透咧</div>
    <p>${rank}</p>
    <p style="margin-top:12px">用咧 <b>${year}</b> 年　·　錢 <b>${money}</b>　人情 <b>${favor}</b>　產業 <b>${owned.length}</b> 項</p>
    <p style="margin-top:12px;color:var(--red)"><b>這下庄頭个話，你一句都毋會聽毋識。</b><br>
      逐張卡个灰格仔攏無忒咧 —— 做得慢慢仔讀轉頭看。</p>
    <div style="display:flex;gap:9px;justify-content:center;margin-top:16px">
      <button class="btn" id="wAgain">對頭再行</button>
      <button class="btn g" id="wStay" style="border:1.5px solid var(--line)">留下來行完</button></div>`;
  $("over").classList.add("on");
  $("wAgain").onclick=()=>location.reload();
  $("wStay").onclick=()=>$("over").classList.remove("on");
  log("<b>詞全部學透咧 —— 通關！</b>");
  return true;
}
function refreshCost(){ const c=cost(); const e=$("costTxt"); if(e) e.textContent=c; }
function bump(id,v,d){const e=$(id);e.textContent=v;e.classList.remove("up","dn");void e.offsetWidth;e.classList.add(d>0?"up":"dn");}
function log(h){const d=document.createElement("div");d.className="lg";d.innerHTML=h;
  $("log").prepend(d); while($("log").children.length>30) $("log").lastChild.remove();}
function play(w){try{if(audio){audio.pause();audio.src="";}audio=new Audio(VOC[w].u);audio.play().catch(()=>{});}catch(e){}}

/* 該句客語肚真正出現个生詞 */
function veil(h){
  let out=h;
  Object.keys(VOC).filter(w=>w.length>=2&&h.includes(w)&&!known.has(w))
    .sort((a,b)=>b.length-a.length)
    .forEach(w=>{ out=out.split(w).join(`<span class="kw blur" data-w="${w}">${"　".repeat(w.length)}</span>`); });
  return out;
}
function inSent(o){
  const h=o.h||"";
  const hit=Object.keys(VOC).filter(w=>w.length>=2 && h.includes(w));
  hit.sort((a,b)=>b.length-a.length);
  const out=[]; let rest=h;
  hit.forEach(w=>{ if(rest.includes(w)){ out.push(w); rest=rest.replace(w,""); } });
  return out.length?out:o.w.filter(w=>h.includes(w));
}
function mark(s,just){
  return s.replace(/【(.+?)】/g,(m,w)=>{
    if(!VOC[w]) return w;
    const k=known.has(w);
    return `<span class="kw ${k?"know":"blur"} ${just===w&&k?"just":""}" data-w="${w}"
      title="${k?VOC[w].c:"點就學（8 銀）"}">${k?w:"　".repeat(Math.max(1,w.length))}</span>`;
  });
}
/* 人情愈高，庄民愈肯教你 —— 學詞愈便宜 */
function cost(){ return favor>=75?3 : favor>=45?5 : favor>=20?8 : 13; }
/* 這張卡（含卡文、物件、選項）用著个詞 */
function cardWords(i){
  const s=BOARD[i], set=new Set();
  (s.body.match(/【(.+?)】/g)||[]).forEach(m=>{const w=m.slice(1,-1); if(VOC[w]) set.add(w);});
  s.obj.forEach(w=>{ if(VOC[w]) set.add(w); });
  s.opts.forEach(o=>Object.keys(VOC).forEach(w=>{ if(w.length>=2&&(o.h||"").includes(w)) set.add(w); }));
  return [...set];
}
function learn(w){
  if(known.has(w)){ play(w); return; }
  const c=cost();
  if(money<c){ log(`<b>錢無罅</b>，學一隻詞愛 ${c} 銀。`); return; }
  money-=c; known.add(w); bump("money",money,-1); bump("wc",known.size,1);
  const p=known.size/TOTALW*100; $("wbar").style.width=p+"%"; $("wpct").textContent=p.toFixed(0)+"%";
  play(w); log(`學著 <b>${w}</b>（${VOC[w].c}）　-${c} 銀`);
  open(pos,true,w); winCheck();
}

function open(i,peek,just){
  const s=BOARD[i];

  const objHtml=s.obj.length? `<div style="margin-top:9px;font-size:12px;color:var(--dim)">
     格上物件：${s.obj.map(w=>known.has(w)?`<b style="color:var(--jade)">${w}</b>`:`<span class="kw blur" data-w="${w}">${"　".repeat(w.length)}</span>`).join("、")}</div>`:"";
  $("mid").innerHTML=`
    <div class="mtitle"><div class="seal">${s.name[0]}</div><b>${s.name}</b>
      <small>${s.k}　${s.type}${i!==pos?"　·　淨看":""}</small></div>

    ${objHtml}
    ${prizeHtml(i)}${askHtml(i)}
    <div class="opts">${s.opts.map((o,j)=>{
      const om=o.m+4;
      const lockM=(om<0)&&(money+om<0);
      const far=(i!==pos);
      return `<div class="opt ${far?"far":""} ${lockM&&!done&&!far?"lock":""}" data-j="${j}" data-lock="${lockM?1:0}">
        <div class="tag">${chosen[i]===j?"✓":"ABC"[j]}</div>
        <div class="txt"><div class="hakline">${veil(o.h||o.t)}</div>
          <div class="zhline">${o.t}</div>
          </div>
        <div class="out">${done?`${om>=0?"+":""}${om} 銀<br>${o.f>=0?"+":""}${o.f} 人情`
          : far?"還吂行到" : "？"}</div></div>`;
    }).join("")}</div>
    <div class="after ${done?"on":""}">${done?`揀了 <b>${"ABC"[chosen[i]]}</b> —— 三條路个後果攏顯出來咧，比比看。`:""}</div>
    <div class="mbtn">
      <button class="btn" id="roll" ${peek&&!done&&i===pos?"":""}>擲骰仔</button>
      <span class="dice" id="dice">–</span>
      ${owned.includes(i)?"":s.type==="產業"?`<button class="btn g" id="buy">買落來（30 銀，逐年年頭生 32）</button>`:""}
      ${(()=>{const u=cardWords(i).filter(w=>!known.has(w));
        return u.length? `<button class="btn g" id="all" style="border-color:var(--gold);color:var(--gold)">
          一擺全部解開（${u.length} 隻 · ${u.length*cost()} 銀）</button>`:"";})()}
      ${money<8?`<button class="btn g" id="odd" style="border-color:var(--jade);color:var(--jade)">打零工（+15 銀 · 人情 -5）</button>`:""}
      <span style="font-size:11.5px;color:var(--dim);margin-left:auto">點灰格仔學詞（${cost()} 銀）</span>
    </div>`;
  $("mid").querySelectorAll("[data-w]").forEach(el=>el.onclick=e=>{e.stopPropagation();learn(el.dataset.w);});
  const gp=$("getPrize");
  if(gp&&i===pos) gp.onclick=()=>{
    prize[i].done=true; money+=14; bump("money",money,14);
    log("庄頭活動中獎　<b>+14 銀</b>"); open(i,true);
  };

  if(q&&!q.done&&i===pos) $("mid").querySelectorAll(".ag").forEach(el=>el.onclick=()=>{
    const a=el.dataset.a;
    if(a===q.w){ q.done=true; el.classList.add("ok");
      favor+=10; bump("favor",favor,10); refreshCost();
      play(q.w); log(`教 <b>${q.f.n}</b>「${q.w}」　人情 <b>+10</b>`);
      setTimeout(()=>open(i,true),700);
    }else{ el.classList.add("no");
      log(`${q.f.n} 聽無 —— 「${q.w}」毋係該个意思，佢行忒咧`);
      setTimeout(()=>{ quiz[i]=null; open(i,true); },800); }
  });
  if(!done && i===pos) $("mid").querySelectorAll(".opt").forEach(el=>el.onclick=()=>{
    if(el.dataset.lock==="1"){ log("<b>錢無罅</b>，這條路行毋得。"); return; }
    const j=+el.dataset.j, o=s.opts[j];
    const blind=(o.h||"").split("").some(()=>false) ||
      Object.keys(VOC).some(w=>w.length>=2&&(o.h||"").includes(w)&&!known.has(w));
    chosen[i]=j; const gain=o.m+4;
    money=Math.max(0,money+gain); favor=Math.max(0,favor+o.f);
    bump("money",money,o.m); bump("favor",favor,o.f); refreshCost();
    log(`${s.name}：揀 <b>${"ABC"[j]}</b>　${gain>=0?"+":""}${gain} 銀、${o.f>=0?"+":""}${o.f} 人情${blind?"　<b>（盲揀）</b>":""}`);
    open(i,true);
  });
  const bb=$("buy"); if(bb) bb.onclick=()=>{
    if(money<30){ log("<b>錢無罅</b>，買毋起。"); return; }
    money-=30; owned.push(i); bump("money",money,-1);
    log(`買著 <b>${s.name}</b>　-30 銀　（下年年頭起，逐年生 32）`);
    buildBoard(); open(i,true);
  };
  const ab=$("all"); if(ab) ab.onclick=()=>{
    const u=cardWords(i).filter(w=>!known.has(w)), c=cost(), need=u.length*c;
    if(money<need){ log(`<b>錢無罅</b>　全部解開愛 ${need} 銀`); return; }
    money-=need; u.forEach(w=>known.add(w));
    bump("money",money,-1); bump("wc",known.size,1);
    const p=known.size/TOTALW*100; $("wbar").style.width=p+"%"; $("wpct").textContent=p.toFixed(0)+"%";
    log(`一擺解開 <b>${u.length} 隻詞</b>　-${need} 銀`);
    open(i,true,u[0]); winCheck();
  };
  const ob=$("odd"); if(ob) ob.onclick=()=>{
    money+=15; favor=Math.max(0,favor-5);
    bump("money",money,1); bump("favor",favor,-1); refreshCost();
    log("去打零工　<b>+15 銀</b>、人情 -5");
    open(i,true);
  };
  $("roll").onclick=roll;
  $("roll").disabled = rolling || (chosen[pos]==null && step>0);
  buildBoard();
}

/* ── 天時：一年四季，逐九格一擺 ── */
function skyCard(cb){
  const k=SKY[Math.floor(Math.random()*SKY.length)];
  skyNow=k; incMul=k.eff.inc;
  if(k.eff.money){ money=Math.max(0,money+k.eff.money); bump("money",money,k.eff.money); }
  if(k.eff.favor){ favor+=k.eff.favor; bump("favor",favor,k.eff.favor); refreshCost(); }
  $("skc").innerHTML=`<svg viewBox="0 0 300 180">${k.art}</svg>
    <div class="skb"><div class="tag">天　時</div><h3>${k.name}</h3>
      <p>${k.zh}</p><div class="eff">${k.line}</div>
      <button class="btn" id="skOk" style="margin-top:14px">知咧</button></div>`;
  $("sky").classList.add("on");
  log(`天時：<b>${k.name}</b>　${k.line}`);
  $("skyBox").innerHTML=`<b style="color:#D9A93C;font-family:'Noto Serif TC',serif;font-size:17px">${k.name}</b><br>
    <span style="font-size:12px">${k.line}</span>`;
  $("skOk").onclick=()=>{ $("sky").classList.remove("on"); cb&&cb(); };
}

/* ── 庄民問話：考你學過个詞 ── */
function makeQuiz(i){
  const kn=[...known];
  if(kn.length<4) return null;
  const w=kn[Math.floor(Math.random()*kn.length)];
  const pool=Object.keys(VOC).filter(x=>x!==w&&VOC[x].c!==VOC[w].c);
  const wrong=[];
  while(wrong.length<2&&pool.length){
    const p=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    if(!wrong.some(y=>VOC[y].c===VOC[p].c)) wrong.push(p);
  }
  return {w, f:FOLK[Math.floor(Math.random()*FOLK.length)],
          opts:[w,...wrong].sort(()=>Math.random()-.5), done:false};
}
function prizeHtml(i){
  const p=prize[i]; if(!p) return "";
  return `<div class="ask" style="background:rgba(217,169,60,.14);border-color:rgba(217,169,60,.6)">
    <div class="askh">
      <svg viewBox="0 0 92 92" style="width:38px;height:38px">
        <circle cx="46" cy="46" r="44" fill="#D9A93C" opacity=".2"/>
        <path d="M22 44 h48 v34 h-48Z" fill="#D6483A"/>
        <path d="M18 32 h56 v13 h-56Z" fill="#E8604E"/>
        <path d="M42 32 h8 v46 h-8Z" fill="#FFD056"/>
        <path d="M46 32 q-16 -22 -24 -6 q-2 8 24 6Z" fill="#FFD056"/>
        <path d="M46 32 q16 -22 24 -6 q2 8 -24 6Z" fill="#FFD056"/></svg>
      <div><b>庄頭活動</b><br><small>${p.done?"你抽著獎咧！":"抽著獎品 —— 撳下去領"}</small></div>
      ${p.done?`<div class="rw" style="background:var(--gold);color:#2E2418">錢 +14</div>`:""}</div>
    ${p.done?"":`<div class="askg"><div class="ag" id="getPrize" style="border-color:var(--gold)">領獎品</div></div>`}</div>`;
}
function askHtml(i){
  const q=quiz[i]; if(!q) return "";
  return `<div class="ask">
    <div class="askh">${folkFace(q.f,38)}<div><b>${q.f.n}</b><br>
      <small>${q.done?"多謝你教𠊎":"這隻詞係麼个意思？講分𠊎聽"}</small></div>
      ${q.done?`<div class="rw">人情 +10</div>`:""}</div>
    <div class="askq" style="color:${q.f.c}">${q.w}</div>
    <div class="askg">${q.opts.map(o=>
      `<div class="ag ${q.done?(o===q.w?"ok":""):""}" data-a="${o}">${VOC[o].c}</div>`).join("")}</div></div>`;
}

function roll(){
  if(rolling) return;
  if(chosen[pos]==null && step>0){ log("先在這格做決定。"); return; }
  rolling=true; $("roll").disabled=true; diceSound();
  const n=1+Math.floor(Math.random()*6);
  const d=$("dice"); d.textContent=n; d.classList.remove("roll"); void d.offsetWidth; d.classList.add("roll");
  let left=n;
  const walk=()=>{
    pos=(pos+1)%36; step++;
    if(pos===0){ endYear(); return; }
    moveToken(); buildBoard(); stepSound();
    if(--left>0) setTimeout(walk,220);
    else {
      rolling=false;
      if(prize[pos]===undefined) prize[pos]= (Math.random()<.05) ? {done:false} : null;
      if(quiz[pos]===undefined) quiz[pos]= (!prize[pos] && known.size>=4 && Math.random()<.30) ? makeQuiz(pos) : null;
      const season=Math.floor(pos/9);
      if(season!==lastSeason){ lastSeason=season; skyCard(()=>open(pos,true)); }
      else open(pos,true);
    }
  };
  setTimeout(walk,320);
}

function endYear(){
  rolling=false;

  const e=(favor>=70&&money>=100)?["庄頭辦得起義民祭","人對外地轉來，庄頭鬧熱煎煎。你个話同你个錢，攏用在著个所在。"]
    :(favor>=70)?["庄頭當團結","逐儕都肯㧡手，總係手頭還當緊。"]
    :(money>=150)?["你發財咧","錢有咧，總係行過庄頭，無人同你打招呼。"]
    :["庄頭一年比一年冷清","無錢乜無人情。有兜話，你到今還係聽毋識。"];
  hist.push({y:year,m:money,f:favor,w:known.size,o:owned.length,e:e[0]});
  const pct=(known.size/TOTALW*100).toFixed(0);
  const fin = year>=MAXYEAR;
  if(fin){
    const grade = known.size>=TOTALW ? "話全部聽得識咧"
      : known.size>=TOTALW*.9 ? "賰無幾隻詞爾"
      : known.size>=TOTALW*.7 ? "庄頭个話，你大半聽得識"
      : known.size>=TOTALW*.45 ? "有兜話還聽毋識" : "你行過五年，話還係生份";
    $("opBody").innerHTML=`<h2>五年過忒</h2>
      <div class="en">${grade}</div>
      <p>識著 <b>${known.size}</b> / ${TOTALW} 隻詞（<b>${pct}%</b>）</p>
      <div style="margin:14px 0;text-align:left;font-size:12.5px;line-height:2">
        ${hist.map(h=>`第 ${h.y} 年　${h.e}　·　詞 ${h.w}`).join("<br>")}</div>
      <p style="color:var(--red)"><b>通關看个係詞，毋係錢。</b><br>
        錢摎人情逐年歸零，詞留一世人。</p>
      <button class="btn" id="nx" style="margin-top:16px">對頭再行</button>`;
    $("over").classList.add("on");
    $("nx").onclick=()=>location.reload();
    return;
  }
  $("opBody").innerHTML=`<h2>第 ${year} 年　過忒咧</h2>
    <div class="en">${e[0]}</div><p>${e[1]}</p>
    <p style="margin-top:14px">錢 <b>${money}</b>　人情 <b>${favor}</b>　產業 <b>${owned.length}</b> 項<br>
      識著 <b>${known.size}</b> / ${TOTALW} 隻詞（${pct}%）</p>
    <p style="margin-top:10px;color:var(--red)"><b>詞摎產業留下來，錢摎人情歸零。</b><br>
      ${owned.length?`下年年頭產業會生 <b>${owned.length*32} 銀</b>。<br>`:""}
      第 ${year+1} 年共樣个卡，你看得識較多咧。</p>
    <button class="btn" id="nx" style="margin-top:16px">行第 ${year+1} 年</button>`;
  $("over").classList.add("on");
  $("nx").onclick=()=>{
    const favor0=favor;
    year++; const inc=Math.round(owned.length*32*incMul);
    money=190+inc; favor=30; pos=0; step=0; chosen={};
    if(favor0>=75){
      const pool=Object.keys(VOC).filter(w=>!known.has(w));
      for(let g=0;g<3&&pool.length;g++){
        const w=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
        known.add(w);
      }
      bump("wc",known.size,1);
      const p=known.size/TOTALW*100; $("wbar").style.width=p+"%"; $("wpct").textContent=p.toFixed(0)+"%";
      log(`人情厚，庄民白白教你 <b>3 隻詞</b>`);
      setTimeout(winCheck,400);
    }
    if(inc) log(`第 ${year} 年頭　產業收入 <b>+${inc} 銀</b>（${owned.length} 項 × 32 × 天時 ${incMul}）`);
    else if(owned.length) log(`天時毋好，產業今年無收入。`);
    lastSeason=-1; quiz={}; prize={}; incMul=1;
    $("year").textContent=year; $("money").textContent=money; $("favor").textContent=favor;
    $("step").textContent=0; refreshCost();
    $("over").classList.remove("on"); open(0,true);
  };
}
const _b=buildBoard;
buildBoard=function(){ _b(); $("step").textContent=step%36;
  $("ownList").innerHTML=owned.length?owned.map(i=>`<span class="ow">${BOARD[i].name}</span>`).join("")
    :'<span style="font-size:12px;color:#8A9AA6">還吂有</span>'; };

addEventListener("resize",moveToken);
buildBoard(); open(0,true);
$("mus").onclick=toggleMusic;
log("第 1 年開始。<b>灰色格仔係你還吂識个詞</b>，點就學得著。");
</script>
