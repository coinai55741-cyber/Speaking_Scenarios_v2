<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>庄頭廣播電台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#10161C;--panel:#19212B;--line:#2B3743;--soft:#212C38;
    --ink:#EDE6D8;--dim:#8B9BA8;--gold:#D9AE5F;--jade:#4E8C74;--rose:#B0605C;--cyan:#5FB0C4}
  *{box-sizing:border-box;margin:0;padding:0}
  body{overflow-x:hidden;background:radial-gradient(1100px 620px at 50% -10%,#1E2B36,#0B1016 74%);
    font-family:"Noto Sans TC",system-ui,sans-serif;color:var(--ink);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px}
  .frame{width:100%;max-width:930px}
  /* 放毋著：規個畫面震一下 */
  .frame.shake{animation:quake .42s cubic-bezier(.36,.07,.19,.97)}
  @keyframes quake{
    0%,100%{transform:translate(0,0) rotate(0)}
    12%{transform:translate(-9px,3px) rotate(-.5deg)}
    26%{transform:translate(8px,-4px) rotate(.5deg)}
    42%{transform:translate(-7px,2px) rotate(-.35deg)}
    58%{transform:translate(6px,-2px) rotate(.3deg)}
    74%{transform:translate(-4px,1px) rotate(-.18deg)}
    88%{transform:translate(3px,-1px) rotate(.1deg)}}

  /* 電台面板 */
  .top{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:13px 17px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  .logo{font-family:"Noto Serif TC",serif;font-size:16px;font-weight:900;letter-spacing:.14em}
  .logo b{color:var(--gold)}
  .sig{flex:1;min-width:170px;display:flex;align-items:center;gap:9px}
  .sig span{font-size:11px;color:var(--dim);letter-spacing:.16em;white-space:nowrap}
  .sbar{flex:1;height:9px;border-radius:99px;background:#0E141A;overflow:hidden;border:1px solid var(--line)}
  .sbar i{display:block;height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,var(--rose),var(--gold),var(--jade));transition:width .7s}
  .combo{font-family:"Noto Serif TC",serif;font-size:13px;color:var(--dim);letter-spacing:.06em;white-space:nowrap}
  .combo b{color:var(--gold);font-size:17px}

  /* 波形 */
  .wave{height:46px;display:flex;align-items:center;gap:2px;justify-content:center;
    background:#0E141A;border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-bottom:12px;overflow:hidden}
  .wv{width:3px;border-radius:2px;background:var(--line);transition:background .4s,height .3s}
  .wv.on{background:var(--cyan)}
  .wv.gap{background:var(--rose);opacity:.55}
  .wave.play .wv.on{animation:jig .5s infinite}
  @keyframes jig{50%{transform:scaleY(.55)}}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:17px 18px 14px}
  .meta{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .who{background:rgba(217,174,95,.14);border:1px solid rgba(217,174,95,.36);border-radius:999px;
    padding:4px 13px;font-size:12.5px;color:var(--gold)}
  .word{font-family:"Noto Serif TC",serif;font-size:16px;font-weight:900;letter-spacing:.05em}
  .word small{font-family:"Noto Sans TC";font-size:11.5px;font-weight:400;color:var(--dim);margin-left:6px}
  .spk{margin-left:auto;background:var(--gold);color:#12191F;border:0;border-radius:999px;
    padding:9px 20px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:"Noto Sans TC"}
  .spk:hover{filter:brightness(1.1)}

  .line{display:flex;flex-wrap:wrap;gap:3px 2px;justify-content:center;padding:4px 0}
  .u{min-width:34px;text-align:center;padding:3px 2px;border-radius:8px;transition:background .25s}
  .u .h{font-family:"Noto Serif TC",serif;font-size:22px;font-weight:600;line-height:1.5}
  .u .p{font-size:11px;color:var(--dim);line-height:1.6;white-space:nowrap}
  .u.tgt .h{color:var(--gold);font-weight:900}
  .slot{display:inline-block;min-width:50px;height:21px;line-height:21px;margin-top:2px;
    border-bottom:2px dashed var(--rose);background:rgba(176,96,92,.14);border-radius:5px;
    font-size:11.5px;color:var(--gold);transition:.2s}
  .slot.hot{background:rgba(217,174,95,.34);border-color:var(--gold)}
  .slot.done{border-bottom:2px solid var(--jade);background:rgba(78,140,116,.26);color:var(--ink)}
  .slot.bad{animation:flash .7s}
  @keyframes flash{0%,100%{background:rgba(176,96,92,.14);border-color:var(--rose)}
    30%,70%{background:rgba(200,80,74,.55);border-color:#E07A72}}

  /* 答著了後浮出來个景 */
  .scene{margin-top:14px;border-radius:14px;overflow:hidden;max-height:0;opacity:0;
    transition:max-height .7s cubic-bezier(.2,.7,.3,1),opacity .6s;border:1px solid transparent}
  .scene.on{max-height:290px;opacity:1;border-color:var(--line)}
  .scene svg{display:block;width:100%;height:auto}
  .tray{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .syl{border:1.5px solid var(--line);background:var(--soft);color:var(--ink);border-radius:10px;
    padding:9px 15px;cursor:grab;font-size:15px;transition:.16s;touch-action:none}
  .syl:hover{transform:translateY(-4px);border-color:var(--gold)}
  .syl.hold{opacity:.28}
  .syl.used{display:none}

  #gt{position:fixed;z-index:99;pointer-events:none;opacity:0;background:var(--gold);color:#12191F;
    border-radius:10px;padding:9px 15px;font-size:15px;font-weight:700;
    box-shadow:0 12px 26px rgba(0,0,0,.55);transform:translate(-50%,-50%) scale(1.05)}
  #gt.on{opacity:1}

  .bar{margin-top:13px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .t{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:11px;
    padding:9px 16px;font-size:13.5px;cursor:pointer;font-family:"Noto Sans TC";transition:.18s}
  .t:hover{border-color:var(--gold)}
  .t:disabled{opacity:.3;cursor:default}
  .t.go{background:var(--gold);color:#12191F;border-color:var(--gold);font-weight:700}
  .t.rec{border-color:var(--rose);color:var(--rose)}
  .t.rec.on{background:var(--rose);color:#fff;animation:pulse 1.1s infinite}
  @keyframes pulse{50%{opacity:.6}}
  .note{font-size:12.5px;color:var(--dim);margin-left:auto;max-width:430px;text-align:right;line-height:1.55}
  .note b{color:var(--gold)}
  /* ── 過關 ── */
  .over{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(700px 460px at 50% 42%,rgba(217,174,95,.16),rgba(8,12,16,.94) 68%);
    opacity:0;pointer-events:none;transition:opacity .8s}
  .over.on{opacity:1;pointer-events:auto}
  .panel{position:relative;text-align:center;padding:38px 46px;max-width:620px;
    background:rgba(25,33,43,.86);border:1px solid rgba(217,174,95,.34);border-radius:24px;
    box-shadow:0 30px 90px rgba(0,0,0,.7);transform:translateY(26px) scale(.94);
    transition:transform .8s cubic-bezier(.2,.9,.3,1.1)}
  .over.on .panel{transform:none}
  .tower{margin:0 auto 16px;width:112px;height:112px}
  .tower .ring{transform-origin:56px 56px}
  .over.on .tower .r1{animation:ring 2.4s ease-out infinite}
  .over.on .tower .r2{animation:ring 2.4s ease-out .8s infinite}
  .over.on .tower .r3{animation:ring 2.4s ease-out 1.6s infinite}
  @keyframes ring{0%{transform:scale(.35);opacity:.9}100%{transform:scale(1.5);opacity:0}}
  .over h2{font-family:"Noto Serif TC",serif;font-size:29px;font-weight:900;letter-spacing:.14em;color:var(--gold)}
  .over .sub{margin-top:9px;font-size:14px;color:var(--dim);line-height:1.8}
  .stats{margin:22px 0 6px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .st{background:rgba(237,230,216,.05);border:1px solid var(--line);border-radius:14px;padding:12px 20px;min-width:104px}
  .st b{display:block;font-family:"Noto Serif TC",serif;font-size:25px;font-weight:900;color:var(--ink)}
  .st span{font-size:11px;color:var(--dim);letter-spacing:.14em}
  .st.gold b{color:var(--gold)}
  .overbtn{margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  /* 紙碎 */
  .conf{position:fixed;inset:0;z-index:199;pointer-events:none;overflow:hidden}
  .cf{position:absolute;top:-24px;width:9px;height:15px;border-radius:2px;opacity:0}
  .conf.on .cf{animation:fall linear forwards}
  @keyframes fall{0%{opacity:0;transform:translateY(-30px) rotate(0)}
    8%{opacity:1}100%{opacity:.1;transform:translateY(105vh) rotate(760deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}

  .back-link{position:fixed;left:18px;top:18px;z-index:50;display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 16px;border:2px solid #2f946f;border-radius:999px;color:#2f946f;background:rgba(255,255,255,.92);font-weight:900;text-decoration:none;box-shadow:0 8px 18px rgba(0,0,0,.12)}
  .back-link:hover{background:#2f946f;color:#fff}
  @media(max-width:560px){.back-link{left:12px;top:12px;min-height:34px;padding:0 13px;font-size:13px}}
</style>
</head>

  </div>
</div></div>

const $=id=>document.getElementById(id);
function quake(){
  const f=document.querySelector(".frame");
  f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake");
  setTimeout(()=>f.classList.remove("shake"),460);
}
const lineEl=$("line"), tray=$("tray"), gt=$("gt"), waveEl=$("wave");
let i=0, audio=null, drag=null, done={}, myUrl=null, rec=null, chunks=[];
let sig=0, combo=0, fixed=0, clean=true, best=0, cleanN=0;

/* 波形 */
function wave(n, gaps){
  waveEl.innerHTML="";
  for(let k=0;k<n;k++){
    const b=document.createElement("div");
    b.className="wv"+(gaps.includes(k)?" gap":" on");
    b.style.height=(10+Math.abs(Math.sin(k*1.7))*28).toFixed(0)+"px";
    b.dataset.k=k;
    waveEl.appendChild(b);
  }
}
function waveFix(k){
  const b=waveEl.querySelector(`.wv[data-k="${k}"]`);
  if(b){ b.classList.remove("gap"); b.classList.add("on"); }
}

function build(){
  const q=Q[i], s=S[q.si];
  done={}; clean=true;
  $("who").textContent=s.role;
  $("word").innerHTML=`${q.w}<small>${q.c}</small>`;
  $("scene").classList.remove("on");
  lineEl.innerHTML="";
  s.ch.forEach((c,k)=>{
    const isT=q.span.includes(k);
    const d=document.createElement("div");
    d.className="u"+(isT?" tgt":""); d.dataset.k=k;
    d.innerHTML=`<div class="h">${c}</div>`+
      (isT?`<div class="slot" data-k="${k}"></div>`:`<div class="p">${s.sy[k]}</div>`);
    lineEl.appendChild(d);
  });
  wave(s.ch.length, q.span);
  /* 有兜句仔會用著兩隻共樣个音節（例：腳跛跛 baiˊ baiˊ），
     所以正解愛照佢出現幾擺就發幾塊，毋做得去重 */
  const need={};
  q.span.forEach(k=>{ const cor=s.sy[k]; need[cor]=(need[cor]||0)+1; });
  const all=[]; q.opts.forEach(o=>o.o.forEach(x=>all.push(x)));
  const tiles=[];
  [...new Set(all)].forEach(y=>{ const n=need[y]||1; for(let z=0;z<n;z++) tiles.push(y); });
  tiles.sort(()=>Math.random()-.5);
  tray.innerHTML="";
  tiles.forEach(y=>{
    const b=document.createElement("button");
    b.className="syl"; b.dataset.s=y; b.textContent=y;
    b.addEventListener("pointerdown",e=>{
      e.preventDefault(); drag={s:y,btn:b};
      b.classList.add("hold"); gt.textContent=y; gt.classList.add("on");
      mv(e.clientX,e.clientY); b.setPointerCapture?.(e.pointerId);
    });
    tray.appendChild(b);
  });
  $("bNext").disabled=true; $("bRec").disabled=true; $("bMine").disabled=true; $("bAns").disabled=false;
  myUrl=null;
  $("note").textContent="訊號分雜音蓋忒咧 —— 聽錄音，將無去个音節補轉來。";
  setTimeout(()=>play(S[q.si].u),400);
}
const mv=(x,y)=>{gt.style.left=x+"px";gt.style.top=y+"px";};
function stopKara(){ waveEl.classList.remove("play"); }
function play(u){
  stopKara();
  if(audio){ audio.pause(); audio.onended=null; }
  audio=new Audio(u);
  audio.onended=stopKara;
  audio.onpause=()=>{ if(audio && audio.ended) stopKara(); };
  audio.play().catch(()=>{});
  waveEl.classList.add("play");
}

const slots=()=>[...document.querySelectorAll("#line .slot:not(.done)")];
function slotAt(x,y){
  return slots().find(s=>{const r=s.getBoundingClientRect();
    return x>=r.left-8&&x<=r.right+8&&y>=r.top-8&&y<=r.bottom+8;});
}
window.addEventListener("pointermove",e=>{
  if(!drag) return; mv(e.clientX,e.clientY);
  const s=slotAt(e.clientX,e.clientY);
  slots().forEach(x=>x.classList.toggle("hot",x===s));
});
window.addEventListener("pointerup",e=>{
  if(!drag) return;
  const {s:syl,btn}=drag, g=slotAt(e.clientX,e.clientY);
  btn.classList.remove("hold"); gt.classList.remove("on");
  slots().forEach(x=>x.classList.remove("hot"));
  drag=null;
  if(!g) return;
  const q=Q[i], sen=S[q.si], k=+g.dataset.k;
  if(sen.sy[k]===syl){
    g.textContent=syl; g.classList.add("done"); done[k]=1;
    btn.classList.add("used"); waveFix(k);
    if(Object.keys(done).length===q.span.length) finish();
  }else{
    clean=false; combo=0; $("combo").textContent=0;
    g.classList.add("bad"); setTimeout(()=>g.classList.remove("bad"),720);
    quake();
    const cor=sen.sy[k], strip=x=>x.replace(/[ˊˇˋ+]/g,"");
    $("note").innerHTML = strip(cor)===strip(syl)
      ? "音對咧，<b>聲調毋著</b> —— 聽聽看這隻音真正在㖠位。"
      : "毋係這隻音 —— 聽聽看佢真正在㖠位。";
  }
});

function showScene(si){
  const box=$("scene"), svg=$("sceneSvg");
  if(!SCENE[si]){ box.classList.remove("on"); return; }
  svg.innerHTML=SCENE[si];
  box.classList.add("on");
}
function finish(){
  const q=Q[i];
  fixed++; $("fix").textContent=fixed;
  if(clean){ combo++; cleanN++; sig=Math.min(100,sig+12); if(combo>best) best=combo; }
  else { combo=0; sig=Math.min(100,sig+7); }
  $("combo").textContent=combo;
  $("sig").style.width=sig+"%";
  $("bNext").disabled = i>=Q.length-1;
  $("bRec").disabled=false; $("bAns").disabled=true;
  showScene(q.si);
  const cheer = combo>=3 ? `連紲 ${combo} 段一擺就著！訊號當強。`
              : clean ? "一擺就著 —— 這段修好咧，播出去！"
              : "修好咧，播出去！";
  $("note").innerHTML=`<b>${cheer}</b> 照拼音自家唸一擺看啊。`;
  setTimeout(()=>play(S[q.si].u),320);
  if(fixed===Q.length) setTimeout(showOver,2400);
}

$("spk").onclick=()=>play(S[Q[i].si].u);
$("bAns").onclick=()=>{
  const q=Q[i], s=S[q.si];
  clean=false;
  q.span.forEach(k=>{
    const g=document.querySelector(`#line .slot[data-k="${k}"]`);
    if(g&&!g.classList.contains("done")){ g.textContent=s.sy[k]; g.classList.add("done"); done[k]=1; waveFix(k); }
    const b=[...tray.children].find(x=>x.dataset.s===s.sy[k]&&!x.classList.contains("used"));
    if(b) b.classList.add("used");
  });
  finish();
};
$("bNext").onclick=()=>{ if(i<Q.length-1){ i++; build(); } };

$("bRec").onclick=async()=>{
  const btn=$("bRec");
  if(rec&&rec.state==="recording"){ rec.stop(); return; }
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    rec=new MediaRecorder(st); chunks=[];
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{
      st.getTracks().forEach(t=>t.stop());
      myUrl=URL.createObjectURL(new Blob(chunks,{type:"audio/webm"}));
      btn.classList.remove("on"); btn.textContent="● 再唸一擺";
      $("bMine").disabled=false;
      $("note").textContent="唸好咧 —— 撳「聽自家个」比比看。無人打分數。";
    };
    rec.start(); btn.classList.add("on"); btn.textContent="■ 停止";
    $("note").textContent="錄音中⋯⋯照拼音唸，撳「停止」結束。";
  }catch(e){
    $("note").textContent="麥克風用毋得 —— 毋唸乜做得繼續。"; btn.disabled=true;
  }
};
$("bMine").onclick=()=>{ if(!myUrl) return; if(audio) audio.pause();
  audio=new Audio(myUrl); audio.play().catch(()=>{}); };


/* ── 過關 ── */
function confetti(){
  const box=$("conf"); box.innerHTML="";
  const cols=["#D9AE5F","#4E8C74","#B0605C","#5FB0C4","#EDE6D8"];
  for(let k=0;k<90;k++){
    const d=document.createElement("div");
    d.className="cf";
    d.style.left=(Math.random()*100)+"%";
    d.style.background=cols[k%cols.length];
    d.style.animationDuration=(2.6+Math.random()*2.4)+"s";
    d.style.animationDelay=(Math.random()*1.6)+"s";
    d.style.width=(6+Math.random()*7)+"px";
    d.style.height=(11+Math.random()*10)+"px";
    box.appendChild(d);
  }
  box.classList.add("on");
  setTimeout(()=>box.classList.remove("on"),7000);
}
function showOver(){
  $("oSig").textContent=sig+"%";
  $("oClean").textContent=cleanN+" / "+Q.length;
  $("oBest").textContent=best;
  $("overSub").innerHTML = cleanN===Q.length
    ? "十段全部一擺就著 —— 你个耳公當利！<br>今晡日个廣播，庄頭全部聽得著咧。"
    : `十段錄音全部修好，庄頭聽得著今晡日个廣播咧。<br>賰 ${Q.length-cleanN} 段愛聽兩擺以上，下擺再試看啊。`;
  $("over").classList.add("on");
  confetti();
}
$("oAgain").onclick=()=>{
  $("over").classList.remove("on");
  i=0; sig=0; combo=0; fixed=0; best=0; cleanN=0;
  $("sig").style.width="0%"; $("combo").textContent="0"; $("fix").textContent="0";
  build();
};
$("oPlay").onclick=async()=>{
  const btn=$("oPlay"); btn.disabled=true; btn.textContent="播送中⋯⋯";
  for(const q of Q){
    await new Promise(res=>{
      const a=new Audio(S[q.si].u);
      a.onended=res; a.onerror=res; a.play().catch(res);
      audio=a;
    });
    await new Promise(r=>setTimeout(r,320));
  }
  btn.disabled=false; btn.textContent="▶ 再播一擺";
};

build();
</script>
