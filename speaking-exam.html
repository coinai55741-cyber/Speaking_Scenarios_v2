<style>
  :root{
    --paper: #F6F1E4; --paper-deep: #EFE7D4; --ink: #2A2420; --ink-soft: #6B5F52;
    --indigo-1: #C9D6E3; --indigo-3: #5A7CA6; --indigo-4: #33517A; --indigo-5: #16273F;
    --clay: #A8462F; --clay-soft: #F1DDD3; --moss: #4C6B4F; --moss-soft: #DCE6D4; --gold: #B98A2E;
  }
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Noto Sans TC', sans-serif; }
  .font-display{ font-family:'Noto Serif TC', serif; }
  .card{ background:#fff; border:1px solid var(--paper-deep); border-radius:16px; box-shadow:0 10px 30px -18px rgba(22,39,63,.35); }
  .btn-primary{ background:var(--indigo-4); color:#fff; transition:all .15s ease; }
  .btn-primary:hover{ background:var(--indigo-5); }
  .btn-primary:disabled{ background:#B9B2A4; cursor:not-allowed; }
  .btn-ghost{ background:transparent; border:1.5px solid var(--indigo-3); color:var(--indigo-5); transition:all .15s ease; }
  .btn-ghost:hover{ background:#EEF2F7; }
  .record-btn{ background:var(--clay); box-shadow:0 8px 20px -8px rgba(168,70,47,.6); transition:all .15s ease; }
  .record-btn:hover{ background:#8f3b26; }
  .record-btn.recording{ animation:recordPulse 1.1s ease-in-out infinite; }
  @keyframes recordPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(168,70,47,.55);} 50%{ box-shadow:0 0 0 14px rgba(168,70,47,0);} }
  .spinner{ width:15px; height:15px; border-radius:50%; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; animation:spin .7s linear infinite; display:inline-block; }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .fade-in{ animation:fadeIn .35s ease both; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .play-btn{ background:var(--indigo-5); color:#fff; transition:all .15s ease; }
  .play-btn:hover{ background:var(--indigo-4); }
  .play-btn:active{ transform:scale(.96); }
  .wave{ display:inline-flex; align-items:flex-end; gap:2px; height:14px; }
  .wave span{ width:2.5px; background:currentColor; border-radius:2px; height:4px; opacity:.5; }
  .wave.playing span{ animation:waveBar .6s ease-in-out infinite; opacity:1; }
  .wave.playing span:nth-child(1){ animation-delay:0s; }
  .wave.playing span:nth-child(2){ animation-delay:.12s; }
  .wave.playing span:nth-child(3){ animation-delay:.24s; }
  .wave.playing span:nth-child(4){ animation-delay:.36s; }
  @keyframes waveBar{ 0%,100%{ height:4px; } 50%{ height:14px; } }

  /* 倒數進度條動態樣式 */
  .countdown-bar-wrap { height: 7px; background: #e5e7eb; border-radius: 9999px; overflow: hidden; }
  .countdown-bar-fill { height: 100%; transition: width 1s linear; }
  .pulse-text { animation: pulseSlow 1.5s ease-in-out infinite; }
  @keyframes pulseSlow { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
  .img-zoomable { cursor: zoom-in; transition: transform .2s ease; }
  .img-zoomable:hover { transform: scale(1.02); }
</style>
</head>

// ==================== Web Audio 考場音效合成器 ====================
const ExamSoundFX = {
  ctx: null,
  getCtx() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
    return this.ctx;
  },
  // 清脆「叮一聲」(Chime) - 考場開始作答/朗讀提示
  chime() {
    try {
      const ctx = this.getCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      // 主頻 (D6 約 1175Hz)
      const osc1 = ctx.createOscillator();
      const gain1 = ctx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(1174.66, now);
      osc1.frequency.exponentialRampToValueAtTime(880, now + 0.85);
      gain1.gain.setValueAtTime(0.45, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
      osc1.connect(gain1);
      gain1.connect(ctx.destination);
      osc1.start(now);
      osc1.stop(now + 0.95);

      // 高八度泛音 (D7 2349Hz) 增加清脆金屬質感
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(2349.32, now);
      gain2.gain.setValueAtTime(0.2, now);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.start(now);
      osc2.stop(now + 0.6);
    } catch(e) {
      console.warn('播放叮聲音效失敗:', e);
    }
  },
  // 考場結束「鈴鈴聲」(Bell)
  bell(count = 1) {
    try {
      const ctx = this.getCtx();
      if (!ctx) return;
      for (let i = 0; i < count; i++) {
        const offset = i * 0.3;
        const now = ctx.currentTime + offset;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.setValueAtTime(987.77, now + 0.08);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      }
    } catch(e) {
      console.warn('播放鈴聲音效失敗:', e);
    }
  }
};

let mediaStream = null;

let recordingStatus = 'idle'; // idle | recording | processing | recorded | error | unsupported
let micErrorMsg = null;
let recordSeconds = 0;
let recordTimerHandle = null;

function mediaSupported(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
}
function micStreamIsLive(){
  if (!mediaStream) return false;
  const tracks = mediaStream.getAudioTracks();
  return tracks.length > 0 && tracks[0].readyState === 'live';
}
function releaseMicStream(){
  if (mediaStream){
    try{ mediaStream.getTracks().forEach(t => t.stop()); }catch(e){}
    mediaStream = null;
  }
}
function resetRecording(){
  if (mediaRecorder && mediaRecorder.state === 'recording'){
    try{ mediaRecorder.stop(); }catch(e){}
  }
  if (recordTimerHandle){ clearInterval(recordTimerHandle); recordTimerHandle = null; }
  clearPrepTimer();
  clearRecordLimitTimer();
  if (recordedBlobUrl){ try{ URL.revokeObjectURL(recordedBlobUrl); }catch(e){} recordedBlobUrl = null; }
  recordedChunks = []; recordedWavBlob = null;
  recordingStatus = 'idle'; micErrorMsg = null; recordSeconds = 0;
}

function clearPrepTimer(){
  if (prepTimerHandle){ clearInterval(prepTimerHandle); prepTimerHandle = null; }
}
function clearRecordLimitTimer(){
  if (recordLimitTimerHandle){ clearInterval(recordLimitTimerHandle); recordLimitTimerHandle = null; }
}

function toggleExamMode(checked){
  state.isExamMode = checked;
  // 若在答題畫面切換模式，重新啟動本題
  if (state.screen === 'question'){
    enterQuestion(state.pos);
  }
}

function beginRecordingWithStream(stream){
  recordedChunks = [];
  try{
    let options = {};
    if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) options = { mimeType:'audio/webm;codecs=opus' };
    else if (MediaRecorder.isTypeSupported('audio/webm')) options = { mimeType:'audio/webm' };
    else if (MediaRecorder.isTypeSupported('audio/mp4')) options = { mimeType:'audio/mp4' };
    mediaRecorder = new MediaRecorder(stream, options);
  }catch(e){
    micErrorMsg = '無法建立錄音器：' + (e && e.message ? e.message : String(e));
    recordingStatus = 'error';
    state.stage = 'recorded';
    render();
    return;
  }

  mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = async () => {
    if (recordTimerHandle){ clearInterval(recordTimerHandle); recordTimerHandle = null; }
    clearRecordLimitTimer();
    recordingStatus = 'processing';
    state.stage = 'recorded';
    render();
    try{
      const rawBlob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      recordedBlobUrl = URL.createObjectURL(rawBlob);
      recordedWavBlob = await convertBlobTo16kMonoWav(rawBlob);
      recordingStatus = 'recorded';
    }catch(err){
      console.warn('轉檔失敗：', err);
      micErrorMsg = '音檔轉檔失敗：' + (err && err.message ? err.message : String(err));
      recordingStatus = 'error';
    }
    render();
  };

  mediaRecorder.start(250);
  recordingStatus = 'recording';
  state.stage = 'recording';
  recordSeconds = 0;
  recordTimerHandle = setInterval(() => {
    recordSeconds += 1;
    updateTimerText();
  }, 1000);

  // 若設定了作答時間上限，啟動作答倒數
  const q = examQuestions[state.pos];
  if (state.isExamMode && q && q.recordLimitSeconds > 0){
    state.recordLimitTotalSeconds = q.recordLimitSeconds;
    state.recordLimitSecondsLeft = q.recordLimitSeconds;
    clearRecordLimitTimer();
    recordLimitTimerHandle = setInterval(() => {
      state.recordLimitSecondsLeft -= 1;
      updateRecordLimitUi();
      if (state.recordLimitSecondsLeft <= 0){
        clearRecordLimitTimer();
        // 時間到：響鈴並自動停止錄音
        ExamSoundFX.bell(1);
        stopRecording();
      }
    }, 1000);
  }

  render();
}

function startRecording(){
  if (!mediaSupported()){ recordingStatus = 'unsupported'; render(); return; }
  if (micStreamIsLive()){ beginRecordingWithStream(mediaStream); return; }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    mediaStream = stream;
    beginRecordingWithStream(stream);
  }).catch(err => {
    micErrorMsg = (err && err.message) ? err.message : '無法取得麥克風權限';
    recordingStatus = 'error';
    state.stage = 'recorded';
    render();
  });
}

function stopRecording(){
  if (mediaRecorder && mediaRecorder.state === 'recording'){
    mediaRecorder.stop();
  }
}

  }
  inputEl.value = '';
  render();
}

// ==================== WAV 轉檔 ====================
function encodeWav16kMono(audioBuffer){
  const channelData = audioBuffer.getChannelData(0);
  const numSamples = channelData.length;
  const sampleRate = audioBuffer.sampleRate;
  const bytesPerSample = 2, blockAlign = bytesPerSample, byteRate = sampleRate * blockAlign;
  const dataSize = numSamples * bytesPerSample;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);
  function writeString(o, s){ for (let i=0;i<s.length;i++) view.setUint8(o+i, s.charCodeAt(i)); }
  writeString(0,'RIFF'); view.setUint32(4, 36+dataSize, true); writeString(8,'WAVE');
  writeString(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,1,true);
  view.setUint32(24,sampleRate,true); view.setUint32(28,byteRate,true); view.setUint16(32,blockAlign,true); view.setUint16(34,16,true);
  writeString(36,'data'); view.setUint32(40,dataSize,true);
  let offset=44;
  for (let i=0;i<numSamples;i++, offset+=2){
    const s = Math.max(-1, Math.min(1, channelData[i]));
    view.setInt16(offset, s<0 ? s*0x8000 : s*0x7FFF, true);
  }
  return new Blob([buffer], { type:'audio/wav' });
}

async function convertBlobTo16kMonoWav(blob){
  const arrayBuffer = await blob.arrayBuffer();
  const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
  let decoded;
  try{ decoded = await tempCtx.decodeAudioData(arrayBuffer); } finally { try{ tempCtx.close(); }catch(e){} }
  const targetRate = 16000;
  const offlineCtx = new OfflineAudioContext(1, Math.ceil(decoded.duration * targetRate), targetRate);
  const src = offlineCtx.createBufferSource();
  src.buffer = decoded;
  src.connect(offlineCtx.destination);
  src.start(0);
  const rendered = await offlineCtx.startRendering();
  return encodeWav16kMono(rendered);
}

async function callSpeechRecognizeApi(wavBlob, accent){
  try {
    const reader = new FileReader();
    const base64Promise = new Promise((resolve, reject) => {
      reader.onloadend = () => {
        const base64data = reader.result.split(',')[1];
        resolve(base64data);
      };
      reader.onerror = reject;
    });
    reader.readAsDataURL(wavBlob);
    const audioBase64 = await base64Promise;

    const accentMap = { '海陸': 'hailu', '四縣': 'sixian' };
    const res = await fetch('/api/speech/recognize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        audio: audioBase64,
        accent: accentMap[accent] || 'sixian'
      })
    });

    if (res.ok){
      const data = await res.json();
      if (data && data.text) return data.text.trim();
    }
  } catch(e) {
    console.warn('ASR 辨識未回傳或發生錯誤：', e);
  }
  return '';
}

async function callScoringApi(wavBlob, pinyin, accentId, text){
  const url = `${SCORING_API_BASE}${SCORING_API_PATH}?pinyin=${encodeURIComponent(pinyin || '')}&accentId=${encodeURIComponent(accentId || '1')}&text=${encodeURIComponent(text || '')}`;
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 58000);
  try{
    const resp = await fetch(url, { method:'POST', headers:{ 'Content-Type':'audio/wav' }, body: wavBlob, signal: controller.signal });
    clearTimeout(timeoutId);
    let body = null;
    try{ body = await resp.json(); }catch(e){}
    if (!resp.ok){ console.warn(`評分 API 失敗（HTTP ${resp.status}）：`, body); return null; }
    if (!body || typeof body.score !== 'number'){ console.warn('評分 API 回傳格式異常：', body); return null; }
    return body;
  }catch(e){
    clearTimeout(timeoutId);
    console.warn('評分 API 呼叫失敗：', e);
    return null;
  }
}

  state.screen = 'question';
  state.pos = 0;
  state.log = [];
  enterQuestion(0);
}

function enterQuestion(index){
  state.pos = index;
  resetRecording();
  const q = examQuestions[index];

  if (!state.isExamMode){
    // 自習模式：直接進入待命狀態，使用者自行按錄音
    state.stage = 'idle';
    render();
    return;
  }

  // 擬真考試模式：
  if (q.prepSeconds > 0){
    state.stage = 'prep';
    state.prepTotalSeconds = q.prepSeconds;
    state.prepSecondsLeft = q.prepSeconds;
    render();

    clearPrepTimer();
    prepTimerHandle = setInterval(() => {
      state.prepSecondsLeft -= 1;
      updatePrepUi();
      if (state.prepSecondsLeft <= 0){
        clearPrepTimer();
        triggerChimeAndStartRecord();
      }
    }, 1000);
  } else if (q.audio){
    // 複誦題型：先讓題目準備，提示使用者聽題目，播畢再叮聲錄音
    state.stage = 'prep';
    state.prepTotalSeconds = 0;
    state.prepSecondsLeft = 0;
    render();
    // 自動播放題目語音
    setTimeout(() => { playQuestionAudio(q.audio); }, 600);
  } else {
    // 無額外準備時間題目：延遲 0.8 秒後叮一聲直接開始
    state.stage = 'prep';
    render();
    setTimeout(() => {
      triggerChimeAndStartRecord();
    }, 800);
  }
}

// 觸發「叮」聲並自動開始錄音
function triggerChimeAndStartRecord(){
  clearPrepTimer();
  startRecording();
}

// 跳過準備，直接作答
function skipPrep(){
  clearPrepTimer();
  triggerChimeAndStartRecord();
}

function updatePrepUi(){
  const timerNum = document.getElementById('prep-timer-num');
  const barFill = document.getElementById('prep-bar-fill');
  if (timerNum) timerNum.textContent = state.prepSecondsLeft;
  if (barFill && state.prepTotalSeconds > 0){
    const pct = Math.max(0, Math.min(100, (state.prepSecondsLeft / state.prepTotalSeconds) * 100));
    barFill.style.width = pct + '%';
  }
}

function updateRecordLimitUi(){
  const numEl = document.getElementById('record-limit-seconds-num');
  const barEl = document.getElementById('record-limit-bar-fill');
  if (numEl) numEl.textContent = state.recordLimitSecondsLeft;
  if (barEl && state.recordLimitTotalSeconds > 0){
    const pct = Math.max(0, Math.min(100, (state.recordLimitSecondsLeft / state.recordLimitTotalSeconds) * 100));
    barEl.style.width = pct + '%';
  }
}

function updateTimerText(){
  const t = document.getElementById('record-timer-text');
  if (!t) return;
  if (state.recordLimitTotalSeconds > 0 && state.isExamMode){
    t.textContent = `作答中：已錄 ${recordSeconds} 秒／限時 ${state.recordLimitTotalSeconds} 秒（點擊可提前停止）`;
  } else {
    t.textContent = `錄音中… ${recordSeconds} 秒（點擊停止錄音）`;
  }
}

async function submitAnswer(){
  const q = examQuestions[state.pos];
  if (!recordedWavBlob) return;

  state.submitting = true;
  render();

  const accentId = (q.accent === '海陸') ? '2' : '1';
  let score = 75;
  let simulated = true;
  let scoreType = 'acoustic';
  let aiFeedback = null;
  let transcript = '';

  if (q.pinyin){
    // 固定文本題型（複誦、朗讀）：使用官方聲學發音評分 API
    scoreType = 'acoustic';
    const result = await callScoringApi(recordedWavBlob, q.pinyin, accentId, q.question);
    if (result && typeof result.score === 'number'){
      score = Math.round(result.score);
      simulated = false;
    } else {
      score = Math.round(70 + Math.random() * 25);
      simulated = true;
    }
  } else {
    // 開放式題型（看圖表達、口語表達）：串接語音辨識 ASR + Gemini AI 考官 (LLM-as-a-Judge)
    scoreType = 'llm_judge';
    // 1. 嘗試 ASR 辨識
    transcript = await callSpeechRecognizeApi(recordedWavBlob, q.accent);
    
    // 2. 呼叫 Gemini 考官
    const judgeResult = await callJudgeApi(q, transcript, recordSeconds);
    if (judgeResult){
      score = judgeResult.score;
      simulated = !judgeResult.isFromAPI;
      aiFeedback = judgeResult;
    }
  }

  state.log.push({
    level: q.level,
    type: q.type,
    question: q.question,
    target: q.target,
    score,
    simulated,
    scoreType,
    aiFeedback,
    transcript,
    seconds: recordSeconds
  });

  state.submitting = false;
  state.pos += 1;
  resetRecording();

  if (state.pos >= examQuestions.length){
    releaseMicStream();
    state.screen = 'result';
    render();
  } else {
    enterQuestion(state.pos);
  }
}

function restartExam(){
  releaseMicStream();
  resetRecording();
  state.screen = 'intro';
  state.pos = 0;
  state.log = [];
  render();
}

function openImageModal(src){
  const m = document.getElementById('imageModal');
  const img = document.getElementById('modalImg');
  if (m && img){
    img.src = src;
    m.style.display = 'flex';
  }
}
function closeImageModal(){
  const m = document.getElementById('imageModal');
  if (m) m.style.display = 'none';
}

// ==================== 畫面渲染 ====================
function esc(s){
  if (s === null || s === undefined) return '';
  return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
}
function scoreColor(score){
  if (score >= 80) return 'var(--moss)';
  if (score >= 60) return 'var(--gold)';
  return 'var(--clay)';
}


// ==================== 跳過此題邏輯 ====================
function skipCurrentQuestion(){
  clearPrepTimer();
  clearRecordLimitTimer();
  if (mediaRecorder && mediaRecorder.state === 'recording'){
    try { mediaRecorder.stop(); } catch(e){}
  }
  releaseMicStream();
  resetRecording();

  const q = examQuestions[state.pos];
  state.log.push({
    level: q.level,
    type: q.type,
    question: q.question,
    target: q.target,
    score: 0,
    simulated: false,
    scoreType: 'skipped',
    aiFeedback: null,
    transcript: '（考生選擇跳過此題）',
    seconds: 0
  });

  state.pos += 1;
  if (state.pos >= examQuestions.length){
    state.screen = 'result';
    render();
  } else {
    enterQuestion(state.pos);
  }
}

          <div class="p-3 rounded-xl border border-indigo-100 bg-indigo-50/40 text-[12px]">
            <div class="font-bold text-indigo-900 flex items-center gap-1 mb-1">
              <span>🎯</span> 切題程度
            </div>
            <p class="text-stone-600 leading-relaxed">${esc(fb.relevance)}</p>
          </div>
          <div class="p-3 rounded-xl border border-purple-100 bg-purple-50/40 text-[12px]">
            <div class="font-bold text-purple-900 flex items-center gap-1 mb-1">
              <span>🗣️</span> 客語用詞道地度
            </div>
            <p class="text-stone-600 leading-relaxed">${esc(fb.vocabulary)}</p>
          </div>
          <div class="p-3 rounded-xl border border-emerald-100 bg-emerald-50/40 text-[12px]">
            <div class="font-bold text-emerald-900 flex items-center gap-1 mb-1">
              <span>📝</span> 語法流暢度
            </div>
            <p class="text-stone-600 leading-relaxed">${esc(fb.grammar)}</p>
          </div>
        </div>

        <!-- 考官講評 -->
        <div class="mb-3 text-[12.5px] bg-amber-50/60 border border-amber-200/80 p-3 rounded-xl">
          <div class="font-bold text-amber-900 mb-1 flex items-center gap-1">
            <span>💡</span> 考官總評：
          </div>
          <p class="text-stone-700 leading-relaxed">${esc(fb.critique)}</p>
        </div>

        <!-- 道地客語示範講法 -->
        <div class="mb-3 text-[12.5px] bg-stone-50 border border-stone-200 p-3 rounded-xl">
          <div class="font-bold text-stone-700 mb-1 flex items-center gap-1">
            <span>✨</span> 考官推薦道地客語示範：
          </div>
          <p class="font-semibold" style="color:var(--indigo-5);">${esc(fb.suggestedExpression)}</p>
        </div>
      ` : (
        item.target ? `
          <div class="text-[12px] mb-3 text-stone-500 bg-stone-50 p-2.5 rounded-xl border border-stone-100">
            <span class="font-semibold text-stone-600">參考客語：</span>${esc(item.target)}
          </div>
        ` : ''
      )}

      <div class="flex items-baseline gap-2 pt-3 border-t border-stone-100">
        <span class="font-display text-3xl font-black" style="color:${scoreColor(item.score)};">${item.score}</span>
        <span class="text-[12px] text-stone-400">／100 分</span>
        <span class="text-[11px] text-stone-400 ml-auto">作答錄音：${item.seconds || '--'} 秒</span>
      </div>
    </div>`;
}

function renderResult(){
  const avg = Math.round(state.log.reduce((s,x)=>s+x.score,0) / state.log.length);
  return `
  <div class="flex-1 px-5 py-10 fade-in">
    <div class="max-w-xl mx-auto">
      <div class="text-center mb-8">
        <p class="text-sm font-semibold tracking-wide" style="color:var(--indigo-4);">模擬客語能力認證口說測驗</p>
        <h1 class="font-display text-2xl md:text-3xl font-bold mt-2">測驗結算成績</h1>
        <div class="inline-flex items-baseline gap-2 mt-4 px-6 py-2.5 rounded-2xl bg-white border border-stone-200 shadow-sm">
          <span class="text-sm font-medium text-stone-500">平均總分：</span>
          <span class="font-display text-3xl font-black" style="color:${scoreColor(avg)};">${avg}</span>
          <span class="text-xs text-stone-400">/ 100</span>
        </div>
        <p class="text-[12.5px] mt-3" style="color:var(--ink-soft);">
          共完成 ${state.log.length} 題測驗，涵蓋看圖表達、口語表達、複誦與韻文朗讀。
        </p>
      </div>

      ${state.log.map((item, idx) => renderResultItem(item, idx)).join('')}

      <div class="flex justify-center mt-8">
        <button onclick="restartExam()" class="btn-ghost rounded-full px-8 py-3 font-semibold text-[14px] shadow-xs hover:shadow">重新開始測驗</button>
      </div>
    </div>
  </div>`;
}

function render(){
  const app = document.getElementById('app');
  let html = '';
  if (state.screen === 'intro') html = renderIntro();
  else if (state.screen === 'question') html = renderQuestion();
  else if (state.screen === 'result') html = renderResult();
  app.innerHTML = html;
}

render();
</script>
</body>
</html>
