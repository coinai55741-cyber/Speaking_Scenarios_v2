// ==================== Web Audio 考場音效合成器 ====================
const ExamSoundFX = {
  ctx: null,
  getCtx() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
    return this.ctx;
  },
  // 清脆「叮一聲」(Chime) - 考場開始作答/朗讀提示
  chime() {
    try {
      const ctx = this.getCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      // 主頻 (D6 約 1175Hz)
      const osc1 = ctx.createOscillator();
      const gain1 = ctx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(1174.66, now);
      osc1.frequency.exponentialRampToValueAtTime(880, now + 0.85);
      gain1.gain.setValueAtTime(0.45, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
      osc1.connect(gain1);
      gain1.connect(ctx.destination);
      osc1.start(now);
      osc1.stop(now + 0.95);

      // 高八度泛音 (D7 2349Hz) 增加清脆金屬質感
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(2349.32, now);
      gain2.gain.setValueAtTime(0.2, now);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.start(now);
      osc2.stop(now + 0.6);
    } catch(e) {
      console.warn('播放叮聲音效失敗:', e);
    }
  },
  // 考場結束「鈴鈴聲」(Bell)
  bell(count = 1) {
    try {
      const ctx = this.getCtx();
      if (!ctx) return;
      for (let i = 0; i < count; i++) {
        const offset = i * 0.3;
        const now = ctx.currentTime + offset;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.setValueAtTime(987.77, now + 0.08);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      }
    } catch(e) {
      console.warn('播放鈴聲音效失敗:', e);
    }
  }
};

let recordingStatus = 'idle'; // idle | recording | processing | recorded | error | unsupported
let micErrorMsg = null;
let recordSeconds = 0;
let recordTimerHandle = null;

function mediaSupported(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
}
function micStreamIsLive(){
  if (!mediaStream) return false;
  const tracks = mediaStream.getAudioTracks();
  return tracks.length > 0 && tracks[0].readyState === 'live';
}
function releaseMicStream(){
  if (mediaStream){
    try{ mediaStream.getTracks().forEach(t => t.stop()); }catch(e){}
    mediaStream = null;
  }
}
function resetRecording(){
  if (mediaRecorder && mediaRecorder.state === 'recording'){
    try{ mediaRecorder.stop(); }catch(e){}
  }
  if (recordTimerHandle){ clearInterval(recordTimerHandle); recordTimerHandle = null; }
  clearPrepTimer();
  clearRecordLimitTimer();
  if (recordedBlobUrl){ try{ URL.revokeObjectURL(recordedBlobUrl); }catch(e){} recordedBlobUrl = null; }
  recordedChunks = []; recordedWavBlob = null;
  recordingStatus = 'idle'; micErrorMsg = null; recordSeconds = 0;
}

function clearPrepTimer(){
  if (prepTimerHandle){ clearInterval(prepTimerHandle); prepTimerHandle = null; }
}
function clearRecordLimitTimer(){
  if (recordLimitTimerHandle){ clearInterval(recordLimitTimerHandle); recordLimitTimerHandle = null; }
}

function toggleExamMode(checked){
  state.isExamMode = checked;
  // 若在答題畫面切換模式，重新啟動本題
  if (state.screen === 'question'){
    enterQuestion(state.pos);
  }
}

function beginRecordingWithStream(stream){
  recordedChunks = [];
  try{
    let options = {};
    if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) options = { mimeType:'audio/webm;codecs=opus' };
    else if (MediaRecorder.isTypeSupported('audio/webm')) options = { mimeType:'audio/webm' };
    else if (MediaRecorder.isTypeSupported('audio/mp4')) options = { mimeType:'audio/mp4' };
    mediaRecorder = new MediaRecorder(stream, options);
  }catch(e){
    micErrorMsg = '無法建立錄音器：' + (e && e.message ? e.message : String(e));
    recordingStatus = 'error';
    state.stage = 'recorded';
    render();
    return;
  }

  mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = async () => {
    if (recordTimerHandle){ clearInterval(recordTimerHandle); recordTimerHandle = null; }
    clearRecordLimitTimer();
    recordingStatus = 'processing';
    state.stage = 'recorded';
    render();
    try{
      const rawBlob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      recordedBlobUrl = URL.createObjectURL(rawBlob);
      recordedWavBlob = await convertBlobTo16kMonoWav(rawBlob);
      recordingStatus = 'recorded';
    }catch(err){
      console.warn('轉檔失敗：', err);
      micErrorMsg = '音檔轉檔失敗：' + (err && err.message ? err.message : String(err));
      recordingStatus = 'error';
    }
    render();
  };

  mediaRecorder.start(250);
  recordingStatus = 'recording';
  state.stage = 'recording';
  recordSeconds = 0;
  recordTimerHandle = setInterval(() => {
    recordSeconds += 1;
    updateTimerText();
  }, 1000);

  // 若設定了作答時間上限，啟動作答倒數
  const q = examQuestions[state.pos];
  if (state.isExamMode && q && q.recordLimitSeconds > 0){
    state.recordLimitTotalSeconds = q.recordLimitSeconds;
    state.recordLimitSecondsLeft = q.recordLimitSeconds;
    clearRecordLimitTimer();
    recordLimitTimerHandle = setInterval(() => {
      state.recordLimitSecondsLeft -= 1;
      updateRecordLimitUi();
      if (state.recordLimitSecondsLeft <= 0){
        clearRecordLimitTimer();
        // 時間到：響鈴並自動停止錄音
        ExamSoundFX.bell(1);
        stopRecording();
      }
    }, 1000);
  }

  render();
}

function startRecording(){
  if (!mediaSupported()){ recordingStatus = 'unsupported'; render(); return; }
  if (micStreamIsLive()){ beginRecordingWithStream(mediaStream); return; }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    mediaStream = stream;
    beginRecordingWithStream(stream);
  }).catch(err => {
    micErrorMsg = (err && err.message) ? err.message : '無法取得麥克風權限';
    recordingStatus = 'error';
    state.stage = 'recorded';
    render();
  });
}

function stopRecording(){
  if (mediaRecorder && mediaRecorder.state === 'recording'){
    mediaRecorder.stop();
  }
}

function playPreview(){
  if (!recordedBlobUrl) return;
  const a = new Audio(recordedBlobUrl);
  a.play();
}

// 播放題目語音
function playQuestionAudio(dataUri){
  const wave = document.getElementById('q_audio_wave');
  const showWave = (on) => { if (wave) wave.classList.toggle('playing', on); };
  try{
    const audio = new Audio(dataUri);
    audio.addEventListener('playing', () => showWave(true));
    audio.addEventListener('ended', () => {
      showWave(false);
      // 複誦題型播放完畢後，若處於考試模式且尚未錄音，則叮一聲後自動開啟錄音
      if (state.isExamMode && state.stage === 'prep'){
        setTimeout(() => {
          triggerChimeAndStartRecord();
        }, 500);
      }
    });
    audio.addEventListener('error', () => { showWave(false); console.warn('題目語音播放失敗'); });
    audio.play().catch(() => showWave(false));
  }catch(e){
    console.warn('題目語音播放失敗：', e);
  }
}

function retryRecording(){
  resetRecording();
  enterQuestion(state.pos);
}

async function handleFileUpload(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if (!file) return;
  if (mediaRecorder && mediaRecorder.state === 'recording'){ try{ mediaRecorder.stop(); }catch(e){} }
  resetRecording();
  recordingStatus = 'processing';
  state.stage = 'recorded';
  render();
  try{
    recordedBlobUrl = URL.createObjectURL(file);
    recordedWavBlob = await convertBlobTo16kMonoWav(file);
    recordingStatus = 'recorded';
  }catch(e){
    console.warn('上傳音檔轉換失敗：', e);
    micErrorMsg = '上傳的音檔無法解析／轉換：' + (e && e.message ? e.message : String(e));
    recordingStatus = 'error';
  }
  inputEl.value = '';
  render();
}

// ==================== WAV 轉檔 ====================
function encodeWav16kMono(audioBuffer){
  const channelData = audioBuffer.getChannelData(0);
  const numSamples = channelData.length;
  const sampleRate = audioBuffer.sampleRate;
  const bytesPerSample = 2, blockAlign = bytesPerSample, byteRate = sampleRate * blockAlign;
  const dataSize = numSamples * bytesPerSample;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);
  function writeString(o, s){ for (let i=0;i<s.length;i++) view.setUint8(o+i, s.charCodeAt(i)); }
  writeString(0,'RIFF'); view.setUint32(4, 36+dataSize, true); writeString(8,'WAVE');
  writeString(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,1,true);
  view.setUint32(24,sampleRate,true); view.setUint32(28,byteRate,true); view.setUint16(32,blockAlign,true); view.setUint16(34,16,true);
  writeString(36,'data'); view.setUint32(40,dataSize,true);
  let offset=44;
  for (let i=0;i<numSamples;i++, offset+=2){
    const s = Math.max(-1, Math.min(1, channelData[i]));
    view.setInt16(offset, s<0 ? s*0x8000 : s*0x7FFF, true);
  }
  return new Blob([buffer], { type:'audio/wav' });
}

async function convertBlobTo16kMonoWav(blob){
  const arrayBuffer = await blob.arrayBuffer();
  const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
  let decoded;
  try{ decoded = await tempCtx.decodeAudioData(arrayBuffer); } finally { try{ tempCtx.close(); }catch(e){} }
  const targetRate = 16000;
  const offlineCtx = new OfflineAudioContext(1, Math.ceil(decoded.duration * targetRate), targetRate);
  const src = offlineCtx.createBufferSource();
  src.buffer = decoded;
  src.connect(offlineCtx.destination);
  src.start(0);
  const rendered = await offlineCtx.startRendering();
  return encodeWav16kMono(rendered);
}

// ==================== ASR 語音辨識與 Gemini AI 考官 API ====================
async function callSpeechRecognizeApi(wavBlob, accent){
  try {
    const dialectMap = { '海陸': 'hailu', '四縣': 'sixian', '大埔': 'dabu', '饒平': 'raoping', '詔安': 'zhaoan' };
    const dialect = dialectMap[accent] || 'sixian';

    const formData = new FormData();
    formData.append('audio', wavBlob, 'recording.wav');
    formData.append('provider_id', 'hakka_api_hak');
    formData.append('provider', 'hakka_api');
    formData.append('language', 'hak');
    formData.append('dialect', dialect);
    formData.append('recognizer', `hakka-${dialect}`);
    formData.append('scene_id', 'speaking_exam');

    const apiUrl = getBackendApiUrl(RECOGNIZE_API_PATH);
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 35000);

    const res = await fetch(apiUrl, {
      method: 'POST',
      body: formData,
      signal: controller.signal
    });
    clearTimeout(timeoutId);

    if (res.ok){
      const data = await res.json();
      const norm = window.SPEECH_API?.normalizeResponse?.(data, {
        provider: 'hakka_api',
        dialect: dialect
      });
      if (norm && norm.text) return norm.text.trim();
      if (data && data.text) return data.text.trim();
    } else {
      console.warn(`ASR 辨識 API 回應狀態（HTTP ${res.status}）`);
    }
  } catch(e) {
    console.warn('ASR 語音辨識服務呼叫異常（將由 AI 考官或擬真評估接手）：', e.message || e);
  }
  return '';
}

async function callJudgeApi(q, transcriptText, recordDuration){
  try {
    const accentName = q.accent || '四縣';
    const systemPrompt = `你是一位客家委員會「客語能力認證」口說測驗之專業資深評審委員。
請嚴格依據客語能力認證標準，針對考生的口語作答進行專業評分與講評。
測驗腔調：${accentName}腔
題目題型：${q.type}
測驗題目：${q.question}
${q.target ? `參考指標/情境提示：${q.target}` : ''}

評分維度（滿分100分）：
1. 切題度（35%）：是否精確針對題目作答，無偏題或遺漏重點。
2. 客語詞彙道地度（35%）：是否使用自然道地的客語詞彙（如拜三、一節課、失禮、當拍謝、毋好氣等），避免直接硬譯華語。
3. 語法結構與流暢度（30%）：句型是否完整，語意連貫。

{
  "score": 85,
  "relevance": "切題度具體評語（20-40字）",
  "vocabulary": "客語詞彙運用評語（20-40字）",
  "grammar": "語法完整度評語（20-40字）",
  "critique": "考官綜合點評，指出優點與待加強之處（40-70字）",
  "suggestedExpression": "考官推薦的標準道地客語示範講法（含漢字與拼音）"
}`;

    const userPrompt = `考生作答語音轉譯文字：${transcriptText ? `「${transcriptText}」` : `（考生完成口說錄音作答，錄音時長約 ${recordDuration} 秒）`}
請進行客語口說認證評閱，並回傳評分 JSON。`;

    if (res.ok){

async function callScoringApi(wavBlob, pinyin, accentId, text){
  const url = `${getBackendApiUrl(SCORING_API_PATH)}?pinyin=${encodeURIComponent(pinyin || '')}&accentId=${encodeURIComponent(accentId || '1')}&text=${encodeURIComponent(text || '')}`;
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 58000);
  try{
    const resp = await fetch(url, { method:'POST', headers:{ 'Content-Type':'audio/wav' }, body: wavBlob, signal: controller.signal });
    clearTimeout(timeoutId);
    let body = null;
    try{ body = await resp.json(); }catch(e){}
    if (!resp.ok){ console.warn(`評分 API 失敗（HTTP ${resp.status}）：`, body); return null; }
    if (!body || typeof body.score !== 'number'){ console.warn('評分 API 回傳格式異常：', body); return null; }
    return body;
  }catch(e){
    clearTimeout(timeoutId);
    console.warn('評分 API 呼叫失敗：', e);
    return null;
  }
}

// ==================== 作答與計時排程 ====================
function startExam(){
  state.screen = 'question';
  state.pos = 0;
  state.log = [];
  enterQuestion(0);
}

function enterQuestion(index){
  state.pos = index;
  resetRecording();
  const q = examQuestions[index];

  if (!state.isExamMode){
    // 自習模式：直接進入待命狀態，使用者自行按錄音
    state.stage = 'idle';
    render();
    return;
  }

  // 擬真考試模式：
  if (q.prepSeconds > 0){
    state.stage = 'prep';
    state.prepTotalSeconds = q.prepSeconds;
    state.prepSecondsLeft = q.prepSeconds;
    render();

    clearPrepTimer();
    prepTimerHandle = setInterval(() => {
      state.prepSecondsLeft -= 1;
      updatePrepUi();
      if (state.prepSecondsLeft <= 0){
        clearPrepTimer();
        triggerChimeAndStartRecord();
      }
    }, 1000);
  } else if (q.audio){
    // 複誦題型：先讓題目準備，提示使用者聽題目，播畢再叮聲錄音
    state.stage = 'prep';
    state.prepTotalSeconds = 0;
    state.prepSecondsLeft = 0;
    render();
    // 自動播放題目語音
    setTimeout(() => { playQuestionAudio(q.audio); }, 600);
  } else {
    // 無額外準備時間題目：延遲 0.8 秒後叮一聲直接開始
    state.stage = 'prep';
    render();
    setTimeout(() => {
      triggerChimeAndStartRecord();
    }, 800);
  }
}

// 觸發「叮」聲並自動開始錄音
function triggerChimeAndStartRecord(){
  clearPrepTimer();
  startRecording();
}

// 跳過準備，直接作答
function skipPrep(){
  clearPrepTimer();
  triggerChimeAndStartRecord();
}

function updatePrepUi(){
  const timerNum = document.getElementById('prep-timer-num');
  const barFill = document.getElementById('prep-bar-fill');
  if (timerNum) timerNum.textContent = state.prepSecondsLeft;
  if (barFill && state.prepTotalSeconds > 0){
    const pct = Math.max(0, Math.min(100, (state.prepSecondsLeft / state.prepTotalSeconds) * 100));
    barFill.style.width = pct + '%';
  }
}

function updateRecordLimitUi(){
  const numEl = document.getElementById('record-limit-seconds-num');
  const barEl = document.getElementById('record-limit-bar-fill');
  if (numEl) numEl.textContent = state.recordLimitSecondsLeft;
  if (barEl && state.recordLimitTotalSeconds > 0){
    const pct = Math.max(0, Math.min(100, (state.recordLimitSecondsLeft / state.recordLimitTotalSeconds) * 100));
    barEl.style.width = pct + '%';
  }
}

function updateTimerText(){
  const t = document.getElementById('record-timer-text');
  if (!t) return;
  if (state.recordLimitTotalSeconds > 0 && state.isExamMode){
    t.textContent = `作答中：已錄 ${recordSeconds} 秒／限時 ${state.recordLimitTotalSeconds} 秒（點擊可提前停止）`;
  } else {
    t.textContent = `錄音中… ${recordSeconds} 秒（點擊停止錄音）`;
  }
}

async function submitAnswer(){
  const q = examQuestions[state.pos];
  if (!recordedWavBlob) return;

  state.submitting = true;
  render();

  const accentId = (q.accent === '海陸') ? '2' : '1';
  let score = 75;
  let simulated = true;
  let scoreType = 'acoustic';
  let aiFeedback = null;
  let transcript = '';

  if (q.pinyin){
    // 固定文本題型（複誦、朗讀）：使用官方聲學發音評分 API
    scoreType = 'acoustic';
    const result = await callScoringApi(recordedWavBlob, q.pinyin, accentId, q.question);
    if (result && typeof result.score === 'number'){
      score = Math.round(result.score);
      simulated = false;
    } else {
      score = Math.round(70 + Math.random() * 25);
      simulated = true;
    }
  } else {
    // 開放式題型（看圖表達、口語表達）：串接語音辨識 ASR + Gemini AI 考官 (LLM-as-a-Judge)
    scoreType = 'llm_judge';
    // 1. 嘗試 ASR 辨識
    transcript = await callSpeechRecognizeApi(recordedWavBlob, q.accent);
    
    // 2. 呼叫 Gemini 考官
    const judgeResult = await callJudgeApi(q, transcript, recordSeconds);
    if (judgeResult){
      score = judgeResult.score;
      simulated = !judgeResult.isFromAPI;
      aiFeedback = judgeResult;
    }
  }

  state.log.push({
    level: q.level,
    type: q.type,
    question: q.question,
    target: q.target,
    score,
    simulated,
    scoreType,
    aiFeedback,
    transcript,
    modelUsed: aiFeedback?.modelUsed || (simulated ? null : 'Claude AI'),
    seconds: recordSeconds
  });

  state.submitting = false;
  state.pos += 1;
  resetRecording();

  if (state.pos >= examQuestions.length){
    releaseMicStream();
    state.screen = 'result';
    render();
  } else {
    enterQuestion(state.pos);
  }
}

function restartExam(){
  releaseMicStream();
  resetRecording();
  state.screen = 'intro';
  state.pos = 0;
  state.log = [];
  render();
}

// ==================== 圖片燈箱 ====================
function openImageModal(src){
  const m = document.getElementById('imageModal');
  const img = document.getElementById('modalImg');
  if (m && img){
    img.src = src;
    m.style.display = 'flex';
  }
}
function closeImageModal(){
  const m = document.getElementById('imageModal');
  if (m) m.style.display = 'none';
}

// ==================== 畫面渲染 ====================
function esc(s){
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/\\n/g, '\n')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;');
}
function scoreColor(score){
  if (score >= 80) return 'var(--moss)';
  if (score >= 60) return 'var(--gold)';
  return 'var(--clay)';
}


// ==================== 跳過此題邏輯 ====================
function skipCurrentQuestion(){
  clearPrepTimer();
  clearRecordLimitTimer();
  if (mediaRecorder && mediaRecorder.state === 'recording'){
    try { mediaRecorder.stop(); } catch(e){}
  }
  releaseMicStream();
  resetRecording();

  const q = examQuestions[state.pos];
  state.log.push({
    level: q.level,
    type: q.type,
    question: q.question,
    target: q.target,
    score: 0,
    simulated: false,
    scoreType: 'skipped',
    aiFeedback: null,
    transcript: '（考生選擇跳過此題）',
    seconds: 0
  });

  state.pos += 1;
  if (state.pos >= examQuestions.length){
    state.screen = 'result';
    render();
  } else {
    enterQuestion(state.pos);
  }
}

  return `

          <span>⏱️</span> 擬真考試規則說明：

        <ul class="list-disc pl-5 space-y-2">

          <li><strong>複誦測驗</strong>：聽取客語示範語音，提醒「叮！」一聲後立即開口作答。</li>
          <li><strong>朗讀測驗</strong>：韻文準備 <strong>60 秒</strong>，朗讀 <strong>60 秒</strong>，結束時響鈴提醒。</li>
          <li>系統支援<strong>考場提示音</strong>（叮一聲開始、鈴鈴聲結束），並於作答時間結束時自動收音。</li>

      <div class="flex flex-col sm:flex-row gap-3 justify-center">
        <button onclick="startExam()" class="btn-primary rounded-full px-10 py-3.5 font-semibold text-[15px] shadow-md hover:shadow-lg">開始模擬測驗</button>
      </div>
    </div>
  </div>`;
}

function renderQuestion(){
  const q = examQuestions[state.pos];
  const total = examQuestions.length;
  const seq = state.pos + 1;
  const canSubmit = !state.submitting && recordingStatus === 'recorded';

  // 1. 準備時間 UI 區塊
  let prepBanner = '';
  if (state.stage === 'prep'){
    if (q.prepSeconds > 0){
      const pct = (state.prepSecondsLeft / state.prepTotalSeconds) * 100;
      prepBanner = `
      <div class="rounded-2xl p-5 mb-5 border border-[#e2d9c2] shadow-sm fade-in" style="background:#fcfaf5;">
        <div class="flex items-center justify-between mb-2.5">
          <div class="flex items-center gap-2">
            <span class="text-xl animate-spin">⏳</span>
            <span class="font-bold text-[14.5px]" style="color:var(--indigo-5);">考場準備時間：請審題並在心中準備</span>
          </div>
          <span class="font-display font-bold text-xl px-2.5 py-0.5 rounded-lg bg-amber-100 text-amber-900" id="prep-timer-num">${state.prepSecondsLeft}</span>
        </div>
        <div class="countdown-bar-wrap mb-3">
          <div id="prep-bar-fill" class="countdown-bar-fill" style="width:${pct}%; background:var(--gold);"></div>
        </div>
        <div class="flex items-center justify-between text-[12px] text-gray-500">
          <span>倒數歸零後將自動開始錄音作答</span>
          <button onclick="skipPrep()" class="btn-ghost rounded-full px-3.5 py-1 text-[12px] hover:bg-amber-50">跳過準備，直接開始 ➔</button>
        </div>
      </div>`;
    } else if (q.audio){
      prepBanner = `
      <div class="rounded-2xl p-4 mb-5 border border-[#d6e3ef] bg-sky-50/70 text-sky-900 flex items-center justify-between text-[13px] fade-in">
        <div class="flex items-center gap-2">
          <span>📢</span>
          <span>正在播放題目示範語音，播完後將自動開始作答…</span>
        </div>
        <button onclick="triggerChimeAndStartRecord()" class="btn-ghost text-[11.5px] px-3 py-1 rounded-full bg-white">直接作答</button>
      </div>`;
    }
  }

  // 2. 作答限時進度條
  let recordLimitBanner = '';
  if (state.stage === 'recording' && q.recordLimitSeconds > 0 && state.isExamMode){
    const pct = (state.recordLimitSecondsLeft / state.recordLimitTotalSeconds) * 100;
    recordLimitBanner = `
    <div class="mb-4">
      <div class="flex justify-between text-[12px] font-medium mb-1.5" style="color:var(--clay);">
        <span class="flex items-center gap-1.5">
          <span class="w-2.5 h-2.5 rounded-full bg-red-600 animate-ping"></span>
          作答限時倒數中
        </span>
        <span>剩餘 <strong id="record-limit-seconds-num" class="font-bold text-sm">${state.recordLimitSecondsLeft}</strong> 秒</span>
      </div>
      <div class="countdown-bar-wrap">
        <div id="record-limit-bar-fill" class="countdown-bar-fill" style="width:${pct}%; background:var(--clay);"></div>
      </div>
    </div>`;
  }

  // 3. 錄音控制區塊
  let controls = '';
  if (recordingStatus === 'unsupported'){
    controls = `<div class="rounded-xl p-4 text-center text-[13px]" style="background:var(--clay-soft); color:var(--clay);">此瀏覽器環境不支援錄音功能，請使用最新 Chrome / Edge，或改用下方「上傳音檔」。</div>`;
  } else if (recordingStatus === 'error'){
    controls = `
      <div class="rounded-xl p-4 mb-3 text-center text-[13px]" style="background:var(--clay-soft); color:var(--clay);">${esc(micErrorMsg || '錄音發生錯誤')}</div>
      <div class="flex justify-center"><button onclick="startRecording()" class="btn-ghost rounded-full px-6 py-2.5 text-[14px]">重試錄音</button></div>`;
  } else if (recordingStatus === 'recording'){
    controls = `
      <div class="flex flex-col items-center gap-3">
        ${recordLimitBanner}
        <button onclick="stopRecording()" class="record-btn recording rounded-full w-20 h-20 flex items-center justify-center cursor-pointer shadow-lg hover:opacity-90" title="點擊停止錄音">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="6" y="6" width="12" height="12" rx="2" fill="#fff"/></svg>
        </button>
        <span class="text-[13px] font-medium" id="record-timer-text" style="color:var(--clay);">
          作答錄音中… ${recordSeconds} 秒（點擊按鈕可提早結束）
        </span>
      </div>`;
  } else if (recordingStatus === 'processing'){
    controls = `
      <div class="flex flex-col items-center gap-3 py-2">
        <div class="record-btn rounded-full w-20 h-20 flex items-center justify-center" style="opacity:.6;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 3v3M12 18v3M3 12h3M18 12h3" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <span class="text-[13px]" style="color:var(--ink-soft);">音檔轉檔與收音處理中…</span>
      </div>`;
  } else if (recordingStatus === 'recorded'){
    controls = `
      <div class="flex flex-col items-center gap-4 py-2">
        <div class="flex items-center gap-2 font-semibold" style="color:var(--moss);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="text-[14px]">已完成作答錄音（長度：${recordSeconds} 秒）</span>
        </div>
        <div class="flex gap-3">
          <button onclick="playPreview()" class="btn-ghost rounded-full px-5 py-2 text-[13.5px] flex items-center gap-1.5 shadow-sm">
            <span>▶</span> 播放試聽
          </button>
          <button onclick="retryRecording()" class="btn-ghost rounded-full px-5 py-2 text-[13.5px] flex items-center gap-1.5">
            <span>↺</span> 重新作答
          </button>
        </div>
      </div>`;
  } else {
    // idle 狀態
    controls = `
      <div class="flex flex-col items-center gap-3 py-2">
        <button onclick="triggerChimeAndStartRecord()" class="record-btn rounded-full w-20 h-20 flex items-center justify-center cursor-pointer shadow-md hover:scale-105 transition-transform" title="點擊開始錄音">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z" fill="#fff"/><path d="M19 11a7 7 0 01-14 0M12 19v3" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <span class="text-[13px] font-medium" style="color:var(--ink-soft);">點擊開始錄音作答</span>
      </div>`;
  }

  // 4. 題目圖片 (看圖表達題型)
  let imageSection = '';
  if (q.image){
    imageSection = `
    <div class="mb-5 flex flex-col items-center">
      <div class="relative group cursor-pointer" onclick="openImageModal('${q.image}')">
        <img src="${q.image}" alt="題目圖片" class="img-zoomable rounded-xl border border-stone-200 max-h-72 object-contain bg-white shadow-sm p-1.5" />
        <span class="absolute bottom-2.5 right-2.5 text-[11px] bg-black/60 text-white px-2 py-0.5 rounded-full pointer-events-none">🔍 點擊放大</span>
      </div>
    </div>`;
  }

  return `
  <div class="flex-1 flex flex-col px-5 pt-6 pb-12 fade-in">
    <div class="max-w-xl w-full mx-auto flex-1 flex flex-col">
      
      <!-- 頂部資訊列 -->
      <div class="flex items-center justify-between mb-4">
        <span class="font-display text-[15px] font-bold" style="color:var(--indigo-5);">客語口說能力測驗</span>
        <span class="text-[13px] font-medium" style="color:var(--ink-soft);">第 <strong class="text-base text-stone-900">${seq}</strong> / ${total} 題 ｜「${esc(q.level)}」</span>
      </div>

      <!-- 題型徽章 -->
      <div class="flex justify-center mb-3">
        <span class="text-[12.5px] px-3.5 py-1 rounded-full font-semibold shadow-xs" style="background:var(--indigo-1); color:var(--indigo-5);">
          【${esc(q.type)}】
        </span>
      </div>

      <!-- 題型說明 -->
      ${q.rules ? `
      <div class="rounded-xl px-4 py-2.5 mb-4 text-[12.5px] leading-6 border border-stone-200/80" style="background:var(--paper-deep); color:var(--ink-soft);">
        ${esc(q.rules)}
      </div>` : ''}

      <!-- 考場準備倒數提示條 -->
      ${prepBanner}

      <!-- 題目主卡片 -->
      <div class="card rounded-2xl p-6 mb-5 border border-stone-200 shadow-sm">
        ${imageSection}

        ${q.audio ? `
        <div class="flex justify-center my-2">
          <button onclick="playQuestionAudio('${q.audio}')" class="play-btn rounded-full pl-5 pr-6 py-3 flex items-center gap-3 font-medium shadow-md">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 9v6h4l5 5V4L9 9H5z" fill="currentColor"/></svg>
            播放題目示範語音
            <span class="wave" id="q_audio_wave"><span></span><span></span><span></span><span></span></span>
          </button>
        </div>` : `
        <div class="py-1">
          <p class="font-display text-lg md:text-xl font-semibold leading-relaxed text-stone-900 text-justify" style="white-space:pre-wrap;">${esc(q.question)}</p>
        </div>`}
      </div>

      <!-- 錄音控制卡片 -->
      <div class="card rounded-2xl p-6 mb-4 border border-stone-200 shadow-sm">
        ${controls}
      </div>

      <!-- 備用音檔上傳 -->
      <div class="mb-6 text-center">
        <details class="text-[12px] text-stone-500">
          <summary class="cursor-pointer hover:text-stone-700">無法錄音？點此切換手動上傳 WAV/MP3 音檔</summary>
          <div class="mt-2.5 p-3 rounded-lg bg-stone-100/80 inline-block">
            <input type="file" accept="audio/*" onchange="handleFileUpload(this)"
              ${(recordingStatus==='recording' || recordingStatus==='processing' || state.submitting) ? 'disabled' : ''}
              class="text-[12px]" />
          </div>
        </details>
      </div>

      <!-- 送出按鈕 -->
      <div class="flex justify-center">
        <button onclick="submitAnswer()" ${canSubmit ? '' : 'disabled'} class="btn-primary rounded-full px-10 py-3.5 font-bold text-[15px] w-full max-w-xs disabled:opacity-40 flex items-center justify-center gap-2 shadow-md">
          ${state.submitting ? '<span class="spinner"></span> 評分判定中…' : (seq === total ? '完成測驗並查看總成績' : '送出並進入下一題 ➔')}
        </button>
      </div>

    
    <!-- 右下角固定跳過此題按鈕 -->
    <div class="fixed bottom-6 right-6 z-40">
      <button onclick="skipCurrentQuestion()" class="group flex items-center gap-2 px-5 py-2.5 rounded-full bg-white/95 backdrop-blur border border-stone-300 text-stone-700 shadow-md hover:bg-amber-50 hover:text-amber-900 hover:border-amber-300 hover:shadow-lg transition-all text-[13.5px] font-semibold cursor-pointer active:scale-95">
        <span>跳過此題</span>
        <span class="group-hover:translate-x-1 transition-transform">⏩</span>
      </button>
    </div>
  </div>
</div>`;
}

function renderResultItem(item, idx){

  const fb = item.aiFeedback;

  return `
    <div class="card rounded-2xl p-5 mb-4 border border-stone-200 shadow-sm bg-white">
      <div class="flex items-center justify-between mb-3 flex-wrap gap-2">

          <span class="text-[12px] font-bold px-2.5 py-0.5 rounded-md bg-stone-100 text-stone-700">第 ${idx+1} 題</span>
          <span class="text-[13px] font-semibold" style="color:var(--indigo-5);">${esc(item.level)}</span>

                ? `<span class="text-[11px] px-2.5 py-1 rounded-full bg-stone-100 text-stone-500 border border-stone-200 font-medium">⏭️ 略過未作答</span>`
                : (!item.simulated 
                    ? `<span class="inline-flex items-center gap-1 text-[11px] font-semibold px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200">
                        <span>🎙️</span> 發音聲學評量 API
                       </span>`
                    : `<span class="text-[11px] px-2.5 py-1 rounded-full bg-amber-50 text-amber-800 border border-amber-200 font-medium">擬真發音評分</span>`
                  )
              )
          }
        </div>
      </div>

      <div class="text-[13.5px] mb-2.5 font-medium leading-relaxed font-display" style="color:var(--ink); white-space:pre-wrap;">
        <span class="text-stone-400 font-normal">題目：</span>${esc(item.question)}
      </div>

      ${item.transcript ? `
        <div class="text-[12.5px] mb-3 text-stone-600 bg-stone-50 border border-stone-200 p-2.5 rounded-xl flex items-start gap-1.5">
          <span class="text-indigo-600">🗣️</span>
          <div style="white-space:pre-wrap;"><strong class="text-stone-700">考生作答語音轉譯：</strong>「${esc(item.transcript)}」</div>
        </div>
      ` : ''}

      ${isAIEval && fb ? `
        <!-- Gemini 評審三大面向維度卡 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-2 my-3.5">
          <div class="p-3 rounded-xl border border-indigo-100 bg-indigo-50/40 text-[12px]">
            <div class="font-bold text-indigo-900 flex items-center gap-1 mb-1">
              <span>🎯</span> 切題程度
            </div>
            <p class="text-stone-600 leading-relaxed">${esc(fb.relevance)}</p>
          </div>
          <div class="p-3 rounded-xl border border-purple-100 bg-purple-50/40 text-[12px]">
            <div class="font-bold text-purple-900 flex items-center gap-1 mb-1">
              <span>🗣️</span> 客語用詞道地度
            </div>
            <p class="text-stone-600 leading-relaxed">${esc(fb.vocabulary)}</p>
          </div>
          <div class="p-3 rounded-xl border border-emerald-100 bg-emerald-50/40 text-[12px]">
            <div class="font-bold text-emerald-900 flex items-center gap-1 mb-1">
              <span>📝</span> 語法流暢度
            </div>
            <p class="text-stone-600 leading-relaxed">${esc(fb.grammar)}</p>
          </div>
        </div>

        <!-- 考官講評 -->
        <div class="mb-3 text-[12.5px] bg-amber-50/60 border border-amber-200/80 p-3 rounded-xl">

function renderResult(){
  const avg = Math.round(state.log.reduce((s,x)=>s+x.score,0) / state.log.length);
  return `
  <div class="flex-1 px-5 py-10 fade-in">
    <div class="max-w-xl mx-auto">
      <div class="text-center mb-8">
        <p class="text-sm font-semibold tracking-wide" style="color:var(--indigo-4);">模擬客語能力認證口說測驗</p>
        <h1 class="font-display text-2xl md:text-3xl font-bold mt-2">測驗結算成績</h1>
        <div class="inline-flex items-baseline gap-2 mt-4 px-6 py-2.5 rounded-2xl bg-white border border-stone-200 shadow-sm">
          <span class="text-sm font-medium text-stone-500">平均總分：</span>
          <span class="font-display text-3xl font-black" style="color:${scoreColor(avg)};">${avg}</span>
          <span class="text-xs text-stone-400">/ 100</span>
        </div>
        <p class="text-[12.5px] mt-3" style="color:var(--ink-soft);">
          共完成 ${state.log.length} 題測驗，涵蓋看圖表達、口語表達、複誦與韻文朗讀。
        </p>
      </div>

      ${state.log.map((item, idx) => renderResultItem(item, idx)).join('')}

      <div class="flex justify-center mt-8">
        <button onclick="restartExam()" class="btn-ghost rounded-full px-8 py-3 font-semibold text-[14px] shadow-xs hover:shadow">重新開始測驗</button>
      </div>
    </div>
  </div>`;
}

function render(){
  const app = document.getElementById('app');
  let html = '';
  if (state.screen === 'intro') html = renderIntro();
  else if (state.screen === 'question') html = renderQuestion();
  else if (state.screen === 'result') html = renderResult();
  app.innerHTML = html;
}

render();
</script>
</body>
</html>
