<!doctype html>
<html lang="zh-Hant">

<head>
  <link rel="stylesheet" href="./hakka-font.css?v=20260907-font4">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>聽音辨字｜客語生活任務</title>
  <link rel="stylesheet" href="./Vocabulary.css?v=20260907-font1">
</head>

<body>
  <main class="game-shell">
    <header class="game-topbar"><a class="back-link" href="./index.html#basic">返回</a>
      <div>
        <h1>聽音辨字</h1>
      </div>
    </header>

    <section id="introScreen" class="screen intro-screen" aria-labelledby="introTitle">
      <div class="intro-copy">
        <section class="dialect-area" aria-labelledby="dialectTitle">
          <h3 id="dialectTitle">選擇腔別</h3>
          <div class="dialect-switcher">
            <button class="dialect is-active" type="button" data-dialect="sixian">四縣腔</button>
            <button class="dialect" type="button" disabled aria-disabled="true">海陸腔</button>
            <button class="dialect" type="button" disabled aria-disabled="true">大埔腔</button>
            <button class="dialect" type="button" disabled aria-disabled="true">饒平腔</button>
            <button class="dialect" type="button" disabled aria-disabled="true">詔安腔</button>
            <button class="dialect" type="button" disabled aria-disabled="true">南四縣腔</button>
          </div>
        </section>

        <section class="lesson-area" aria-labelledby="lessonTitle">
          <div class="lesson-heading">
            <h3 id="lessonTitle">選擇單元</h3>
            <p id="lessonHint">請選擇單元開始。</p>
          </div>
          <div class="lesson-carousel-wrap">
            <div class="lesson-carousel " id="lessonCarousel" aria-label="單元卡片">
              <button class="lesson-card is-locked" type="button" data-lesson="classroom-stage-1"
                data-url="./basic-listening.html" disabled aria-disabled="true">
                <img src="./assets/vocabulary-card-primary-scene.png" alt="客語互動場景">
                <span>學習階段1</span>
                <strong>聽音辨字1</strong>
                <small>聆聽音檔，輸入客語詞彙，看圖學習對應的單詞。</small>
              </button>

              <button class="lesson-card" type="button" data-lesson="field-trip" data-url="./basic-listening.html">
                <img src="./assets/lesson-card-2-outdoor-learning.png" alt="戶外教學趣">
                <span>學習階段2</span>
                <strong>聽音辨字2</strong>
                <small>聆聽音檔，輸入客語詞彙，看圖學習對應的單詞。</small>
              </button>
            </div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script src="./classroom.js?v=20260909-classroom1"></script>
</body>

</html>
